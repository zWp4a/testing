          ? `Venció el ${r.dueDate.slice(8)} · hace ${Math.abs(r.daysLeft)} día${Math.abs(r.daysLeft) === 1 ? '' : 's'}`
          : r.daysLeft === 0 ? 'Vence hoy' : `Vence en ${r.daysLeft} día${r.daysLeft === 1 ? '' : 's'}`,
        amount: r.fixed.amountCents,
        tag: { level: r.status === 'overdue' ? 'critical' : 'warning', text: r.status === 'overdue' ? 'Vencido' : 'Pronto' },
        onClick: () => navigate('fijos', { month: mKey }),
      })),
      { title: 'Ojo con esto', meta: `${urgent.length} pendiente${urgent.length > 1 ? 's' : ''}` },
    ));
  }

  /* --- quién puso cuánto --- */
  if (summary.total > 0) {
    const card = el('section', { class: 'card' }, [
      el('div', { class: 'card__head' }, [
        el('h2', { class: 'card__title grow', text: 'Quién puso la plata' }),
        el('span', { class: 'card__meta', text: fmt(summary.total) }),
      ]),
      splitBar(roster.map((p) => ({ label: p.name, value: summary.paid[p.id] || 0, color: p.color }))),
      el('div', { class: 'divider' }),
      el('div', { class: 'stack' }, roster.map((p) => el('div', { class: 'row' }, [
        avatar(p),
        el('span', { class: 'grow small', text: p.name }),
        el('span', { class: 'small muted', text: 'le tocaba' }),
        el('span', { class: 'small num', style: 'font-weight:640;min-width:88px;text-align:right', text: fmt(summary.owed[p.id] || 0) }),
      ]))),
    ]);
    root.append(card);
  }

  /* --- por categoría --- */
  if (summary.categories.length) {
    root.append(el('section', { class: 'card' }, [
      el('div', { class: 'card__head' }, [
        el('h2', { class: 'card__title grow', text: 'En qué se fue' }),
        el('span', {
          class: 'card__meta',
          text: `${summary.categories.length} categoría${summary.categories.length === 1 ? '' : 's'}`,
        }),
      ]),
      barList(summary.categories.slice(0, 8).map((c) => {
        const cat = store.category(c.id);
        return { label: `${cat.emoji} ${cat.name}`, value: c.cents };
      })),
    ]));
  }

  /* --- tendencia --- */
  const trend = monthlyTrend(6, mKey);
  if (trend.some((t) => t.total > 0)) {
    root.append(el('section', { class: 'card' }, [
      el('div', { class: 'card__head' }, [
        el('h2', { class: 'card__title grow', text: 'Últimos 6 meses' }),
        el('span', { class: 'card__meta', text: 'total mensual' }),
      ]),
      trendChart(trend, { currentKey: mKey }),
    ]));
  }

  /* --- presupuestos --- */
  const budgets = budgetStatus(mKey);
  if (budgets.length) {
    root.append(el('section', { class: 'card' }, [
      el('div', { class: 'card__head' }, [
        el('h2', { class: 'card__title grow', text: 'Presupuestos' }),
        el('button', { class: 'linkbtn', type: 'button', text: 'Editar', onclick: () => navigate('ajustes') }),
      ]),
      barList(budgets.map((b) => ({
        label: `${b.category.emoji} ${b.category.name} · ${Math.round(b.pct * 100)}%`,
        value: b.used,
        level: b.level,
      })), { max: Math.max(...budgets.map((b) => Math.max(b.budget, b.used))) }),
      el('p', { class: 'field__hint', style: 'margin-top:10px', text: 'La barra se pone amarilla al 80% y roja al pasarse.' }),
    ]));
  }

  /* --- metas --- */
  const goals = store.list('goals');
  if (goals.length) {
    root.append(listCard(goals.slice(0, 3).map((g) => {
      const p = goalProgress(g);
      return listItem({
        icon: '🎯',
        title: g.name,
        subtitle: `${fmt(p.saved)} de ${fmt(p.target)} · ${Math.round(p.pct * 100)}%`,
        amount: fmt(p.remaining),
        onClick: () => navigate('metas'),
      });
    }), { title: 'Metas de ahorro' }));
  }

  /* --- últimos movimientos --- */
  if (summary.expenses.length) {
    root.append(listCard(
      summary.expenses.slice(0, 6).map((e) => expenseRow(e)),
      {
        title: 'Últimos gastos',
        action: el('button', { class: 'linkbtn', type: 'button', text: 'Ver todos', onclick: () => navigate('gastos', { month: mKey }) }),
      },
    ));
  } else {
    root.append(el('section', { class: 'card' }, [
      emptyState('🧾', 'Todavía no hay gastos en este mes',
        'Cargá el primero y la app se encarga de dividirlo y llevar la cuenta.',
        'Cargar un gasto', () => openExpenseForm(null, { date: defaultDateFor(mKey) })),
    ]));
  }

  /* --- pagos entre ustedes --- */
  const setts = store.list('settlements').filter((s) => s.date.slice(0, 7) === mKey);
  if (setts.length) {
    root.append(listCard(setts.map((s) => listItem({
      icon: '🤝',
      title: `${store.person(s.fromId).name} → ${store.person(s.toId).name}`,
      subtitle: s.note || 'Pago entre ustedes',
      amount: s.amountCents,
      onClick: async () => {
        const { confirmSheet } = await Promise.resolve(__req("js/ui.js"));
        const ok = await confirmSheet('¿Borrar este pago?', 'Se vuelve a contar en el balance.', { confirmText: 'Borrar', danger: true });
        if (ok) { store.remove('settlements', s.id); toast('Pago eliminado.'); }
      },
    })), { title: 'Pagos entre ustedes' }));
  }
}

function expenseRow(e) {
  const cat = store.category(e.categoryId);
  const payer = store.person(e.paidBy);
  return listItem({
    icon: cat.emoji,
    title: e.description,
    subtitle: `${payer.name} · ${cat.name}`
      + (e.fx ? ` · ${fmtEn(e.fx.amountCents, e.fx.currency)}` : '')
      + (e.installment ? ` · cuota ${e.installment.n}/${e.installment.of}` : ''),
    amount: e.amountCents,
    onClick: () => openExpenseForm(e),
  });
}

function defaultDateFor(mKey) {
  const t = today();
  return t.slice(0, 7) === mKey ? t : `${mKey}-01`;
}

Object.assign(__exports, { openIncomeForm, openSettleForm, renderDashboard, expenseRow });
};

__defs["js/views/expenses.js"] = (__exports, __req) => {
/* Listado de gastos del mes, con búsqueda y filtros. */

const { el, currentMonth, dateLabel, today } = __req("js/util.js");
const store = __req("js/store.js");
const { expensesOfMonth, sharesOf, toCsv } = __req("js/calc.js");
const {
  fmt, fmtEn, monthNav, listCard, listItem, emptyState, input, select, toast,
} = __req("js/ui.js");
const { openExpenseForm } = __req("js/views/expense-form.js");
const { navigate } = __req("js/router.js");
const { download, SIN_DESCARGA } = __req("js/util.js");

const filters = { q: '', categoryId: '', paidBy: '' };

function renderExpenses(root, params) {
  const mKey = params.month || currentMonth();
  const locale = store.state.settings.locale;
  const roster = store.people();
  const all = expensesOfMonth(mKey);

  root.append(monthNav(mKey, (m) => navigate('gastos', { month: m })));

  /* --- filtros --- */
  const searchInput = input({
    type: 'search', placeholder: 'Buscar gasto…', value: filters.q,
    dataset: { focusKey: 'buscador' },
    oninput: (e) => { filters.q = e.target.value; paint(); },
  });
  const catSel = select(
    [{ value: '', label: 'Todas las categorías' }, ...store.categories().map((c) => ({ value: c.id, label: `${c.emoji} ${c.name}` }))],
    filters.categoryId,
    { onchange: (e) => { filters.categoryId = e.target.value; paint(); } },
  );
  const paidSel = select(
    [{ value: '', label: 'Pagó cualquiera' }, ...roster.map((p) => ({ value: p.id, label: `Pagó ${p.name}` }))],
    filters.paidBy,
    { onchange: (e) => { filters.paidBy = e.target.value; paint(); } },
  );

  root.append(el('section', { class: 'card' }, [
    el('div', { style: 'margin-bottom:10px' }, [searchInput]),
    el('div', { class: 'grid-2' }, [catSel, paidSel]),
  ]));

  const container = el('div');
  root.append(container);

  function paint() {
    container.replaceChildren();
    const q = filters.q.trim().toLowerCase();
    const rows = all.filter((e) => {
      if (filters.categoryId && e.categoryId !== filters.categoryId) return false;
      if (filters.paidBy && e.paidBy !== filters.paidBy) return false;
      if (q) {
        const hay = `${e.description} ${store.category(e.categoryId).name} ${e.note || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (!rows.length) {
      container.append(el('section', { class: 'card' }, [
        all.length
          ? emptyState('🔍', 'Nada con ese filtro', 'Probá con otra búsqueda o limpiá los filtros.', 'Limpiar filtros', () => {
            filters.q = ''; filters.categoryId = ''; filters.paidBy = '';
            navigate('gastos', { month: mKey });
          })
          : emptyState('🧾', 'Mes sin gastos', 'Cargá el primero con el botón ＋.', 'Cargar gasto', () => openExpenseForm(null, { date: defaultDateFor(mKey) })),
      ]));
      return;
    }

    const total = rows.reduce((s, e) => s + (e.amountCents || 0), 0);

    /* Agrupado por día, como un extracto bancario. */
    const groups = new Map();
    rows.forEach((e) => {
      if (!groups.has(e.date)) groups.set(e.date, []);
      groups.get(e.date).push(e);
    });

    const children = [];
    [...groups.entries()].forEach(([date, items]) => {
      const dayTotal = items.reduce((s, e) => s + (e.amountCents || 0), 0);
      children.push(el('div', { class: 'list__group row row--between' }, [
        el('span', { text: dateLabel(date, locale) }),
        el('span', { class: 'num', text: fmt(dayTotal) }),
      ]));
      items.forEach((e) => {
        const cat = store.category(e.categoryId);
        const payer = store.person(e.paidBy);
        const shares = sharesOf(e, roster);
        const mine = store.me();
        const myShare = shares[mine.id] || 0;
        children.push(listItem({
          icon: cat.emoji,
          title: e.description,
          subtitle: `Pagó ${payer.name} · te toca ${fmt(myShare)}`
            + (e.fx ? ` · ${fmtEn(e.fx.amountCents, e.fx.currency)}` : '')
            + (e.installment ? ` · cuota ${e.installment.n}/${e.installment.of}` : ''),
          amount: e.amountCents,
          onClick: () => openExpenseForm(e),
        }));
      });
    });

    container.append(listCard(children, {
      title: `${rows.length} gasto${rows.length === 1 ? '' : 's'}`,
      meta: fmt(total),
    }));

    container.append(el('div', { class: 'row', style: 'gap:8px;margin-top:4px' }, [
      el('button', {
        class: 'btn btn--sm grow', type: 'button', text: '⬇ Exportar CSV del mes',
        onclick: () => {
          const ok = download(`gastos-${mKey}.csv`, toCsv(mKey), 'text/csv');
          toast(ok ? 'CSV descargado. Se abre en Excel o Sheets.' : SIN_DESCARGA);
        },
      }),
    ]));
  }

  paint();
}

function defaultDateFor(mKey) {
  const t = today();
  return t.slice(0, 7) === mKey ? t : `${mKey}-01`;
}

Object.assign(__exports, { renderExpenses });
};

__defs["js/views/fixed.js"] = (__exports, __req) => {
/* Gastos fijos: alquiler, expensas, servicios y suscripciones del mes. */

const { el, currentMonth, clampDay, toCents, fromCents, monthLabel } = __req("js/util.js");
const store = __req("js/store.js");
const { fixedStatus } = __req("js/calc.js");
const {
  fmt, monthNav, listCard, listItem, emptyState, field, input, select, segmented,
  footerButtons, openSheet, closeSheet, toast, confirmSheet,
} = __req("js/ui.js");
const { navigate } = __req("js/router.js");

const STATUS_TAG = {
  paid: { level: 'good', text: 'Pagado' },
  overdue: { level: 'critical', text: 'Vencido' },
  'due-soon': { level: 'warning', text: 'Pronto' },
  pending: null,
};

function openFixedForm(existing = null) {
  const roster = store.people();
  const isEdit = Boolean(existing);
  const draft = existing ? { ...existing } : {
    name: '',
    amountCents: 0,
    categoryId: 'expensas',
    dayOfMonth: 1,
    paidBy: store.me().id,
    splitMode: 'equal',
    splitTo: null,
    splitPct: null,
    active: true,
    variable: false,
  };

  const nameInput = input({ type: 'text', placeholder: 'Edenor, expensas, Netflix…', value: draft.name });
  const amountInput = input({
    class: 'input input--amount', type: 'text', inputmode: 'decimal',
    value: draft.amountCents ? String(fromCents(draft.amountCents)).replace('.', ',') : '',
    'aria-label': 'Monto',
  });
  const daySel = select(
    Array.from({ length: 31 }, (_, i) => ({ value: i + 1, label: `Día ${i + 1}` })),
    draft.dayOfMonth,
    { onchange: (e) => { draft.dayOfMonth = Number(e.target.value); } },
  );
  const catSel = select(
    store.categories().map((c) => ({ value: c.id, label: `${c.emoji} ${c.name}` })),
    draft.categoryId,
    { onchange: (e) => { draft.categoryId = e.target.value; } },
  );
  const payerSeg = segmented(
    roster.map((p) => ({ value: p.id, label: p.name })),
    roster.some((p) => p.id === draft.paidBy) ? draft.paidBy : roster[0].id,
    (v) => { draft.paidBy = v; },
  );
  const splitSeg = segmented(
    roster.length === 2
      ? [
        { value: 'equal', label: 'Mitad y mitad' },
        { value: `single:${roster[0].id}`, label: `Solo ${roster[0].name}` },
        { value: `single:${roster[1].id}`, label: `Solo ${roster[1].name}` },
      ]
      : [{ value: 'equal', label: 'Partes iguales' }, { value: 'single', label: 'Una sola persona' }],
    draft.splitMode === 'single' && roster.length === 2 ? `single:${draft.splitTo}` : draft.splitMode,
    (v) => {
      if (v.startsWith('single')) {
        draft.splitMode = 'single';
        draft.splitTo = v.includes(':') ? v.slice(7) : draft.paidBy;
      } else {
        draft.splitMode = 'equal';
        draft.splitTo = null;
      }
    },
  );
  const variableBox = input({ type: 'checkbox', class: 'switch__box', checked: draft.variable });

  function save() {
    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); toast('Ponele un nombre.'); return; }
    const payload = {
      name,
      amountCents: toCents(amountInput.value),
      categoryId: draft.categoryId,
      dayOfMonth: draft.dayOfMonth,
      paidBy: draft.paidBy,
      splitMode: draft.splitMode,
      splitTo: draft.splitTo,
      splitPct: null,
      active: true,
      variable: variableBox.checked,
    };
    if (isEdit) store.update('fixed', existing.id, payload);
    else store.add('fixed', payload);
    closeSheet();
    toast(isEdit ? 'Gasto fijo actualizado.' : 'Gasto fijo agregado.');
  }

  async function del() {
    const ok = await confirmSheet('¿Borrar el fijo?', `Se deja de recordar "${existing.name}". Los gastos ya cargados quedan.`, {
      confirmText: 'Borrar', danger: true,
    });
    if (!ok) return;
    store.remove('fixed', existing.id);
    toast('Gasto fijo eliminado.', { action: 'Deshacer', onAction: () => store.restore('fixed', existing.id) });
  }

  openSheet(isEdit ? 'Editar gasto fijo' : 'Nuevo gasto fijo', el('div', {}, [
    field('Nombre', nameInput),
    field('Monto habitual', amountInput, 'Si cambia todos los meses, activá "monto variable" abajo.'),
    el('div', { class: 'grid-2', style: 'margin-bottom:13px' }, [
      field('Vence', daySel),
      field('Categoría', catSel),
    ]),
    field('Suele pagarlo', payerSeg),
    field('División', splitSeg),
    el('label', { class: 'field' }, [
      el('span', { class: 'switch' }, [
        el('span', {}, [
          el('span', { class: 'field__label', style: 'margin:0', text: 'Monto variable' }),
          el('span', { class: 'field__hint', style: 'margin-top:2px', text: 'Para luz o gas: al marcarlo pagado te pide el importe real.' }),
        ]),
        variableBox,
      ]),
    ]),
    footerButtons(isEdit ? 'Guardar' : 'Agregar', save, {
      extra: isEdit ? el('button', { class: 'btn btn--danger', type: 'button', text: 'Borrar', onclick: del }) : null,
    }),
  ]));
}

/** Marca un fijo como pagado creando el gasto real del mes. */
function markPaid(row, mKey) {
  const f = row.fixed;
  const create = (cents, paidBy) => {
    store.add('expenses', {
      date: row.dueDate,
      description: f.name,
      amountCents: cents,
      categoryId: f.categoryId,
      paidBy,
      splitMode: f.splitMode || 'equal',
      splitTo: f.splitTo || null,
      splitPct: f.splitPct || null,
      note: '',
      fixedId: f.id,
      createdAt: new Date().toISOString(),
    });
    toast(`${f.name} marcado como pagado.`);
  };

  if (!f.variable && f.amountCents > 0) {
    create(f.amountCents, f.paidBy);
    return;
  }

  const roster = store.people();
  const amountInput = input({
    class: 'input input--amount', type: 'text', inputmode: 'decimal',
    value: f.amountCents ? String(fromCents(f.amountCents)).replace('.', ',') : '',
    'aria-label': 'Monto',
  });
  let payer = roster.some((p) => p.id === f.paidBy) ? f.paidBy : roster[0].id;
  openSheet(`Pagar ${f.name}`, el('div', {}, [
    el('p', { class: 'muted small', style: 'margin-bottom:12px', text: `Vencimiento: ${row.dueDate.slice(8)} de ${monthLabel(mKey, store.state.settings.locale)}.` }),
    field('¿Cuánto vino?', amountInput),
    field('¿Quién pagó?', segmented(roster.map((p) => ({ value: p.id, label: p.name })), payer, (v) => { payer = v; })),
    footerButtons('Marcar pagado', () => {
      const cents = toCents(amountInput.value);
      if (cents <= 0) { toast('Poné el importe.'); return; }
      create(cents, payer);
      // Guardamos el último importe para que la próxima vez arranque cerca.
      store.update('fixed', f.id, { amountCents: cents });
      closeSheet();
    }),
  ]));
  setTimeout(() => amountInput.focus(), 60);
}

function renderFixed(root, params) {
  const mKey = params.month || currentMonth();
  const { rows, pendingCents, pendingCount } = fixedStatus(mKey);
  const locale = store.state.settings.locale;

  root.append(monthNav(mKey, (m) => navigate('fijos', { month: m })));

  if (!rows.length) {
    root.append(el('section', { class: 'card' }, [
      emptyState('📅', 'Sin gastos fijos cargados',
        'Cargá las expensas y los servicios una vez y la app te los recuerda todos los meses.',
        'Agregar el primero', () => openFixedForm()),
    ]));
    return;
  }

  const paidCents = rows.filter((r) => r.expense).reduce((s, r) => s + (r.expense.amountCents || 0), 0);
  root.append(el('div', { class: 'tiles' }, [
    el('div', { class: 'tile' }, [
      el('p', { class: 'tile__label', text: 'Ya pagado' }),
      el('p', { class: 'tile__value', text: fmt(paidCents) }),
    ]),
    el('div', { class: 'tile' }, [
      el('p', { class: 'tile__label', text: 'Falta pagar' }),
      el('p', { class: 'tile__value', text: fmt(pendingCents) }),
      el('p', { class: 'tile__delta tile__delta--flat', text: `${pendingCount} pendiente${pendingCount === 1 ? '' : 's'}` }),
    ]),
  ]));

  const items = rows.map((r) => {
    const cat = store.category(r.fixed.categoryId);
    const paid = Boolean(r.expense);
    const action = paid
      ? el('button', {
        class: 'btn btn--sm btn--ghost', type: 'button', text: 'Deshacer',
        onclick: async (ev) => {
          ev.stopPropagation();
          const ok = await confirmSheet('¿Desmarcar el pago?', `Se borra el gasto de ${fmt(r.expense.amountCents)} de "${r.fixed.name}".`, { confirmText: 'Desmarcar', danger: true });
          if (ok) { store.remove('expenses', r.expense.id); toast('Marcado como pendiente otra vez.'); }
        },
      })
      : el('button', {
        class: 'btn btn--sm btn--primary', type: 'button', text: 'Pagar',
        onclick: (ev) => { ev.stopPropagation(); markPaid(r, mKey); },
      });

    return listItem({
      icon: cat.emoji,
      title: r.fixed.name,
      subtitle: paid
        ? `Pagó ${store.person(r.expense.paidBy).name} · ${fmt(r.expense.amountCents)}`
        : `Vence el ${clampDay(mKey, r.fixed.dayOfMonth)} · ${r.fixed.variable ? 'monto variable' : fmt(r.fixed.amountCents)}`,
      tag: STATUS_TAG[r.status],
      trailing: action,
      onClick: () => openFixedForm(r.fixed),
    });
  });

  root.append(listCard(items, {
    title: `Fijos de ${monthLabel(mKey, locale)}`,
    meta: `${rows.length} en total`,
  }));

  const pendientes = rows.filter((r) => !r.expense && !r.fixed.variable && r.fixed.amountCents > 0);
  root.append(el('div', { class: 'stack', style: 'margin-top:4px' }, [
    pendientes.length > 1 ? el('button', {
      class: 'btn btn--block', type: 'button',
      text: `Marcar todos los pendientes como pagados (${fmt(pendientes.reduce((s, r) => s + r.fixed.amountCents, 0))})`,
      onclick: async () => {
        const ok = await confirmSheet('¿Marcar todo como pagado?', `Se crean ${pendientes.length} gastos con los montos habituales.`, { confirmText: 'Sí, marcar' });
        if (!ok) return;
        pendientes.forEach((r) => markPaid(r, mKey));
        toast(`${pendientes.length} fijos cargados.`);
      },
    }) : null,
    el('button', { class: 'btn btn--block', type: 'button', text: '＋ Nuevo gasto fijo', onclick: () => openFixedForm() }),
  ]));
}

Object.assign(__exports, { openFixedForm, renderFixed });
};

__defs["js/scan.js"] = (__exports, __req) => {
/* Lectura de tickets: de una foto (o del texto pegado) a una lista de productos.
 *
 * La foto se manda a la API de Claude, que devuelve los renglones ya
 * ordenados. Requiere una clave propia, que se carga en Ajustes y queda
 * guardada sólo en este navegador — nunca se sube al repositorio ni viaja
 * con la sincronización.
 *
 * Sin clave, el pegado de texto sigue funcionando: se parsea acá mismo, sin
 * red y sin costo. Es el camino gratis, y el parser de abajo está hecho para
 * aguantar lo que escupen Live Text (iPhone) y Google Lens (Android).
 */

const { config } = __req("js/store.js");
const { toCents } = __req("js/util.js");

const API_URL = 'https://api.anthropic.com/v1/messages';

/* Lado largo máximo de la foto que mandamos. Los tickets tienen letra chica:
   bajar de acá empieza a costar renglones mal leídos. */
const LADO_MAXIMO = 2000;

/* ------------------------------------------------------------- modelos */

/* `usdPorTicket` es una estimación con un ticket típico de supermercado:
   la foto pesa unos 2.500 tokens de entrada y la lista de productos otros
   1.200 de salida. Sirve para mostrar el costo en Ajustes, no para facturar.

   `efecto` marca los modelos que aceptan `output_config.effort`. Si alguno
   deja de aceptarlo, el reintento de `leerTicket` lo resuelve solo. */
const MODELOS = [
  {
    id: 'claude-haiku-4-5',
    nombre: 'Rápido',
    detalle: 'El más barato y el más rápido. Alcanza para un ticket bien sacado.',
    usdPorTicket: 0.009,
    efecto: false,
  },
  {
    id: 'claude-sonnet-5',
    nombre: 'Equilibrado',
    detalle: 'Se defiende mejor con letra chica y renglones cortados.',
    usdPorTicket: 0.017,
    efecto: true,
  },
  {
    id: 'claude-opus-5',
    nombre: 'El que mejor lee',
    detalle: 'Para tickets arrugados, borrosos o muy largos.',
    usdPorTicket: 0.043,
    efecto: true,
  },
];

const MODELO_POR_DEFECTO = 'claude-haiku-4-5';

function modeloActual() {
  return MODELOS.find((m) => m.id === config.scanModel)
    || MODELOS.find((m) => m.id === MODELO_POR_DEFECTO);
}

function tieneClave() {
  return Boolean(config.anthropicKey);
}

/* ------------------------------------------------------------- la imagen */

/**
 * Reduce la foto antes de mandarla: una foto de celular pesa varios MB y
 * tarda una eternidad en subir por datos móviles.
 * @returns {Promise<{base64: string, mediaType: string}>}
 */
function prepararImagen(file) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onerror = () => reject(new Error('No se pudo leer la foto.'));
    lector.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('El archivo no parece una imagen.'));
      img.onload = () => {
        const escala = Math.min(1, LADO_MAXIMO / Math.max(img.width, img.height));
        const w = Math.round(img.width * escala);
        const h = Math.round(img.height * escala);
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        resolve({ base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(file);
  });
}

/* ------------------------------------------------------------ la llamada */

const ESQUEMA = {
  type: 'object',
  properties: {
    comercio: { type: 'string', description: 'Nombre del comercio, o cadena vacía si no se ve.' },
    fecha: { type: 'string', description: 'Fecha del ticket en formato YYYY-MM-DD, o cadena vacía.' },
    moneda: { type: 'string', enum: ['UYU', 'USD'], description: 'Moneda del ticket.' },
    total: { type: 'number', description: 'Total pagado según el ticket. 0 si no se ve.' },
    productos: {
      type: 'array',
      description: 'Un elemento por renglón de producto del ticket.',
      items: {
        type: 'object',
        properties: {
          nombre: { type: 'string', description: 'Nombre del producto tal como figura, en minúsculas salvo la inicial.' },
          cantidad: { type: 'number', description: 'Unidades o kilos. 1 si el ticket no lo aclara.' },
          precioTotal: { type: 'number', description: 'Lo que se pagó por ese renglón.' },
        },
        required: ['nombre', 'cantidad', 'precioTotal'],
        additionalProperties: false,

  },
  required: ['comercio', 'fecha', 'moneda', 'total', 'productos'],
  additionalProperties: false,

const INSTRUCCIONES = [
  'Esta es la foto de un ticket de compra, casi siempre de un supermercado de Uruguay.',
  'Extraé todos los renglones de productos con su precio.',
  '',
  'Tené en cuenta:',
  '- Los precios usan coma decimal (1.234,56 son mil doscientos treinta y cuatro con 56).',
  '- Devolvé los números como números, sin símbolos de moneda ni separadores de miles.',
  '- "precioTotal" es lo que se pagó por ese renglón, no el precio unitario.',
  '- Los renglones de descuento, ahorro o promoción van con precioTotal negativo.',
  '- No incluyas subtotales, IVA, medios de pago, ni el total general en la lista de productos.',
  '- Si un renglón está borroso o cortado, incluilo igual con lo que se llegue a leer.',
  '- Si la foto no es un ticket, devolvé la lista de productos vacía y total 0.',
].join('\n');

/* Cuando el modelo no acepta el esquema, hay que pedirle el JSON a mano. */

  INSTRUCCIONES,
  '',
  'Respondé únicamente con un objeto JSON, sin texto alrededor ni bloques de código, con esta forma:',
  '{"comercio": "", "fecha": "YYYY-MM-DD", "moneda": "UYU", "total": 0,',
  ' "productos": [{"nombre": "", "cantidad": 1, "precioTotal": 0}]}',
].join('\n');

/* Se prueba de arriba hacia abajo. Cada escalón saca un parámetro que algún
   modelo podría no aceptar, así un 400 por parámetro no deja al usuario sin
   escáner en el medio del súper. */
const INTENTOS = [
  { efecto: true, esquema: true },
  { efecto: false, esquema: true },
  { efecto: false, esquema: false },
];

function armarCuerpo(modelo, imagen, intento) {
  const cuerpo = {
    model: modelo.id,
    max_tokens: 8000,
    messages: [{
      role: 'user',
      content: [
        { type: 'image', source: { type: 'base64', media_type: imagen.mediaType, data: imagen.base64 } },
        { type: 'text', text: intento.esquema ? INSTRUCCIONES : INSTRUCCIONES_JSON },
      ],
    }],
  };

  const salida = {};
  if (intento.esquema) salida.format = { type: 'json_schema', schema: ESQUEMA };
  if (intento.efecto && modelo.efecto) salida.effort = 'low';
  if (Object.keys(salida).length) cuerpo.output_config = salida;

  return cuerpo;
}

/* Un 400 por un parámetro que este modelo no conoce se puede reintentar sin
   él; uno por falta de saldo o por la imagen, no. */
function esProblemaDeParametro(status, detalle) {
  if (status !== 400) return false;
  return /unexpected|unsupported|not supported|unrecognized|unknown|extra input|invalid[^.]*(parameter|field|argument)|output_config|effort|json_schema|schema/i
    .test(detalle);
}

/**
 * Manda la foto a Claude y devuelve los productos leídos.
 * @returns {Promise<{comercio, fecha, moneda, totalCents, sumaCents, productos}>}
 */
async function leerTicket(file) {
  if (!tieneClave()) throw new Error('Falta la clave de Claude. Se carga en Ajustes.');

  const modelo = modeloActual();
  const imagen = await prepararImagen(file);

  let ultimoError = 'No se pudo leer el ticket.';

  for (let i = 0; i < INTENTOS.length; i += 1) {
    const intento = INTENTOS[i];

    // Saltea los escalones que no cambian nada para este modelo.
    if (intento.efecto && !modelo.efecto) continue;

    const res = await pedir(armarCuerpo(modelo, imagen, intento));

    if (res.ok) return normalizar(await leerRespuesta(res, intento));

    const detalle = await detalleDelError(res);
    ultimoError = mensajeDeError(res.status, detalle);

    if (!esProblemaDeParametro(res.status, detalle) || i === INTENTOS.length - 1) {
      throw new Error(ultimoError);
    }
  }

  throw new Error(ultimoError);
}

async function pedir(cuerpo) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 120000);
  try {
    return await fetch(API_URL, {
      method: 'POST',
      signal: ctrl.signal,
      headers: {
        'content-type': 'application/json',
        'x-api-key': config.anthropicKey,
        'anthropic-version': '2023-06-01',
        // Sin esto el navegador no puede llamar a la API directamente.
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify(cuerpo),
    });
  } catch (err) {
    if (err.name === 'AbortError') throw new Error('El ticket tardó demasiado. Probá con una foto más nítida.');
    throw new Error('No se pudo conectar. Revisá que tengas internet.');
  } finally {
    clearTimeout(timer);
  }
}

async function leerRespuesta(res, intento) {
  const data = await res.json();
  if (data.stop_reason === 'refusal') {
    throw new Error('La foto no se pudo procesar. Probá sacándola de nuevo, sólo del ticket.');
  }
  const texto = (data.content || []).find((b) => b.type === 'text')?.text;
  if (!texto) throw new Error('La respuesta vino vacía. Probá de nuevo.');

  const json = intento.esquema ? texto : recortarJson(texto);
  try {
    return JSON.parse(json);
  } catch {
    throw new Error('No se entendió la respuesta. Probá con otra foto.');
  }
}

/* Sin esquema el modelo puede envolver el JSON en explicaciones o en ```json. */
function recortarJson(texto) {
  const enBloque = texto.match(/```(?:json)?\s*([\s\S]*?)```/);
  const crudo = enBloque ? enBloque[1] : texto;
  const desde = crudo.indexOf('{');
  const hasta = crudo.lastIndexOf('}');
  return desde >= 0 && hasta > desde ? crudo.slice(desde, hasta + 1) : crudo;
}

async function detalleDelError(res) {
  try {
    const cuerpo = await res.json();
    return cuerpo?.error?.message || '';
  } catch {
    return '';
  }
}

function mensajeDeError(status, detalle) {
  if (status === 401) return 'La clave de Claude no es válida. Revisala en Ajustes.';
  if (status === 403) return 'La clave no tiene permiso para usar este modelo. Probá con otro en Ajustes.';
  if (status === 404) return 'Ese modelo no está disponible con tu clave. Elegí otro en Ajustes.';
  if (status === 400 && /credit|balance|saldo/i.test(detalle)) return 'La cuenta de Claude no tiene saldo.';
  if (status === 429) return 'Demasiados pedidos seguidos. Esperá un minuto y probá de nuevo.';
  if (status >= 500) return 'La API de Claude está caída. Probá en un rato.';
  return `No se pudo leer el ticket (error ${status})${detalle ? `: ${detalle.slice(0, 120)}` : ''}.`;
}

/* --------------------------------------------- pegar el texto del ticket */

/* Renglones que no son productos. Ojo: "descuento" solo sí es un producto
   (con precio negativo); lo que se ignora es el resumen de descuentos. */
const RUIDO = new RegExp([
  '^(sub\\s*-?\\s*total|total|iva|i\\.v\\.a|impuesto|imesi|redondeo)',
  '^(efectivo|contado|cambio|vuelto|su vuelto|entregado|recibido)',
  '^(tarjeta|d[ée]bito|cr[ée]dito|visa|master|oca|cabal|lider|midinero|abitab|redpagos|transferencia)',
  '^(forma de pago|medio de pago|abonado|paga con|pagado con)',
  '^(cuf|rut|r\\.u\\.t|dgi|cae|nro|n[°º]|caja|cajero|vendedor|terminal|suc|sucursal)',
  '^(ticket|e-?ticket|factura|comprobante|documento|serie|fecha|hora)',
  '^(gracias|vuelva|lo atendi|atendi[óo]|conserve|consulte|www\\.|http)',
  '^(socio|cliente|c[ée]dula|puntos|saldo|acumul)',
  '^(ahorro|total ahorrado|ahorraste|descuento total|total descuento)',
  '^(cantidad de|art[íi]culos|items|unidades)\\b',
].join('|'), 'i');

/* Formatos que aparecen en un ticket uruguayo: 1.234,56 · 89,00 · 1,234.56 · 12 */
const NUMERO = /-?\d{1,3}(?:\.\d{3})+,\d{1,2}|-?\d+,\d{1,2}|-?\d{1,3}(?:,\d{3})+\.\d{1,2}|-?\d+\.\d{1,2}|-?\d+/g;

/* "2 x 45,00" · "0,532 kg x 395,00".
   El precio unitario tiene que traer centavos: así "PROMO 2x1" no se confunde
   con una cantidad. */
const CANTIDAD = /(\d+(?:[.,]\d+)?)\s*(?:kg|kgs|kilos?|grs?|g|lts?|l|un|u|c\/u)?\s*[x×*]\s*(\d[\d.]*[.,]\d{2})/i;

const CODIGO_SOLO = /^\d{7,}$/;

/* Fecha y hora del encabezado: nunca son un producto. */
const FECHA_U_HORA = /\d{1,2}[/-]\d{1,2}[/-]\d{2,4}|\d{1,2}:\d{2}/;

function limpiarNombre(txt) {
  return String(txt)
    .replace(/^\d{6,}\s+/, '')        // código de barras adelante del nombre
    .replace(/^[\s.·*|>-]+/, '')      // viñetas y basura de OCR
    .replace(/[\s.·*|,>-]+$/, '')     // colgajos al final
    .replace(/\s+/g, ' ')
    .trim();
}

/** Interpreta un renglón suelto. `precioCents` en 0 significa "sin precio acá". */
function leerRenglon(linea) {
  const base = linea.replace(/[$]/g, ' ').replace(/\s+/g, ' ').trim();

  // Muchos tickets cierran el renglón con la letra del IVA: "89,00 A".
  const limpia = base.replace(
    /\s+[A-Za-z]{1,2}$/,
    (marca, donde) => (/\d$/.test(base.slice(0, donde)) ? '' : marca),
  );

  const numeros = [...limpia.matchAll(NUMERO)];
  if (!numeros.length) return { nombre: limpiarNombre(limpia), cantidad: 1, precioCents: 0 };

  const ultimo = numeros[numeros.length - 1];

  // El precio cierra el renglón. Si después del número sigue habiendo texto,
  // ese número es parte del nombre ("Leche 1L", "Av. Italia 2345 - Centro").
  if (ultimo.index + ultimo[0].length !== limpia.length) {
    return { nombre: limpiarNombre(limpia), cantidad: 1, precioCents: 0 };
  }

  const cant = limpia.match(CANTIDAD);

  let cantidad = 1;
  let precioCents;
  let corte;

  if (cant) {
    cantidad = Number(cant[1].replace(',', '.')) || 1;
    const finCantidad = cant.index + cant[0].length;
    precioCents = ultimo.index >= finCantidad
      // "2 x 45,00   90,00": el último número ya es el total del renglón.
      ? toCents(ultimo[0])
      // "2 x 45,00" solo: hay que multiplicar.
      : Math.round(toCents(cant[2]) * cantidad);
    corte = cant.index;
  } else {
    precioCents = toCents(ultimo[0]);
    corte = ultimo.index;
  }

  let nombre = limpiarNombre(limpia.slice(0, corte));

  // "2 LECHE" sin la x: el número de adelante es la cantidad.
  if (cantidad === 1) {
    const conCantidad = nombre.match(/^(\d{1,2})\s+(.{2,})$/);
    if (conCantidad) {
      cantidad = Number(conCantidad[1]) || 1;
      nombre = conCantidad[2];
    }
  }

  return { nombre, cantidad, precioCents };
}

function buscarTotal(lineas) {
  let total = 0;
  lineas.forEach((linea) => {
    if (!/^total\b/i.test(linea)) return;
    if (/ahorr|descuent|art[íi]cul|item|unidad/i.test(linea)) return;
    const numeros = [...linea.replace(/[$]/g, ' ').matchAll(NUMERO)];
    if (numeros.length) total = toCents(numeros[numeros.length - 1][0]);
  });
  return total;
}

function buscarFecha(lineas) {
  for (const linea of lineas) {
    const m = linea.match(/(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})/);
    if (!m) continue;
    const [, d, mes, anioCrudo] = m;
    const anio = anioCrudo.length === 2 ? `20${anioCrudo}` : anioCrudo;
    const iso = `${anio}-${mes.padStart(2, '0')}-${d.padStart(2, '0')}`;
    if (Number(mes) >= 1 && Number(mes) <= 12 && Number(d) >= 1 && Number(d) <= 31) return iso;
  }
  return '';
}

function buscarComercio(lineas) {
  for (const linea of lineas.slice(0, 6)) {
    if (RUIDO.test(linea) || CODIGO_SOLO.test(linea)) continue;
    const letras = (linea.match(/[a-záéíóúñ]/gi) || []).length;
    // Un encabezado es casi todo letras; un renglón de producto trae precio.
    if (letras >= 3 && letras / linea.length > 0.6) return linea.trim();
  }
  return '';
}

/**
 * Salida de emergencia sin clave ni internet: los celulares copian el texto de
 * una foto (Live Text en iPhone, Google Lens en Android) y acá se interpreta.
 *
 * Aguanta las formas habituales de un ticket uruguayo: el nombre y el precio
 * en renglones distintos, códigos de barras sueltos, cantidades por peso y
 * descuentos en negativo.
 */
function parsearTexto(texto) {
  const lineas = String(texto || '')
    .split(/\r?\n/)
    .map((l) => l.trim())
    .filter((l) => l.length);

  const productos = [];
  let pendiente = '';   // nombre leído que todavía espera su precio

  lineas.forEach((linea) => {
    if (RUIDO.test(linea)) { pendiente = ''; return; }
    if (CODIGO_SOLO.test(linea)) return;   // código de barras en su propio renglón
    if (FECHA_U_HORA.test(linea)) return;  // ya la levanta buscarFecha

    const r = leerRenglon(linea);

    if (!r.precioCents) {
      // Renglón sin precio: probablemente el nombre, y el precio viene abajo.
      if (r.nombre.length >= 2) pendiente = r.nombre;
      return;
    }

    const nombre = r.nombre.length >= 2 ? r.nombre : pendiente;
    pendiente = '';
    if (nombre.length < 2) return;

    productos.push({ nombre, cantidad: r.cantidad, precioTotal: r.precioCents / 100 });
  });

  const total = buscarTotal(lineas);

  return normalizar({
    comercio: buscarComercio(lineas),
    fecha: buscarFecha(lineas),
    moneda: 'UYU',
    total: total ? total / 100 : productos.reduce((s, p) => s + p.precioTotal, 0),
    productos,
  });
}

/* ---------------------------------------------------------- normalización */

/* Los tickets vienen en mayúscula de imprenta y en la lista quedan a los
   gritos. Si el nombre ya viene escrito normal, se respeta tal cual; una
   minúscula suelta ("2x1") no alcanza para considerarlo bien escrito. */
function presentarNombre(nombre) {
  const letras = (nombre.match(/[a-záéíóúñ]/gi) || []).length;
  const mayusculas = (nombre.match(/[A-ZÁÉÍÓÚÑ]/g) || []).length;
  if (!letras || mayusculas / letras < 0.8) return nombre;
  return nombre
    .toLowerCase()
    .replace(/(^|\s)([a-záéíóúñ])/g, (_, sep, letra) => sep + letra.toUpperCase())
    .replace(/\b(\d+[a-z]{1,3})\b/gi, (medida) => medida.toUpperCase());
}

function normalizar(leido) {
  const productos = (Array.isArray(leido.productos) ? leido.productos : [])
    .map((p) => ({
      nombre: presentarNombre(String(p.nombre || '').trim().slice(0, 80)),
      cantidad: Number(p.cantidad) > 0 ? Number(p.cantidad) : 1,
      precioCents: Math.round(Number(p.precioTotal || 0) * 100),
    }))
    .filter((p) => p.nombre);

  const sumado = productos.reduce((s, p) => s + p.precioCents, 0);
  const declarado = Math.round(Number(leido.total || 0) * 100);

  return {
    comercio: String(leido.comercio || '').trim().slice(0, 60),
    fecha: /^\d{4}-\d{2}-\d{2}$/.test(leido.fecha || '') ? leido.fecha : '',
    moneda: leido.moneda === 'USD' ? 'USD' : 'UYU',
    // Si el total del ticket no se leyó, la suma de los renglones sirve igual.
    totalCents: declarado > 0 ? declarado : sumado,
    sumaCents: sumado,
    productos,
  };
}

      el('span', { class: 'iconbtn__glyph', text: '⟳' }),
    ]),
    el('p', { class: 'muted small', style: 'margin-top:14px' },
      'Puede tardar hasta un minuto según la señal.'),
  ]));

  try {
    const leido = await leerTicket(file);
    if (!leido.productos.length) {
      openSheet('No se leyó nada', el('div', {}, [
        el('p', { class: 'muted small' },
          'No se encontraron productos en esa foto. Probá que entre el ticket completo, con buena luz y sin ángulo.'),
        footerButtons('Probar de nuevo', () => openScanForm(), { secondaryLabel: 'Cerrar' }),
      ]));
      return;
    }
    openRevision(leido);
  } catch (err) {
    openSheet('No se pudo leer', el('div', {}, [
      el('p', { class: 'muted small', text: err.message }),
      footerButtons('Probar de nuevo', () => openScanForm(), { secondaryLabel: 'Cerrar' }),
    ]));
  }
}

function openPegarTexto() {
  const area = el('textarea', {
    class: 'textarea',
    style: 'min-height:190px;font-family:ui-monospace,monospace;font-size:13px',
    placeholder: 'COCA COLA 1.5L      89,00\nPAN CASERO 2 x 45,00   90,00\n…',
  });

  openSheet('Pegar el texto del ticket', el('div', {}, [
    el('p', { class: 'muted small', style: 'margin-bottom:6px' },
      'Tu celular ya sabe leer el texto de una foto, gratis y sin cuenta:'),
    el('ul', { class: 'muted small', style: 'margin:0 0 14px;padding-left:20px;line-height:1.7' }, [
      el('li', {}, [el('strong', { text: 'iPhone' }), ': abrí la foto en Fotos, tocá el ícono de texto abajo a la derecha, ', el('em', { text: 'Seleccionar todo' }), ' y ', el('em', { text: 'Copiar' }), '.']),
      el('li', {}, [el('strong', { text: 'Android' }), ': abrí la foto y tocá ', el('strong', { text: 'Google Lens' }), ', después ', el('em', { text: 'Seleccionar todo' }), ' y ', el('em', { text: 'Copiar' }), '.']),
    ]),
    field('Texto del ticket', area),
    footerButtons('Leer', () => {
      const leido = parsearTexto(area.value);
      if (!leido.productos.length) {
        toast('No se reconoció ningún renglón con precio.');
        return;
      }
      openRevision(leido);
    }),
  ]));
}

/* ------------------------------------------------------------- revisión */

function openRevision(leido) {
  const roster = store.people();

  // Cada renglón se puede editar y desmarcar antes de confirmar.
  const filas = leido.productos.map((p) => ({ ...p, incluir: true }));

  let moneda = leido.moneda;
  let cotizacion = store.state.settings.usdRateCents || 0;
  let payer = store.me().id;
  let splitMode = 'equal';
  let sumarALista = true;

  const lista = el('div', { class: 'card card--flush', style: 'margin-bottom:12px' });
  const totalInput = input({
    class: 'input input--amount', type: 'text', inputmode: 'decimal',
    'aria-label': 'Total de la compra',
  });
  const resumen = el('p', { class: 'field__hint' });
  const cotizacionInput = input({
    type: 'text', inputmode: 'decimal', placeholder: '40,00',
    value: cotizacion ? String(cotizacion / 100).replace('.', ',') : '',
    oninput: (e) => { cotizacion = toCents(e.target.value); pintarResumen(); },
  });
  const cotizacionWrap = el('div');

  function sumaMarcada() {
    return filas.filter((f) => f.incluir).reduce((s, f) => s + f.precioCents, 0);
  }

  function totalEnPesos() {
    const escrito = toCents(totalInput.value);
    return moneda === 'USD' ? usdABase(escrito, cotizacion) : escrito;
  }

  function pintarResumen() {
    const marcados = filas.filter((f) => f.incluir).length;
    const suma = sumaMarcada();
    const total = totalEnPesos();
    const diferencia = total - (moneda === 'USD' ? usdABase(suma, cotizacion) : suma);

    resumen.replaceChildren(
      `${marcados} de ${filas.length} productos · suman ${moneda === 'USD' ? fmtEn(suma, 'USD') : fmt(suma)}`,
      Math.abs(diferencia) > 100
        ? el('span', { style: 'display:block;margin-top:4px;color:var(--text-secondary)' },
          `El total que cargás difiere en ${fmt(Math.abs(diferencia))} — puede ser por descuentos o renglones que no se leyeron.`)
        : null,
    );

    cotizacionWrap.replaceChildren();
    if (moneda === 'USD') {
      cotizacionWrap.append(
        field('Cotización del dólar', cotizacionInput),
        el('p', { class: 'field__hint', style: 'margin-top:-8px' },
          cotizacion ? `Se guarda como ${fmt(total)} en pesos.` : 'Falta la cotización.'),
      );
    }
  }

  function pintarLista() {
    lista.replaceChildren();
    filas.forEach((f, i) => {
      const check = el('input', {
        type: 'checkbox', class: 'shop__check', checked: f.incluir,
        'aria-label': `Incluir ${f.nombre}`,
        onchange: () => { f.incluir = !f.incluir; pintarLista(); pintarResumen(); },
      });
      const nombreInput = el('input', {
        class: 'shop__name', value: f.nombre,
        style: 'border:none;background:none;width:100%;font:inherit;color:inherit;padding:0',
        oninput: (e) => { f.nombre = e.target.value; },
      });
      const precioInput = el('input', {
        class: 'shop__price', inputmode: 'decimal',
        value: String(fromCents(f.precioCents)).replace('.', ','),
        style: 'border:none;background:none;width:88px;text-align:right;font:inherit;color:inherit;padding:0',
        'aria-label': `Precio de ${f.nombre}`,
        oninput: (e) => { filas[i].precioCents = toCents(e.target.value); pintarResumen(); },
      });
      lista.append(el('div', { class: `shop__item${f.incluir ? '' : ' is-done'}` }, [
        check,
        el('span', { class: 'shop__body' }, [
          nombreInput,
          f.cantidad && f.cantidad !== 1
            ? el('span', { class: 'shop__meta', text: `${f.cantidad}` })
            : null,
        ]),
        precioInput,
      ]));
    });
  }

  function guardar() {
    const marcados = filas.filter((f) => f.incluir);
    if (!marcados.length) { toast('No quedó ningún producto marcado.'); return; }
    const totalPesos = totalEnPesos();
    if (totalPesos <= 0) { toast('Poné cuánto pagaste.'); return; }
    if (moneda === 'USD' && !cotizacion) { toast('Falta la cotización del dólar.'); return; }

    const fx = moneda === 'USD'
      ? { currency: 'USD', amountCents: toCents(totalInput.value), rateCents: cotizacion }
      : null;
    if (fx) store.setSettings({ usdRateCents: cotizacion });

    store.add('expenses', {
      date: leido.fecha || today(),
      description: leido.comercio || `Compra (${marcados.length} productos)`,
      amountCents: totalPesos,
      fx,
      categoryId: 'super',
      paidBy: payer,
      splitMode,
      splitTo: splitMode === 'single' ? payer : null,
      splitPct: null,
      note: marcados.map((f) => f.nombre).join(', ').slice(0, 500),
      createdAt: new Date().toISOString(),
    });

    if (sumarALista) {
      // Quedan tildados: ya están comprados, y su precio sirve de referencia.
      marcados.forEach((f) => {
        store.add('shopping', {
          name: f.nombre,
          qty: f.cantidad || 1,
          unit: '',
          estPriceCents: 0,
          done: true,
          staple: false,
          lastPriceCents: f.cantidad > 1 ? Math.round(f.precioCents / f.cantidad) : f.precioCents,
        });
      });
    }

    closeSheet();
    toast(`Ticket cargado: ${fmt(totalPesos)} en ${marcados.length} productos.`);
  }

  const listaBox = el('input', { type: 'checkbox', class: 'switch__box', checked: sumarALista, onchange: (e) => { sumarALista = e.target.checked; } });

  const body = el('div', {}, [
    leido.comercio
      ? el('p', { class: 'muted small', style: 'margin-bottom:12px', text: `Ticket de ${leido.comercio}${leido.fecha ? ` · ${leido.fecha}` : ''}` })
      : el('p', { class: 'muted small', style: 'margin-bottom:12px', text: 'Revisá los renglones y corregí lo que haya salido mal.' }),

    lista,
    resumen,
    el('div', { class: 'divider' }),

    field('Total que pagaste', totalInput),
    segmented([
      { value: 'UYU', label: '$ Pesos' },
      { value: 'USD', label: 'US$ Dólares' },
    ], moneda, (v) => { moneda = v; pintarResumen(); }),
    cotizacionWrap,

    el('div', { style: 'height:13px' }),
    field('¿Quién pagó?', segmented(roster.map((p) => ({ value: p.id, label: p.name })), payer, (v) => { payer = v; })),
    field('División', segmented([
      { value: 'equal', label: 'Mitad y mitad' },
      { value: 'single', label: 'Lo banca quien pagó' },
    ], 'equal', (v) => { splitMode = v; })),

    el('label', { class: 'field' }, [
      el('span', { class: 'switch' }, [
        el('span', {}, [
          el('span', { class: 'field__label', style: 'margin:0', text: 'Sumarlos a la lista de compras' }),
          el('span', { class: 'field__hint', style: 'margin-top:2px', text: 'Quedan como comprados y con su precio, para estimar la próxima.' }),
        ]),
        listaBox,
      ]),
    ]),

    footerButtons('Cargar el ticket', guardar, { secondaryLabel: 'Descartar' }),
  ]);

  pintarLista();
  totalInput.value = String(fromCents(leido.totalCents)).replace('.', ',');
  totalInput.addEventListener('input', pintarResumen);
  pintarResumen();

  openSheet(`${leido.productos.length} productos leídos`, body);
}

Object.assign(__exports, { openScanForm });
};

__defs["js/views/shopping.js"] = (__exports, __req) => {
/* Lista de compras compartida: se marca en el súper y se cierra como gasto. */

const { el, toCents, fromCents, today } = __req("js/util.js");
const store = __req("js/store.js");
const { shoppingSummary } = __req("js/calc.js");
const {
  fmt, emptyState, field, input, select, segmented, footerButtons,
  openSheet, closeSheet, toast, confirmSheet,
} = __req("js/ui.js");
const { openScanForm } = __req("js/views/scan-form.js");

function itemPrice(item) {
  return (item.estPriceCents || item.lastPriceCents || 0) * (item.qty || 1);
}

function openItemForm(existing) {
  const draft = { ...existing };
  const nameInput = input({ type: 'text', value: draft.name });
  const qtyInput = input({ type: 'number', min: '0', step: '0.5', inputmode: 'decimal', value: draft.qty || 1 });
  const unitInput = input({ type: 'text', placeholder: 'kg, l, paq…', value: draft.unit || '' });
  const priceInput = input({
    type: 'text', inputmode: 'decimal', placeholder: '0,00',
    value: draft.estPriceCents ? String(fromCents(draft.estPriceCents)).replace('.', ',') : '',
  });
  const stapleBox = input({ type: 'checkbox', class: 'switch__box', checked: draft.staple });

  function save() {
    const name = nameInput.value.trim();
    if (!name) { toast('Falta el nombre.'); return; }
    store.update('shopping', existing.id, {
      name,
      qty: Number(qtyInput.value) || 1,
      unit: unitInput.value.trim(),
      estPriceCents: toCents(priceInput.value),
      staple: stapleBox.checked,
    });
    closeSheet();
  }

  async function del() {
    const ok = await confirmSheet('¿Sacarlo de la lista?', `Se elimina "${existing.name}".`, { confirmText: 'Sacar', danger: true });
    if (!ok) return;
    store.remove('shopping', existing.id);
    toast('Producto eliminado.', { action: 'Deshacer', onAction: () => store.restore('shopping', existing.id) });
  }

  openSheet('Editar producto', el('div', {}, [
    field('Producto', nameInput),
    el('div', { class: 'grid-2', style: 'margin-bottom:13px' }, [
      field('Cantidad', qtyInput),
      field('Unidad', unitInput),
    ]),
    field('Precio estimado (por unidad)', priceInput,
      existing.lastPriceCents ? `La última vez salió ${fmt(existing.lastPriceCents)}.` : 'Opcional: sirve para estimar el total.'),
    el('label', { class: 'field' }, [
      el('span', { class: 'switch' }, [
        el('span', {}, [
          el('span', { class: 'field__label', style: 'margin:0', text: 'Producto habitual' }),
          el('span', { class: 'field__hint', style: 'margin-top:2px', text: 'Vuelve solo a la lista cuando empezás una compra nueva.' }),
        ]),
        stapleBox,
      ]),
    ]),
    footerButtons('Guardar', save, {
      extra: el('button', { class: 'btn btn--danger', type: 'button', text: 'Borrar', onclick: del }),
    }),
  ]));
}

/** Cierra la compra: crea el gasto con lo marcado y limpia la lista. */
function openCheckout(summary) {
  const roster = store.people();
  const marked = summary.done;
  if (!marked.length) { toast('Marcá primero lo que compraste.'); return; }

  const amountInput = input({
    class: 'input input--amount', type: 'text', inputmode: 'decimal',
    value: summary.cartCents ? String(fromCents(summary.cartCents)).replace('.', ',') : '',
    'aria-label': 'Total',
  });
  let payer = store.me().id;
  let splitMode = 'equal';
  const catSel = select(
    store.categories().map((c) => ({ value: c.id, label: `${c.emoji} ${c.name}` })),
    'super',
  );
  const clearBox = input({ type: 'checkbox', class: 'switch__box', checked: true });

  function save() {
    const cents = toCents(amountInput.value);
    if (cents <= 0) { toast('Poné cuánto pagaste.'); return; }
    store.add('expenses', {
      date: today(),
      description: `Compra (${marked.length} producto${marked.length === 1 ? '' : 's'})`,
      amountCents: cents,
      categoryId: catSel.value,
      paidBy: payer,
      splitMode,
      splitTo: splitMode === 'single' ? payer : null,
      splitPct: null,
      note: marked.map((i) => i.name).join(', ').slice(0, 500),
      createdAt: new Date().toISOString(),
    });

    // Guardamos el precio estimado como "último precio" para la próxima vuelta.
    marked.forEach((i) => {
      if (i.estPriceCents) store.update('shopping', i.id, { lastPriceCents: i.estPriceCents });
    });

    if (clearBox.checked) {
      marked.forEach((i) => {
        if (i.staple) store.update('shopping', i.id, { done: false });
        else store.remove('shopping', i.id);
      });
    }
    closeSheet();
    toast(`Compra de ${fmt(cents)} cargada como gasto.`);
  }

  openSheet('Cerrar la compra', el('div', {}, [
    el('p', { class: 'muted small', style: 'margin-bottom:12px', text: `${marked.length} producto${marked.length === 1 ? '' : 's'} marcado${marked.length === 1 ? '' : 's'}. El estimado era ${fmt(summary.cartCents)}.` }),
    field('Total que pagaste', amountInput),
    field('Categoría', catSel),
    field('¿Quién pagó?', segmented(roster.map((p) => ({ value: p.id, label: p.name })), payer, (v) => { payer = v; })),
    field('División', segmented([
      { value: 'equal', label: 'Mitad y mitad' },
      { value: 'single', label: 'Lo banca quien pagó' },
    ], 'equal', (v) => { splitMode = v; })),
    el('label', { class: 'field' }, [
      el('span', { class: 'switch' }, [
        el('span', {}, [
          el('span', { class: 'field__label', style: 'margin:0', text: 'Vaciar la lista' }),
          el('span', { class: 'field__hint', style: 'margin-top:2px', text: 'Los productos habituales vuelven destildados.' }),
        ]),
        clearBox,
      ]),
    ]),
    footerButtons('Cargar como gasto', save),
  ]));
}

function renderShopping(root) {
  const summary = shoppingSummary();
  const { items, pending, done } = summary;

  /* --- alta rápida --- */
  const quick = input({
    type: 'text', placeholder: 'Agregar producto…', enterkeyhint: 'done', autocomplete: 'off',
    dataset: { focusKey: 'quickadd' },
    onkeydown: (e) => { if (e.key === 'Enter') addQuick(); },
  });
  function addQuick() {
    const name = quick.value.trim();
    if (!name) return;
    // "2 leche" o "leche x2" se entienden como cantidad + producto.
    let qty = 1;
    let label = name;
    const m1 = name.match(/^(\d+(?:[.,]\d+)?)\s+(.+)$/);
    const m2 = name.match(/^(.+?)\s*[xX]\s*(\d+(?:[.,]\d+)?)$/);
    if (m1) { qty = Number(m1[1].replace(',', '.')); label = m1[2]; }
    else if (m2) { label = m2[1]; qty = Number(m2[2].replace(',', '.')); }

    store.add('shopping', {
      name: label.charAt(0).toUpperCase() + label.slice(1),
      qty, unit: '', estPriceCents: 0, done: false, staple: false, lastPriceCents: 0,
    });
    quick.value = '';
    quick.focus();
  }

  root.append(el('button', {
    class: 'btn btn--block', type: 'button', style: 'margin-bottom:12px',
    text: '📷 Escanear ticket',
    onclick: openScanForm,
  }));

  const card = el('section', { class: 'card card--flush' }, [
    el('div', { class: 'quickadd' }, [
      quick,
      el('button', { class: 'btn btn--primary', type: 'button', text: 'Agregar', onclick: addQuick }),
    ]),
  ]);

  if (!items.length) {
    card.append(emptyState('🛒', 'Lista vacía',
      'Escribí arriba lo que falta en casa. Marcá los habituales para que vuelvan solos cada mes.'));
    root.append(card);
    return;
  }

  const renderRow = (item) => {
    const price = itemPrice(item);
    const check = el('input', {
      type: 'checkbox', class: 'shop__check', checked: item.done,
      'aria-label': `Marcar ${item.name}`,
      onchange: () => store.update('shopping', item.id, { done: !item.done }),
    });
    return el('div', { class: `shop__item${item.done ? ' is-done' : ''}` }, [
      check,
      el('button', {
        class: 'shop__body',
        type: 'button',
        style: 'background:none;border:none;text-align:left;font:inherit;color:inherit;padding:0',
        onclick: () => openItemForm(item),
      }, [
        el('span', { class: 'shop__name', text: item.name }),
        el('span', { class: 'shop__meta' }, [
          (item.qty && item.qty !== 1) || item.unit ? `${item.qty || 1}${item.unit ? ` ${item.unit}` : ''}` : '',
          item.staple ? ((item.qty && item.qty !== 1) || item.unit ? ' · habitual' : 'habitual') : '',
        ]),
      ]),
      price ? el('span', { class: 'shop__price', text: fmt(price) }) : null,
    ]);
  };

  if (pending.length) {
    card.append(el('div', { class: 'list__group', text: `Faltan (${pending.length})` }));
    pending.forEach((i) => card.append(renderRow(i)));
  }
  if (done.length) {
    card.append(el('div', { class: 'list__group row row--between' }, [
      el('span', { text: `En el carrito (${done.length})` }),
      el('span', { class: 'num', text: fmt(summary.cartCents) }),
    ]));
    done.forEach((i) => card.append(renderRow(i)));
  }

  root.append(card);

  root.append(el('section', { class: 'card' }, [
    el('div', { class: 'row row--between', style: 'margin-bottom:4px' }, [
      el('span', { class: 'muted small', text: 'Estimado de toda la lista' }),
      el('span', { class: 'num', style: 'font-weight:660;font-size:18px', text: fmt(summary.estimatedCents) }),
    ]),
    el('p', { class: 'field__hint', text: 'El estimado usa el precio que cargues en cada producto (o el de la última compra).' }),
  ]));

  root.append(el('div', { class: 'stack' }, [
    el('button', {
      class: 'btn btn--primary btn--block', type: 'button',
      text: `Cerrar compra y cargar gasto${summary.cartCents ? ` · ${fmt(summary.cartCents)}` : ''}`,
      disabled: !done.length,
      onclick: () => openCheckout(shoppingSummary()),
    }),
    el('div', { class: 'row', style: 'gap:8px' }, [
      el('button', {
        class: 'btn btn--sm grow', type: 'button', text: 'Destildar todo',
        onclick: () => {
          store.list('shopping').filter((i) => i.done).forEach((i) => store.update('shopping', i.id, { done: false }));
          toast('Lista destildada.');
        },
      }),
      el('button', {
        class: 'btn btn--sm grow', type: 'button', text: 'Nueva lista del mes',
        onclick: async () => {
          const ok = await confirmSheet('¿Empezar una lista nueva?',
            'Se borran los productos sueltos y quedan sólo los habituales, destildados.', { confirmText: 'Empezar' });
          if (!ok) return;
          store.list('shopping').forEach((i) => {
            if (i.staple) store.update('shopping', i.id, { done: false });
            else store.remove('shopping', i.id);
          });
          toast('Lista lista para el mes.');
        },
      }),
    ]),
  ]));
}

Object.assign(__exports, { renderShopping });
};

          const ok = download(`pochohouse-${today()}.json`, store.exportData());
          toast(ok ? 'Backup descargado.' : SIN_DESCARGA);
        },
      }),
      el('button', {
        class: 'btn btn--block', type: 'button', text: '⬆ Importar backup',
        onclick: () => fileInput.click(),
      }),
      el('button', {
        class: 'btn btn--block', type: 'button', text: '⬇ Exportar todo a CSV',
        onclick: () => {
          const ok = download(`gastos-completo-${today()}.csv`, toCsv(), 'text/csv');
          toast(ok ? 'CSV descargado.' : SIN_DESCARGA);
        },
      }),
      fileInput,

  /* --- zona peligrosa --- */
  root.append(el('section', { class: 'card' }, [
    el('div', { class: 'card__head' }, [el('h2', { class: 'card__title grow', text: 'Otras cosas' })]),
    el('div', { class: 'stack' }, [
      el('button', {

      }),
      store.list('expenses').length === 0 ? el('button', {
        class: 'btn btn--block', type: 'button', text: '✨ Cargar datos de ejemplo',
        onclick: () => { store.seedDemo(); toast('Listo, mirá el resumen.'); navigate('resumen'); },
      }) : null,
      el('button', {
        class: 'btn btn--block btn--danger', type: 'button', text: 'Borrar todo y empezar de cero',

          const ok = await confirmSheet('¿Borrar todo?',
            'Se borran gastos, fijos, listas y metas de este dispositivo. Descargá un backup antes si no estás seguro.',
            { confirmText: 'Borrar todo', danger: true });

  root.append(el('p', {
    class: 'muted small center',
    style: 'margin:18px 0 8px',
    text: 'PochoHouse · funciona sin internet · los datos son suyos',
  }));
}

Object.assign(__exports, { renderSettings });
};

__defs["js/views/onboarding.js"] = (__exports, __req) => {
/* Primer arranque: quién sos, moneda y los sueldos del mes. */

const { el, toCents, currentMonth, monthLabel } = __req("js/util.js");
const store = __req("js/store.js");
const {
  field, input, segmented, footerButtons, openSheet, closeSheet, toast, avatar,
} = __req("js/ui.js");
const { navigate } = __req("js/router.js");


function openOnboarding() {
  const roster = store.people();
  const mes = currentMonth();
  let meId = roster[0].id;

  const demoBox = input({ type: 'checkbox', class: 'switch__box', checked: Boolean(window.__pochoHousePreview) });

  const sueldos = new Map();
  const camposSueldo = roster.map((p) => {
    const box = input({
      class: 'input input--amount', type: 'text', inputmode: 'decimal',
      placeholder: '0,00', 'aria-label': `Líquido de ${p.name}`,
    });
    sueldos.set(p.id, box);
    return el('div', { style: 'margin-bottom:12px' }, [
      el('div', { class: 'row', style: 'margin-bottom:6px' }, [
        avatar(p),
        el('span', { class: 'field__label', style: 'margin:0', text: p.name }),
      ]),
      box,
    ]);
  });

  function finish() {
    store.setSettings({ defaultPayer: meId });
    store.saveConfig({ meId, onboarded: true });
    roster.forEach((p) => {
      const cents = toCents(sueldos.get(p.id).value);
      if (cents > 0) store.setIncome(p.id, mes, cents);
    });
    if (demoBox.checked) store.seedDemo();
    closeSheet();
    toast('¡Listo! Cargá el primer gasto con el botón ＋.', { ms: 5000 });
    navigate('resumen');
  }

  function skip() {
    store.saveConfig({ meId, onboarded: true });
    closeSheet();
  }

  openSheet('Bienvenidos 🏡', el('div', {}, [
    el('p', { class: 'muted small', style: 'margin-bottom:16px' },
      'Acá van los gastos de la casa. Cargan lo que cobran, se descuentan los gastos y siempre tienen a mano cuánto les queda a cada uno y a los dos.'),

    field('¿Quién sos en este teléfono?', segmented(
      roster.map((p) => ({ value: p.id, label: p.name })),
      meId,
      (v) => { meId = v; },
    ), 'Sirve para que cargues gastos con un toque menos.'),

    el('div', { class: 'divider' }),
    el('p', { class: 'field__label', text: `Sueldo líquido de ${monthLabel(mes, store.state.settings.locale)}` }),
    el('p', { class: 'field__hint', style: 'margin:-2px 0 12px' },
      'Lo que cobran de bolsillo, ya con el alquiler descontado. Se puede cargar después.'),
    ...camposSueldo,

    el('label', { class: 'field' }, [
      el('span', { class: 'switch' }, [
        el('span', {}, [
          el('span', { class: 'field__label', style: 'margin:0', text: 'Cargar datos de ejemplo' }),
          el('span', { class: 'field__hint', style: 'margin-top:2px', text: 'Para ver cómo queda. Después se borra desde Ajustes.' }),
        ]),
        demoBox,
      ]),

    el('p', { class: 'field__hint', style: 'margin-bottom:4px' },
      'Todo se guarda en tu teléfono. Para que los dos vean lo mismo, activá la sincronización en Ajustes.'),
    footerButtons('Empezar', finish, { secondaryLabel: 'Después', onSecondary: skip }),
  ]));
}

Object.assign(__exports, { openOnboarding });
};

__defs["js/app.js"] = (__exports, __req) => {
/* Arranque de la app: rutas, tema, sincronización y service worker. */

const store = __req("js/store.js");
const { defineRoute, render, navigate, parseHash, current } = __req("js/router.js");
const { applyTheme, cycleTheme } = __req("js/theme.js");
const { toast, closeSheet } = __req("js/ui.js");
const sync = __req("js/sync.js");
const { currentMonth } = __req("js/util.js");

const { renderDashboard } = __req("js/views/dashboard.js");
const { renderExpenses } = __req("js/views/expenses.js");
const { renderFixed } = __req("js/views/fixed.js");
const { renderShopping } = __req("js/views/shopping.js");
const { renderGoals } = __req("js/views/goals.js");
const { renderSettings } = __req("js/views/settings.js");
const { openExpenseForm } = __req("js/views/expense-form.js");

/* ------------------------------------------------------------------ rutas */

defineRoute('resumen', renderDashboard);
defineRoute('gastos', renderExpenses);
defineRoute('fijos', renderFixed);
defineRoute('compras', renderShopping);
defineRoute('metas', renderGoals);
defineRoute('ajustes', renderSettings);

/* Enlace de invitación: #/unir/<base64 con url, clave y código> */
defineRoute('unir', (root, params, segments) => {
  const payload = segments[0];
  let cfg = null;
  try {
    cfg = JSON.parse(atob(decodeURIComponent(payload || '')));
  } catch {
    cfg = null;
  }
  if (!cfg || !cfg.u || !cfg.k || !cfg.s) {
    toast('El enlace de invitación no es válido.');
    navigate('resumen');
    return;
  }
  store.saveConfig({ supabaseUrl: cfg.u, supabaseKey: cfg.k, spaceId: cfg.s });
  sync.sync().then((r) => {
    toast(r.ok ? '¡Listo! Ya están conectados.' : `No se pudo conectar: ${r.message || ''}`);
    navigate('resumen');
  });
  root.append(Object.assign(document.createElement('div'), {
    className: 'card center muted',
    textContent: 'Conectando con el hogar compartido…',
  }));
});

/* ------------------------------------------------------------------- tema */

applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if ((store.config.theme || 'auto') === 'auto') applyTheme('auto');
});

document.getElementById('btn-theme').addEventListener('click', () => {
  const next = cycleTheme();
  store.saveConfig({ theme: next });
  applyTheme(next);
  toast(`Tema: ${{ auto: 'automático', light: 'claro', dark: 'oscuro' }[next]}`);
});

/* ------------------------------------------------------------- botón + */

document.getElementById('btn-fab').addEventListener('click', () => {
  const route = current();
  if (route && route.name === 'compras') {
    document.querySelector('.quickadd .input')?.focus();
    return;
  }
  const month = route?.params?.month;
  const isPast = month && month !== currentMonth();
  openExpenseForm(null, isPast ? { date: `${month}-01` } : {});
});

/* ------------------------------------------------------- sincronización UI */

const syncBtn = document.getElementById('btn-sync');

function paintSyncButton(status) {
  syncBtn.classList.toggle('is-spinning', status === 'syncing');
  const labels = {
    off: 'Sincronización desactivada',
    ok: 'Al día · tocá para sincronizar',
    syncing: 'Sincronizando…',
    offline: 'Sin conexión: se guarda igual',
    error: 'Hubo un problema al sincronizar',
    pending: 'Tocá para sincronizar',
  };
  syncBtn.title = labels[status] || labels.off;
  syncBtn.setAttribute('aria-label', syncBtn.title);
  syncBtn.style.color = status === 'error' ? 'var(--critical)'
    : status === 'ok' ? 'var(--good)'
      : '';
  syncBtn.style.opacity = status === 'off' ? '.45' : '1';
}

sync.onSyncChange(({ status, message }) => {
  paintSyncButton(status);
  if (status === 'error' && document.visibilityState === 'visible' && message) {
    console.warn('Sync:', message);
  }
});

syncBtn.addEventListener('click', async () => {
  if (!sync.isConfigured()) {
    navigate('ajustes');
    toast('Configurá la sincronización para compartir los gastos.');
    return;
  }
  const r = await sync.sync();
  toast(r.ok ? 'Datos al día.' : `No se pudo sincronizar: ${r.message || r.reason}`);
});

paintSyncButton(sync.syncState());

/* ------------------------------------------------------- estado -> pantalla */

let rerenderTimer = null;
store.subscribe((detail) => {
  if (detail.type === 'storage-error') {
    toast('No hay espacio para guardar. Descargá un backup y borrá datos viejos.', { ms: 8000 });
    return;
  }
  if (detail.silent) return;
  clearTimeout(rerenderTimer);
  rerenderTimer = setTimeout(() => {
    render();
    sync.scheduleSync();
  }, 16);
});

/* ------------------------------------------------------------ primer uso */

function firstRunIfNeeded() {
  if (store.config.onboarded) return;
  const hasData = store.list('expenses').length || store.list('fixed').length;
  if (hasData) { store.saveConfig({ onboarded: true }); return; }
  Promise.resolve(__req("js/views/onboarding.js")).then((m) => m.openOnboarding());
}

/* --------------------------------------------------------------- arranque */

// replaceState en vez de asignar el hash: asignarlo dispara un hashchange
// que cerraría de inmediato la hoja de bienvenida.
if (!location.hash) history.replaceState(null, '', '#/resumen');
render();
firstRunIfNeeded();

if (sync.isConfigured() && parseHash().name !== 'unir') sync.startAutoSync();

window.addEventListener('online', () => paintSyncButton(sync.syncState()));
window.addEventListener('offline', () => paintSyncButton('offline'));

/* Atajos de teclado en la compu. */
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === 'n' && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    openExpenseForm();
  }
});

/* Service worker: la app abre aunque no haya señal.
   La versión de archivo único no lleva manifest y tampoco service worker. */
if (document.querySelector('link[rel="manifest"]')
    && 'serviceWorker' in navigator
    && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => console.warn('SW no registrado', err));
  });
}

// Cerramos la hoja modal al navegar con el botón "atrás" del teléfono.
window.addEventListener('hashchange', closeSheet);


};
__req("js/app.js");
})();
