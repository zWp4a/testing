<style>
/* =========================================================
   PochoHouse — hoja de estilos
   Tokens claros/oscuros. Mobile-first. Sin dependencias.
   ========================================================= */

:root {
  color-scheme: light;

  /* superficies e ink */
  --plane:          #f9f9f7;
  --surface-1:      #fcfcfb;
  --surface-2:      #f2f1ed;
  --surface-3:      #e9e8e2;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --grid:           #e1e0d9;
  --axis:           #c3c2b7;
  --border:         rgba(11, 11, 11, 0.10);
  --border-strong:  rgba(11, 11, 11, 0.18);
  --shadow-1: 0 1px 2px rgba(11,11,11,.06), 0 2px 8px rgba(11,11,11,.05);
  --shadow-2: 0 8px 28px rgba(11,11,11,.14);

  /* serie / acento */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --accent:      #2a78d6;
  --accent-ink:  #ffffff;
  --accent-soft: #cde2fb;
  --accent-deep: #184f95;

  /* estado */
  --good:     #0ca30c;
  --warning:  #fab219;
  --serious:  #ec835a;
  --critical: #d03b3b;
  --good-text: #006300;
  --critical-text: #a52626;

  /* rampa secuencial azul */
  --seq-250: #86b6ef;
  --seq-400: #3987e5;
  --seq-450: #2a78d6;
  --seq-550: #1c5cab;

  --radius-sm: 8px;
  --radius:    14px;
  --radius-lg: 20px;
  --tap: 44px;

  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:          #0d0d0d;
    --surface-1:      #1a1a19;
    --surface-2:      #222220;
    --surface-3:      #2c2c2a;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --axis:           #383835;
    --border:         rgba(255, 255, 255, 0.10);
    --border-strong:  rgba(255, 255, 255, 0.20);
    --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
    --shadow-2: 0 10px 34px rgba(0,0,0,.55);

    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --accent:      #3987e5;
    --accent-ink:  #ffffff;
    --accent-soft: #184f95;
    --accent-deep: #86b6ef;

    --good-text: #0ca30c;
    --critical-text: #e66767;

    --seq-250: #184f95;
    --seq-400: #2a78d6;
    --seq-450: #3987e5;
    --seq-550: #86b6ef;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:          #0d0d0d;
  --surface-1:      #1a1a19;
  --surface-2:      #222220;
  --surface-3:      #2c2c2a;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --grid:           #2c2c2a;
  --axis:           #383835;
  --border:         rgba(255, 255, 255, 0.10);
  --border-strong:  rgba(255, 255, 255, 0.20);
  --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --shadow-2: 0 10px 34px rgba(0,0,0,.55);

  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --accent:      #3987e5;
  --accent-ink:  #ffffff;
  --accent-soft: #184f95;
  --accent-deep: #86b6ef;

  --good-text: #0ca30c;
  --critical-text: #e66767;

  --seq-250: #184f95;
  --seq-400: #2a78d6;
  --seq-450: #3987e5;
  --seq-550: #86b6ef;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  max-width: 100%;
  /* Ojo: no poner overflow-x aquí. Convierte a html/body en contenedor de
     scroll y la barra superior deja de quedar pegada. El desborde lateral se
     ataca en la raíz: minmax(0,1fr) en .app y montos que entran en pantalla. */
}

/* La barra de scroll se lleva ancho cuando aparece y se lo devuelve cuando
   desaparece: con vistas que se redibujan enteras, eso es un salto lateral en
   cada cambio. Se oculta la barra y el salto desaparece con ella; el scroll
   sigue funcionando con dedo, rueda, teclado y trackpad. */
html {
  scrollbar-width: none;          /* Firefox */
  -ms-overflow-style: none;       /* Edge viejo */
}
html::-webkit-scrollbar { width: 0; height: 0; }

body {
  background: var(--plane);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}

h1, h2, h3, h4 { margin: 0; font-weight: 650; line-height: 1.2; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ---------------------------------------------------------
   Layout
   --------------------------------------------------------- */

.app {
  min-height: 100dvh;
  display: grid;
  /* minmax(0,…) y no 1fr: un track "1fr" no baja del contenido mínimo, así que
     un número largo empujaba el ancho de toda la app. */
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto 1fr auto;
  grid-template-areas: "topbar" "main" "tabbar";
}
.topbar, .main, .tabbar { min-width: 0; }

.topbar {
  grid-area: topbar;
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: max(8px, env(safe-area-inset-top)) 14px 8px;
  background: color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--border);
}

.topbar__brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.topbar__logo { font-size: 20px; line-height: 1; }
.topbar__title { font-weight: 680; font-size: 17px; letter-spacing: -0.015em; }
.topbar__actions { display: flex; gap: 6px; align-items: center; }

.sidenav { display: none; }

.main {
  grid-area: main;
  width: 100%;
  max-width: 880px;
  margin: 0 auto;
  padding: 14px 14px 108px;
  outline: none;
}

.tabbar {
  grid-area: tabbar;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 2px;
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--surface-1) 94%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  border-top: 1px solid var(--border);
}

.tabbar__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px;
  border-radius: 12px;
  text-decoration: none;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 560;
  min-height: var(--tap);
  justify-content: center;
}
.tabbar__ico { font-size: 19px; line-height: 1; filter: grayscale(1); opacity: .75; }
.tabbar__item[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.tabbar__item[aria-current="page"] .tabbar__ico { filter: none; opacity: 1; }

.fab {
  position: fixed;
  right: 16px;
  bottom: calc(74px + env(safe-area-inset-bottom));
  z-index: 31;
  width: 56px; height: 56px;
  border: none;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 28px;
  font-weight: 400;
  line-height: 1;
  box-shadow: var(--shadow-2);
  cursor: pointer;
  transition: transform .12s ease;
}
.fab:active { transform: scale(.94); }

@media (min-width: 860px) {
  .app {
    grid-template-columns: 232px minmax(0, 1fr);
    grid-template-areas: "topbar topbar" "sidenav main";
  }
  .topbar { padding: 12px 20px; }
  .sidenav {
    grid-area: sidenav;
    display: block;
    position: sticky;
    top: 57px;
    align-self: start;
    padding: 16px 12px;
    height: calc(100dvh - 57px);
    border-right: 1px solid var(--border);
  }
  .sidenav__item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 12px;
    margin-bottom: 3px;
    border-radius: 11px;
    text-decoration: none;
    color: var(--text-secondary);
    font-weight: 560;
    font-size: 15px;
  }
  .sidenav__item:hover { background: var(--surface-2); color: var(--text-primary); }
  .sidenav__ico { font-size: 17px; filter: grayscale(1); opacity: .8; }
  .sidenav__item[aria-current="page"] {
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent);
  }
  .sidenav__item[aria-current="page"] .sidenav__ico { filter: none; opacity: 1; }
  .tabbar { display: none; }
  .main { padding: 22px 24px 80px; margin: 0; max-width: 940px; }
  .fab { bottom: 28px; right: 28px; }
}

/* ---------------------------------------------------------
   Piezas base
   --------------------------------------------------------- */

.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-1);
  padding: 15px;
  margin-bottom: 10px;
}
.card--flush { padding: 0; overflow: hidden; }

.card__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.card__title { font-size: 14px; font-weight: 640; letter-spacing: .005em; }
.card__meta { font-size: 12.5px; color: var(--text-muted); }

.section-title {
  font-size: 12px;
  font-weight: 640;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--text-muted);
  margin: 20px 2px 9px;
}
.section-title:first-child { margin-top: 4px; }

.row { display: flex; align-items: center; gap: 10px; }
.row--between { justify-content: space-between; }
.row--wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 10px; }
.muted { color: var(--text-muted); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.hidden { display: none !important; }

/* Botones */
.btn {
  appearance: none;
  border: 1px solid var(--border-strong);
  background: var(--surface-1);
  color: var(--text-primary);
  font: inherit;
  font-size: 14.5px;
  font-weight: 580;
  padding: 10px 14px;
  min-height: var(--tap);
  border-radius: 11px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: background .12s ease, transform .1s ease;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.985); }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn--primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn--ghost { border-color: transparent; background: transparent; color: var(--text-secondary); }
.btn--ghost:hover { background: var(--surface-2); }
.btn--danger { color: var(--critical-text); border-color: color-mix(in srgb, var(--critical) 35%, transparent); }
.btn--danger:hover { background: color-mix(in srgb, var(--critical) 10%, transparent); }
.btn--sm { min-height: 34px; padding: 5px 11px; font-size: 13px; border-radius: 9px; }
.btn--block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.iconbtn {
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  width: 38px; height: 38px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  cursor: pointer;
  padding: 0;
}
.iconbtn:hover { background: var(--surface-2); color: var(--text-primary); }
.iconbtn__glyph { display: block; line-height: 1; }
.iconbtn.is-spinning .iconbtn__glyph { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Formularios */
.field { display: block; margin-bottom: 13px; }
.field__label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 5px;
}
.field__hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; }

.input, .select, .textarea {
  width: 100%;
  font: inherit;
  font-size: 16px; /* evita el zoom de iOS */
  color: var(--text-primary);
  background: var(--surface-1);
  border: 1px solid var(--border-strong);
  border-radius: 11px;
  padding: 11px 12px;
  min-height: var(--tap);
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
.textarea { min-height: 74px; resize: vertical; }
.select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 32px;
}
.input--amount {
  font-size: 26px;
  font-weight: 660;
  letter-spacing: -0.02em;
  padding: 12px 14px;
  font-variant-numeric: tabular-nums;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-2 > .field { margin-bottom: 0; }

/* Segmentos (chips de opción) */
.seg {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--surface-2);
  border-radius: 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.seg::-webkit-scrollbar { display: none; }
.seg__opt {
  flex: 1 0 auto;
  appearance: none;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font: inherit;
  font-size: 13.5px;
  font-weight: 580;
  padding: 8px 12px;
  min-height: 36px;
  border-radius: 9px;
  cursor: pointer;
  white-space: nowrap;
}
.seg__opt[aria-pressed="true"] {
  background: var(--surface-1);
  color: var(--text-primary);
  box-shadow: var(--shadow-1);
}

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  appearance: none;
  border: 1px solid var(--border-strong);
  background: var(--surface-1);
  color: var(--text-secondary);
  font: inherit;
  font-size: 13.5px;
  font-weight: 550;
  padding: 7px 11px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
}
.chip[aria-pressed="true"] {
  background: color-mix(in srgb, var(--accent) 13%, var(--surface-1));
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  color: var(--accent-deep);
}

/* Switch */
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--tap); }
.switch__box {
  appearance: none;
  flex: none;
  width: 46px; height: 28px;
  border-radius: 999px;
  background: var(--surface-3);
  border: 1px solid var(--border-strong);
  position: relative;
  cursor: pointer;
  transition: background .15s ease;
}
.switch__box::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--surface-1);
  box-shadow: var(--shadow-1);
  transition: transform .15s ease;
}
.switch__box:checked { background: var(--accent); border-color: var(--accent); }
.switch__box:checked::after { transform: translateX(18px); }

/* Etiquetas de estado */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 620;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text-secondary);
  white-space: nowrap;
}
.tag--good     { background: color-mix(in srgb, var(--good) 15%, var(--surface-1));     color: var(--good-text); }
.tag--warning  { background: color-mix(in srgb, var(--warning) 22%, var(--surface-1));  color: var(--text-primary); }
.tag--critical { background: color-mix(in srgb, var(--critical) 15%, var(--surface-1)); color: var(--critical-text); }
.tag--accent   { background: color-mix(in srgb, var(--accent) 14%, var(--surface-1));   color: var(--accent-deep); }

/* Avatar de persona */
.who {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 30px; height: 30px;
  border-radius: 50%;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  letter-spacing: .01em;
}
.who--lg { width: 40px; height: 40px; font-size: 15px; }

/* ---------------------------------------------------------
   Listas
   --------------------------------------------------------- */

.list { list-style: none; margin: 0; padding: 0; }
.list__item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 15px;
  border-bottom: 1px solid var(--border);
  background: none;
  border-left: none; border-right: none; border-top: none;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
  cursor: pointer;
  min-height: 58px;
}
.list__item:last-child { border-bottom: none; }
.list__item:hover { background: var(--surface-2); }

/* Zona clickeable cuando la fila además tiene su propio botón de acción. */
.list__hit {
  display: flex;
  align-items: center;
  gap: 11px;
  flex: 1;
  min-width: 0;
  padding: 0;
  margin: -11px 0;
  min-height: 58px;
  background: none;
  border: none;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
.list__ico {
  flex: none;
  width: 36px; height: 36px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 17px;
  background: var(--surface-2);
}
.list__body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1px;
}
.list__title {
  display: block;
  font-size: 14.5px;
  font-weight: 580;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.list__sub {
  display: block;
  font-size: 12.5px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.35;
}
.list__amount {
  flex: none;
  font-size: 15px;
  font-weight: 640;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.list__group {
  padding: 9px 15px 5px;
  font-size: 11.5px;
  font-weight: 640;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text-muted);
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
}

.empty {
  text-align: center;
  padding: 32px 20px;
  color: var(--text-muted);
}
.empty__ico { font-size: 34px; display: block; margin-bottom: 8px; opacity: .8; }
.empty__title { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.empty__text { font-size: 13.5px; max-width: 34ch; margin: 0 auto; }

/* ---------------------------------------------------------
   Balance / hero
   --------------------------------------------------------- */

.hero {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1);
  padding: 16px 16px 18px;
  margin-bottom: 10px;
  text-align: center;
}
.hero__label {
  font-size: 12px;
  font-weight: 620;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--text-muted);
}
.hero__value {
  /* Un sueldo uruguayo son 14 caracteres ("$ 2.233.499,50"): el tamaño está
     calculado para que entre en la pantalla más angosta sin estirar la página. */
  font-size: clamp(27px, 8vw, 44px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin: 6px 0 3px;
  overflow-wrap: anywhere;   /* red de contención ante un número absurdo */
}
.hero__caption { font-size: 14px; color: var(--text-secondary); }
.hero__actions { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 10px; }
.tile {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-1);
  padding: 13px 14px;
}
.tile__label { font-size: 12px; font-weight: 580; color: var(--text-muted); margin-bottom: 3px; }
.tile__value { font-size: 21px; font-weight: 680; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tile__delta { font-size: 12px; font-weight: 580; margin-top: 3px; display: flex; align-items: center; gap: 4px; }
.tile__delta--up   { color: var(--critical-text); }
.tile__delta--down { color: var(--good-text); }
.tile__delta--flat { color: var(--text-muted); }

/* ---------------------------------------------------------
   Gráficos
   --------------------------------------------------------- */

.bars { display: grid; gap: 11px; }
.bar__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 5px;
  font-size: 13px;
}
.bar__name { color: var(--text-secondary); font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar__val  { color: var(--text-primary); font-weight: 620; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar__track {
  height: 9px;
  background: var(--surface-2);
  border-radius: 999px;
  overflow: hidden;
}
.bar__fill {
  height: 100%;
  border-radius: 999px;
  background: var(--seq-450);
  min-width: 4px;
  transition: width .35s cubic-bezier(.22,.61,.36,1);
}
.bar__fill--good     { background: var(--good); }
.bar__fill--warning  { background: var(--warning); }
.bar__fill--critical { background: var(--critical); }

.trend {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 116px;
  padding-top: 6px;
}
.trend__col {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  height: 100%;
  min-width: 0;
}
.trend__barwrap { width: 100%; display: flex; align-items: flex-end; justify-content: center; flex: 1; }
.trend__bar {
  width: 100%;
  max-width: 34px;
  border-radius: 4px 4px 0 0;
  background: var(--seq-250);
  transition: height .35s cubic-bezier(.22,.61,.36,1);
}
.trend__col--current .trend__bar { background: var(--seq-450); }
.trend__lbl {
  font-size: 10.5px;
  color: var(--text-muted);
  font-weight: 560;
  text-transform: uppercase;
  letter-spacing: .03em;
  white-space: nowrap;
}
.trend__col--current .trend__lbl { color: var(--text-primary); font-weight: 640; }
.trend__axis {
  border-top: 1px solid var(--axis);
  margin-top: -1px;
}

/* Barra de división 50/50 */
.splitbar {
  display: flex;
  gap: 2px;
  height: 10px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--surface-2);
  margin: 10px 0 8px;
}
.splitbar__seg { height: 100%; min-width: 3px; }
.splitbar__seg:first-child { border-radius: 999px 0 0 999px; }
.splitbar__seg:last-child  { border-radius: 0 999px 999px 0; }

.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; color: var(--text-secondary); }
.legend__item { display: inline-flex; align-items: center; gap: 6px; }
.legend__swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }

/* ---------------------------------------------------------
   Selector de mes
   --------------------------------------------------------- */

.monthnav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-1);
}
.monthnav__label {
  font-size: 14.5px;
  font-weight: 620;
  flex: 1;
  text-align: center;
}
.monthnav__btn {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  width: 38px; height: 38px;
  border-radius: 50%;
  font-size: 17px;
  cursor: pointer;
  flex: none;
}
.monthnav__btn:hover { background: var(--surface-2); }
.monthnav__btn[disabled] { opacity: .3; cursor: default; }

/* ---------------------------------------------------------
   Compras
   --------------------------------------------------------- */

.shop__item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  min-height: 54px;
}
.shop__item:last-child { border-bottom: none; }
.shop__check {
  appearance: none;
  flex: none;
  width: 24px; height: 24px;
  border-radius: 7px;
  border: 2px solid var(--border-strong);
  background: var(--surface-1);
  cursor: pointer;
  position: relative;
}
.shop__check:checked { background: var(--accent); border-color: var(--accent); }
.shop__check:checked::after {
  content: "";
  position: absolute;
  left: 6px; top: 2px;
  width: 6px; height: 11px;
  border: solid #fff;
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(43deg);
}
.shop__body { flex: 1; min-width: 0; cursor: pointer; }
.shop__name { font-size: 14.5px; font-weight: 550; }
.shop__meta { font-size: 12px; color: var(--text-muted); }
.shop__item.is-done .shop__name { text-decoration: line-through; color: var(--text-muted); }
.shop__price { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-secondary); }

.quickadd {
  display: flex;
  gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}
.quickadd .input { background: var(--surface-1); }

/* ---------------------------------------------------------
   Hoja modal (bottom sheet)
   --------------------------------------------------------- */

.sheet { position: fixed; inset: 0; z-index: 60; }
.sheet[hidden] { display: none; }
.sheet__scrim {
  position: absolute; inset: 0;
  background: rgba(11, 11, 11, .45);
  animation: fade .18s ease;
}
@keyframes fade { from { opacity: 0; } }

.sheet__panel {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  max-height: 92dvh;
  display: flex;
  flex-direction: column;
  background: var(--surface-1);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  box-shadow: var(--shadow-2);
  animation: slideup .24s cubic-bezier(.22,.61,.36,1);
}
@keyframes slideup { from { transform: translateY(18px); opacity: .6; } }

.sheet__grip {
  width: 38px; height: 4px;
  border-radius: 999px;
  background: var(--axis);
  margin: 8px auto 0;
  flex: none;
}
.sheet__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px 8px 18px;
  flex: none;
}
.sheet__title { font-size: 17px; font-weight: 660; }
.sheet__body {
  padding: 4px 18px calc(20px + env(safe-area-inset-bottom));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.sheet__footer {
  display: flex;
  gap: 9px;
  padding-top: 14px;
  margin-top: 4px;
}
.sheet__footer .btn { flex: 1; }

@media (min-width: 700px) {
  .sheet__panel {
    left: 50%;
    bottom: auto;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(520px, calc(100vw - 40px));
    border-radius: var(--radius-lg);
    max-height: 86dvh;
    animation: pop .2s cubic-bezier(.22,.61,.36,1);
  }
  @keyframes pop { from { transform: translate(-50%, -48%) scale(.97); opacity: 0; } }
  .sheet__grip { display: none; }
  .sheet__head { padding-top: 16px; }
}

/* ---------------------------------------------------------
   Toasts
   --------------------------------------------------------- */

.toasts {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  /* Por encima del botón ＋ (74px + 56px de alto) para no tapar el toque. */
  bottom: calc(140px + env(safe-area-inset-bottom));
  z-index: 80;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  width: min(440px, calc(100vw - 24px));
}
@media (min-width: 860px) { .toasts { bottom: 26px; } }

.toast {
  background: var(--text-primary);
  color: var(--plane);
  font-size: 13.5px;
  font-weight: 550;
  padding: 10px 15px;
  border-radius: 11px;
  box-shadow: var(--shadow-2);
  display: flex;
  align-items: center;
  gap: 10px;
  animation: toastin .2s ease;
  max-width: 100%;
}
@keyframes toastin { from { transform: translateY(8px); opacity: 0; } }
.toast__action {
  appearance: none;
  border: none;
  background: none;
  color: var(--seq-250);
  font: inherit;
  font-weight: 680;
  cursor: pointer;
  padding: 6px 4px;
  white-space: nowrap;
  /* Sólo el botón recibe toques: el resto del aviso deja pasar el dedo. */
  pointer-events: auto;
}

/* Utilidades varias */
.divider { height: 1px; background: var(--border); margin: 14px 0; border: none; }
.linkbtn {
  appearance: none;
  background: none;
  border: none;
  color: var(--accent);
  font: inherit;
  font-size: 13.5px;
  font-weight: 580;
  cursor: pointer;
  padding: 6px 2px;
}
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

</style>
</head>
<body>

<div class="app" id="app">

  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo" aria-hidden="true">🏡</span>
      <span class="topbar__title">PochoHouse</span>
    </div>
    <div class="topbar__actions">
      <button class="iconbtn" id="btn-sync" type="button" title="Sincronizar" aria-label="Sincronizar">
        <span class="iconbtn__glyph" aria-hidden="true">⟳</span>
      </button>
      <button class="iconbtn" id="btn-theme" type="button" title="Tema" aria-label="Cambiar tema">
        <span class="iconbtn__glyph" aria-hidden="true">◐</span>
      </button>
    </div>
  </header>

  <nav class="sidenav" aria-label="Secciones">

  const used = new Set(people().map((p) => p.color));
  return PERSON_COLORS.find((c) => !used.has(c)) || PERSON_COLORS[0];
}

/* ------------------------------------------------------------------ sueldos */

/**
 * Guarda el líquido de una persona para un mes. El id es determinista para
 * que, si los dos cargan el mismo sueldo a la vez, no queden duplicados.
 */
function setIncome(personId, month, amountCents) {
  const id = `${month}:${personId}`;
  const existing = get('incomes', id);
  if (existing) {
    Object.assign(existing, { amountCents, deleted: false, updatedAt: nowIso() });
    commit({ collection: 'incomes', id, action: 'update' });
    return existing;
  }
  const record = { id, month, personId, amountCents, updatedAt: nowIso(), deleted: false };
  state.incomes.push(record);
  commit({ collection: 'incomes', id, action: 'add' });
  return record;
}

/**
 * Líquido de una persona en un mes. Si ese mes no tiene nada cargado, se
 * arrastra el último sueldo conocido: normalmente cobran lo mismo y no hay
 * que volver a cargarlo todos los meses.
 */
function incomeFor(personId, month) {
  const rows = list('incomes').filter((i) => i.personId === personId && i.month <= month);
  if (!rows.length) return { amountCents: 0, month: null, inherited: false };
  const exact = rows.find((i) => i.month === month);
  if (exact) return { amountCents: exact.amountCents, month, inherited: false };
  const last = rows.sort((a, b) => b.month.localeCompare(a.month))[0];
  return { amountCents: last.amountCents, month: last.month, inherited: true };
}

/** Quién soy yo en este dispositivo (para los atajos "pagué yo"). */
function me() {
  const found = config.meId && get('people', config.meId);
  return found && !found.deleted ? found : people()[0];
}

/* --------------------------------------------------------- import / export */

function exportData() {
  return JSON.stringify({
    app: 'pochohouse',
    version: state.version,
    exportedAt: nowIso(),
    data: {
      settings: state.settings,
      people: state.people,
      categories: state.categories,
      expenses: state.expenses,
      fixed: state.fixed,
      shopping: state.shopping,
      goals: state.goals,
      settlements: state.settlements,
    },
  }, null, 2);
}

/**
 * Importa un backup. `mode: 'merge'` conserva lo local y agrega lo que falte
 * (gana el `updatedAt` más nuevo); `mode: 'replace'` pisa todo.
 */
function importData(json, { mode = 'merge' } = {}) {
  const parsed = typeof json === 'string' ? JSON.parse(json) : json;
  const data = parsed.data || parsed;
  if (!data || typeof data !== 'object') throw new Error('El archivo no tiene el formato esperado.');

  let count = 0;
  if (mode === 'replace') {
    COLLECTIONS.forEach((c) => {
      if (Array.isArray(data[c])) { state[c] = data[c]; count += data[c].length; }
    });
    if (data.settings) state.settings = { ...state.settings, ...data.settings };
  } else {
    COLLECTIONS.forEach((c) => {
      if (!Array.isArray(data[c])) return;
      const byId = new Map(state[c].map((r) => [r.id, r]));
      data[c].forEach((incoming) => {
        if (!incoming || !incoming.id) return;
        const mine = byId.get(incoming.id);
        if (!mine) {
          state[c].push({ deleted: false, updatedAt: nowIso(), ...incoming });
          count += 1;
        } else if ((incoming.updatedAt || '') > (mine.updatedAt || '')) {
          Object.assign(mine, incoming);
          count += 1;
        }
      });
    });
  }
  commit({ action: 'import' });
  return count;
}

function resetAll() {
  const fresh = freshState();
  Object.keys(state).forEach((k) => delete state[k]);
  Object.assign(state, fresh);
  commit({ action: 'reset' });
}

/** Datos de ejemplo para ver la app con contenido antes de cargar lo real. */
function seedDemo() {
  const [a, b] = people();
  const m = currentMonth();
  const day = (d) => `${m}-${String(d).padStart(2, '0')}`;
  setIncome(a.id, m, 145000000);
  setIncome(b.id, m, 132000000);
  const rows = [
    ['Expensas', 78000, 'expensas', b.id, 3, 'equal'],
    ['Edenor', 32400, 'luz', a.id, 8, 'equal'],
    ['Internet fibra', 29900, 'internet', b.id, 5, 'equal'],
    ['Compra grande del mes', 186500, 'super', a.id, 6, 'equal'],
    ['Verdulería', 14200, 'super', b.id, 11, 'equal'],
    ['Cena aniversario', 62000, 'salidas', a.id, 12, 'equal'],
    ['Nafta', 45000, 'transporte', b.id, 9, 'single'],
    ['Veterinaria', 38000, 'mascota', a.id, 14, 'equal'],
  ];
  rows.forEach(([desc, amount, cat, payer, d, splitMode]) => {
    add('expenses', {
      date: day(d),
      description: desc,
      amountCents: amount * 100,
      categoryId: cat,
      paidBy: payer,
      splitMode,
      splitTo: splitMode === 'single' ? payer : null,
      splitPct: null,
      note: '',
    });
  });
  [
    ['Expensas', 78000, 'expensas', 3, b.id],
    ['Internet fibra', 29900, 'internet', 5, b.id],
    ['Netflix', 9900, 'suscripciones', 20, a.id],
  ].forEach(([name, amount, cat, dayOfMonth, payer]) => {
    add('fixed', {
      name, amountCents: amount * 100, categoryId: cat, dayOfMonth,
      paidBy: payer, splitMode: 'equal', splitTo: null, splitPct: null, active: true,
    });
  });
  ['Leche', 'Pan', 'Café', 'Huevos', 'Papel higiénico', 'Detergente'].forEach((name) => {
    add('shopping', { name, qty: 1, unit: '', estPriceCents: 0, done: false, staple: true, lastPriceCents: 0 });
  });
  add('goals', { name: 'Vacaciones', targetCents: 150000000, deadline: '', contributions: [] });
}

Object.assign(__exports, { saveConfig, subscribe, persist, flush, commit, list, get, add, update, remove, restore, setSettings, people, person, categories, category, nextPersonColor, setIncome, incomeFor, me, exportData, importData, resetAll, seedDemo, COLLECTIONS, PEOPLE, DEFAULT_CATEGORIES, state, config });
};

__defs["js/router.js"] = (__exports, __req) => {
/* Enrutado por hash: #/gastos?month=2026-08 — funciona en GitHub Pages y offline. */

const routes = new Map();
let currentRoute = null;
let onRender = null;

function defineRoute(name, render) {
  routes.set(name, render);
}

function setRenderHook(fn) {
  onRender = fn;
}

function parseHash(hash = location.hash) {
  const raw = String(hash || '').replace(/^#\/?/, '');
  const [path, query] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  const params = {};
  new URLSearchParams(query || '').forEach((v, k) => { params[k] = v; });
  return { name: parts[0] || 'resumen', segments: parts.slice(1), params };
}

function buildHash(name, params = {}) {
  const q = new URLSearchParams(
    Object.entries(params).filter(([, v]) => v !== null && v !== undefined && v !== ''),
  ).toString();
  return `#/${name}${q ? `?${q}` : ''}`;
}

function navigate(name, params = {}) {
  const next = buildHash(name, params);
  if (location.hash === next) render();
  else location.hash = next;
}

function current() {
  return currentRoute;
}

function render() {
  const route = parseHash();
  // Un re-dibujo por un cambio de datos no debe mover la página: sólo
  // volvemos arriba cuando de verdad cambiaste de pantalla.
  const changedScreen = !currentRoute
    || currentRoute.name !== route.name
    || JSON.stringify(currentRoute.params) !== JSON.stringify(route.params);
  currentRoute = route;
  const view = routes.get(route.name) || routes.get('resumen');

  const root = document.getElementById('view');
  const keepScroll = window.scrollY;

  // Si estabas escribiendo en un campo marcado con data-focus-key, el
  // re-dibujo no te tiene que sacar el teclado ni el cursor de lugar.
  const active = document.activeElement;
  const focusKey = active && active.dataset ? active.dataset.focusKey : null;
  const typed = focusKey ? active.value : null;
  const caret = focusKey && 'selectionStart' in active
    ? { start: active.selectionStart, end: active.selectionEnd }
    : null;

  root.replaceChildren();
  try {
    view(root, route.params, route.segments);
  } catch (err) {
    console.error('Error al dibujar la vista', err);
    root.append(Object.assign(document.createElement('div'), {
      className: 'card',
      textContent: 'Algo salió mal al mostrar esta pantalla. Probá recargar la página.',
    }));
  }

  // En la barra inferior, "Más" (ajustes) queda activo también en Metas.
  const fallback = { metas: 'ajustes' };
  document.querySelectorAll('[data-nav]').forEach((a) => {
    const inBottomBar = a.classList.contains('tabbar__item');
    const matches = a.dataset.nav === route.name
      || (inBottomBar && fallback[route.name] === a.dataset.nav);
    if (matches) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });

  if (focusKey) {
    const again = root.querySelector(`[data-focus-key="${focusKey}"]`);
    if (again) {
      // Lo que estabas tecleando no se pierde aunque entre una sincronización.
      if (typed && !again.value) again.value = typed;
      again.focus({ preventScroll: true });
      if (caret && 'setSelectionRange' in again) {
        try { again.setSelectionRange(caret.start, caret.end); } catch { /* type sin selección */ }
      }
    }
  }

  if (onRender) onRender(route);
  if (changedScreen) window.scrollTo({ top: 0 });
  else window.scrollTo({ top: keepScroll });
}

window.addEventListener('hashchange', render);

Object.assign(__exports, { defineRoute, setRenderHook, parseHash, buildHash, navigate, current, render });
};

__defs["js/theme.js"] = (__exports, __req) => {
/* Tema claro / oscuro / automático. */

const { config } = __req("js/store.js");

const meta = () => document.querySelectorAll('meta[name="theme-color"]');

// Si la página venía con un tema puesto desde afuera, "automático" lo respeta
// en vez de borrarlo: sólo limpiamos la marca que puso la propia app.
let stampedByApp = false;

function applyTheme(mode = config.theme || 'auto') {
  const root = document.documentElement;
  if (mode === 'auto') {
    if (stampedByApp) root.removeAttribute('data-theme');
    stampedByApp = false;
  } else {
    root.setAttribute('data-theme', mode);
    stampedByApp = true;
  }

  // La barra del navegador en el celular tiene que acompañar al tema elegido.
  const effective = mode === 'auto' ? (root.getAttribute('data-theme') || 'auto') : mode;
  const dark = effective === 'dark'
    || (effective === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  meta().forEach((m) => m.setAttribute('content', dark ? '#0d0d0d' : '#fcfcfb'));
}

function cycleTheme() {
  const order = ['auto', 'light', 'dark'];
  const next = order[(order.indexOf(config.theme || 'auto') + 1) % order.length];
  return next;
}

function themeLabel(mode) {
  return { auto: 'Automático', light: 'Claro', dark: 'Oscuro' }[mode] || 'Automático';
}

Object.assign(__exports, { applyTheme, cycleTheme, themeLabel });
};

__defs["js/ui.js"] = (__exports, __req) => {
/* Piezas de interfaz reutilizables: hoja modal, avisos, gráficos y formularios. */

const { el, clear, money, initials, monthLabel, addMonths, currentMonth } = __req("js/util.js");
const { state } = __req("js/store.js");

/* ------------------------------------------------------------------ dinero */

function fmt(cents, opts = {}) {
  return money(cents, {
    locale: state.settings.locale || 'es-AR',
    currency: state.settings.currency || 'ARS',
    ...opts,
  });
}

function fmtShort(cents) {
  return fmt(cents, { compact: true, cents: false });
}

/** Formatea en una moneda distinta de la base (para mostrar el importe original). */
function fmtEn(cents, currency) {
  return money(cents, { locale: state.settings.locale || 'es-UY', currency });
}

/* ------------------------------------------------------------- hoja modal */

const sheetEl = document.getElementById('sheet');
const sheetTitle = document.getElementById('sheet-title');
const sheetBody = document.getElementById('sheet-body');
let lastFocus = null;
let onSheetClose = null;

function openSheet(title, content, { onClose = null } = {}) {
  lastFocus = document.activeElement;
  onSheetClose = onClose;
  // Los avisos de la acción anterior no deben quedar flotando sobre la hoja.
  dismissToasts();
  sheetTitle.textContent = title;
  clear(sheetBody);
  sheetBody.append(content);
  sheetEl.hidden = false;
  document.body.style.overflow = 'hidden';
  const focusable = sheetBody.querySelector('input:not([type=hidden]), select, textarea, button');
  // En móvil, enfocar de una abre el teclado y tapa el formulario.
  if (focusable && window.matchMedia('(min-width: 700px)').matches) focusable.focus();
}

function closeSheet() {
  if (sheetEl.hidden) return;
  sheetEl.hidden = true;
  clear(sheetBody);
  document.body.style.overflow = '';
  const cb = onSheetClose;
  onSheetClose = null;
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  if (cb) cb();
}

sheetEl.addEventListener('click', (e) => {
  if (e.target.closest('[data-close-sheet]')) closeSheet();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !sheetEl.hidden) closeSheet();
});

/* ---------------------------------------------------------------- avisos */

const toastsEl = document.getElementById('toasts');

function dismissToasts() {
  toastsEl.replaceChildren();
}

function toast(message, { action = null, onAction = null, ms = 3800 } = {}) {
  const node = el('div', { class: 'toast', role: 'status' }, [el('span', { class: 'grow', text: message })]);
  if (action && onAction) {
    node.append(el('button', {
      class: 'toast__action',
      type: 'button',
      text: action,
      onclick: () => { node.remove(); onAction(); },
    }));
  }
  toastsEl.append(node);
  setTimeout(() => {
    node.style.transition = 'opacity .2s ease';
    node.style.opacity = '0';
    setTimeout(() => node.remove(), 220);
  }, ms);
  return node;
}

function confirmSheet(title, message, { confirmText = 'Confirmar', danger = false } = {}) {
  return new Promise((resolve) => {
    let decided = false;
    const body = el('div', {}, [
      el('p', { class: 'muted', text: message, style: 'margin-bottom:6px' }),
      el('div', { class: 'sheet__footer' }, [
        el('button', {
          class: 'btn', type: 'button', text: 'Cancelar',
          onclick: () => { decided = true; closeSheet(); resolve(false); },
        }),
        el('button', {
          class: `btn ${danger ? 'btn--danger' : 'btn--primary'}`, type: 'button', text: confirmText,
          onclick: () => { decided = true; closeSheet(); resolve(true); },
        }),
      ]),
    ]);
    openSheet(title, body, { onClose: () => { if (!decided) resolve(false); } });
  });
}

/* -------------------------------------------------------------- personas */

function avatar(personObj, { large = false } = {}) {
  const otros = (state.people || []).filter((p) => !p.deleted).map((p) => p.name);
  return el('span', {
    class: `who${large ? ' who--lg' : ''}`,
    style: `background:${personObj.color || '#898781'}`,
    title: personObj.name,
    'aria-hidden': 'true',
  }, initials(personObj.name, otros));
}

/* ------------------------------------------------------------ formularios */

function field(label, control, hint) {
  return el('label', { class: 'field' }, [
    el('span', { class: 'field__label', text: label }),
    control,
    hint ? el('span', { class: 'field__hint', text: hint }) : null,
  ]);
}

function input(attrs = {}) {
  return el('input', { class: 'input', ...attrs });
}

function select(options, value, attrs = {}) {
  const node = el('select', { class: 'select', ...attrs });
  options.forEach((o) => {
    node.append(el('option', { value: o.value, selected: String(o.value) === String(value) }, o.label));
  });
  return node;
}

/**
 * Grupo de opciones tipo segmento. onChange recibe el valor elegido.
 * Devuelve el nodo; leer el valor con `node.value`.
 */
function segmented(options, value, onChange) {
  const node = el('div', { class: 'seg', role: 'group' });
  node.value = value;
  options.forEach((o) => {
    const btn = el('button', {
      class: 'seg__opt',
      type: 'button',
      'aria-pressed': String(o.value) === String(value),
      text: o.label,
      onclick: () => {
        node.value = o.value;
        [...node.children].forEach((c) => c.setAttribute('aria-pressed', String(c === btn)));
        if (onChange) onChange(o.value);
      },
    });
    node.append(btn);
  });

}

function switchRow(label, checked, onChange, hint) {
  const box = el('input', { class: 'switch__box', type: 'checkbox', checked, onchange: (e) => onChange(e.target.checked) });
  return el('label', { class: 'field' }, [
    el('span', { class: 'switch' }, [
      el('span', {}, [
        el('span', { class: 'field__label', text: label, style: 'margin:0' }),
        hint ? el('span', { class: 'field__hint', text: hint, style: 'margin-top:2px' }) : null,
      ]),
      box,
    ]),
  ]);
}

function footerButtons(primaryLabel, onPrimary, { secondaryLabel = 'Cancelar', onSecondary = closeSheet, extra = null } = {}) {
  return el('div', { class: 'sheet__footer' }, [
    extra,
    el('button', { class: 'btn', type: 'button', text: secondaryLabel, onclick: onSecondary }),
    el('button', { class: 'btn btn--primary', type: 'button', text: primaryLabel, onclick: onPrimary }),
  ]);
}

function emptyState(icon, title, text, actionLabel, onAction) {
  return el('div', { class: 'empty' }, [
    el('span', { class: 'empty__ico', 'aria-hidden': 'true', text: icon }),
    el('p', { class: 'empty__title', text: title }),
    el('p', { class: 'empty__text', text }),
    actionLabel ? el('button', {
      class: 'btn btn--primary', type: 'button', text: actionLabel,
      style: 'margin-top:14px', onclick: onAction,
    }) : null,
  ]);
}

/* ------------------------------------------------------------ selector mes */

function monthNav(mKey, onChange) {
  const isFuture = mKey >= addMonths(currentMonth(), 1);
  return el('div', { class: 'monthnav' }, [
    el('button', {
      class: 'monthnav__btn', type: 'button', 'aria-label': 'Mes anterior', text: '‹',
      onclick: () => onChange(addMonths(mKey, -1)),
    }),
    el('button', {
      class: 'monthnav__label',
      type: 'button',
      style: 'border:none;background:none;font:inherit;font-weight:620;cursor:pointer',
      text: monthLabel(mKey, state.settings.locale),
      title: 'Volver al mes actual',
      onclick: () => onChange(currentMonth()),
    }),
    el('button', {
      class: 'monthnav__btn', type: 'button', 'aria-label': 'Mes siguiente', text: '›',
      disabled: isFuture,
      onclick: () => onChange(addMonths(mKey, 1)),
    }),
  ]);
}

/* -------------------------------------------------------------- gráficos */

/**
 * Barras horizontales para una sola serie (gasto por categoría).
 * Una serie = sin leyenda; cada barra lleva su etiqueta y su valor al lado.
 */
function barList(rows, { max = null, formatValue = fmt } = {}) {
  const top = max || Math.max(1, ...rows.map((r) => r.value));
  return el('div', { class: 'bars' }, rows.map((r) => el('div', {}, [
    el('div', { class: 'bar__head' }, [
      el('span', { class: 'bar__name grow', text: r.label }),
      el('span', { class: 'bar__val', text: formatValue(r.value) }),
    ]),
    el('div', {
      class: 'bar__track',
      role: 'img',
      'aria-label': `${r.label}: ${formatValue(r.value)}`,
    }, [
      el('div', {
        class: `bar__fill${r.level ? ` bar__fill--${r.level}` : ''}`,

      }),
    ]),
  ])));
}

/** Barras verticales de tendencia mensual (una serie, mes actual destacado). */
function trendChart(series, { currentKey = null } = {}) {
  const top = Math.max(1, ...series.map((s) => s.total));
  const chart = el('div', { class: 'trend' }, series.map((s) => el('div', {
    class: `trend__col${s.month === currentKey ? ' trend__col--current' : ''}`,
  }, [
    el('div', { class: 'trend__barwrap' }, [
      // Un mes sin gastos se dibuja en cero: una barra mínima mentiría.
      el('div', {
        class: 'trend__bar',
        style: `height:${s.total > 0 ? Math.max(3, Math.round((s.total / top) * 100)) : 0}%`,
        role: 'img',
        'aria-label': `${monthLabel(s.month, state.settings.locale)}: ${fmt(s.total)}`,
        title: `${monthLabel(s.month, state.settings.locale)}: ${fmt(s.total)}`,
      }),
    ]),
    el('span', { class: 'trend__lbl', text: monthLabel(s.month, state.settings.locale, 'short').replace('.', '') }),
  ])));
  return el('div', {}, [chart, el('div', { class: 'trend__axis' })]);
}

/** Barra proporcional de cuánto puso cada persona. */
function splitBar(entries) {
  const total = entries.reduce((s, e) => s + e.value, 0) || 1;
  return el('div', {}, [
    el('div', { class: 'splitbar' }, entries.map((e) => el('span', {
      class: 'splitbar__seg',
      style: `width:${(e.value / total) * 100}%;background:${e.color}`,
      title: `${e.label}: ${fmt(e.value)}`,
    }))),
    el('div', { class: 'legend' }, entries.map((e) => el('span', { class: 'legend__item' }, [
      el('span', { class: 'legend__swatch', style: `background:${e.color}`, 'aria-hidden': 'true' }),
      el('span', { text: `${e.label} · ${fmt(e.value)}` }),
    ]))),
  ]);
}

/* ----------------------------------------------------------------- listas */

function listCard(children, { title = null, meta = null, action = null } = {}) {
  const card = el('section', { class: 'card card--flush' });
  if (title) {
    card.append(el('div', {
      class: 'card__head',
      style: 'padding:14px 15px 10px;margin:0;border-bottom:1px solid var(--border)',
    }, [
      el('h2', { class: 'card__title grow', text: title }),
      meta ? el('span', { class: 'card__meta', text: meta }) : null,
      action,
    ]));
  }
  const body = el('div', {});
  (Array.isArray(children) ? children : [children]).forEach((c) => c && body.append(c));
  card.append(body);
  return card;
}

/**
 * Fila de lista. Si hay acción propia (`trailing`) y además la fila es

function listItem({ icon, title, subtitle, amount, amountClass = '', trailing = null, onClick = null, tag = null }) {
  const content = [
    icon ? el('span', { class: 'list__ico', 'aria-hidden': 'true' }, icon) : null,
    el('span', { class: 'list__body' }, [
      el('span', { class: 'list__title' }, [
        title,
        tag ? el('span', { class: `tag tag--${tag.level}`, text: tag.text, style: 'margin-left:7px' }) : null,
      ]),
      subtitle ? el('span', { class: 'list__sub', text: subtitle }) : null,
    ]),
    amount !== undefined && amount !== null
      ? el('span', { class: `list__amount ${amountClass}`, text: typeof amount === 'string' ? amount : fmt(amount) })
      : null,

  if (onClick && trailing) {
    return el('div', { class: 'list__item' }, [
      el('button', { class: 'list__hit', type: 'button', onclick: onClick }, content),
      trailing,

  return el(onClick ? 'button' : 'div', {
    class: 'list__item',
    type: onClick ? 'button' : null,
    onclick: onClick,

/* Sincronización opcional vía Supabase (REST, sin SDK).
 *
 * Modelo: una sola tabla `records` con (space_id, kind, id, data, updated_at,
 * deleted). Cada dispositivo sube lo que cambió y baja lo que no tiene.
 * Los conflictos se resuelven por `updated_at`: gana la edición más reciente.
 *
 * Sin configurar nada, la app funciona 100% local. Esto sólo se activa cuando
 * cargan URL + clave + código de espacio en Ajustes.
 */

const { state, config, saveConfig, COLLECTIONS, commit, flush } = __req("js/store.js");
const { nowIso } = __req("js/util.js");

const listeners = new Set();
let running = false;

function onSyncChange(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function emit(status, detail = {}) {
  listeners.forEach((fn) => {
    try { fn({ status, ...detail }); } catch (err) { console.error(err); }
  });
}

function isConfigured() {
  return Boolean(config.supabaseUrl && config.supabaseKey && config.spaceId);
}

function syncState() {
  if (!isConfigured()) return 'off';
  if (running) return 'syncing';
  if (!navigator.onLine) return 'offline';
  return config.lastSyncAt ? 'ok' : 'pending';
}

function endpoint(path) {
  const base = String(config.supabaseUrl).replace(/\/+$/, '');
  return `${base}/rest/v1/${path}`;
}

function headers(extra = {}) {
  return {
    apikey: config.supabaseKey,
    Authorization: `Bearer ${config.supabaseKey}`,
    'Content-Type': 'application/json',
    ...extra,
  };
}

/** Aplana el estado a filas sincronizables. */
function localRows() {
  const rows = [];
  COLLECTIONS.forEach((kind) => {
    (state[kind] || []).forEach((r) => {
      rows.push({
        space_id: config.spaceId,
        kind,
        id: r.id,
        data: r,
        updated_at: r.updatedAt || nowIso(),
        deleted: Boolean(r.deleted),
      });
    });
  });
  rows.push({
    space_id: config.spaceId,
    kind: 'settings',
    id: 'settings',
    data: state.settings,
    updated_at: state.settings.updatedAt || nowIso(),
    deleted: false,
  });
  return rows;
}

/** Mezcla una fila remota en el estado local si es más nueva. */
function mergeRow(row) {
  if (row.kind === 'settings') {
    const remote = row.data || {};
    if ((remote.updatedAt || row.updated_at || '') > (state.settings.updatedAt || '')) {
      Object.assign(state.settings, remote, { updatedAt: remote.updatedAt || row.updated_at });
      return true;
    }
    return false;
  }
  if (!COLLECTIONS.includes(row.kind)) return false;
  const coll = state[row.kind];
  const incoming = { ...(row.data || {}), id: row.id, updatedAt: row.data?.updatedAt || row.updated_at, deleted: Boolean(row.deleted) };
  const idx = coll.findIndex((r) => r.id === row.id);
  if (idx === -1) {
    coll.push(incoming);
    return true;
  }
  const mine = coll[idx];
  if ((incoming.updatedAt || '') > (mine.updatedAt || '')) {
    coll[idx] = incoming;
    return true;
  }
  return false;
}

async function request(url, options) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    const res = await fetch(url, { ...options, signal: ctrl.signal });
    if (!res.ok) {
      const text = await res.text().catch(() => '');
      throw new Error(describeError(res.status, text));
    }
    return res;
  } finally {
    clearTimeout(timer);
  }
}

function describeError(status, text) {
  if (status === 401 || status === 403) return 'La clave no es válida o le faltan permisos (revisá la anon key y las policies).';
  if (status === 404) return 'No se encontró la tabla "records". ¿Corriste el script SQL en Supabase?';
  if (status === 400 && /column|schema/i.test(text)) return 'La tabla existe pero no tiene las columnas esperadas. Volvé a correr el script SQL.';
  return `Error ${status}: ${String(text).slice(0, 160) || 'sin detalle'}`;
}

/**
 * Ciclo completo: baja lo nuevo del servidor y sube lo que cambió acá.
 * @param {object} opts silent = no dispara re-render si no hubo cambios
 */
async function sync({ silent = false } = {}) {
  if (!isConfigured()) return { ok: false, reason: 'not-configured' };
  if (running) return { ok: false, reason: 'busy' };
  if (!navigator.onLine) {
    emit('offline');
    return { ok: false, reason: 'offline' };
  }

  running = true;
  emit('syncing');
  flush();

  try {
    /* 1) Bajar todo lo del espacio (los volúmenes acá son chicos: un hogar). */
    const pullUrl = `${endpoint('records')}?space_id=eq.${encodeURIComponent(config.spaceId)}&select=kind,id,data,updated_at,deleted`;
    const res = await request(pullUrl, { method: 'GET', headers: headers() });
    const remote = await res.json();

    let changed = false;
    const remoteById = new Map();
    remote.forEach((row) => {
      remoteById.set(`${row.kind}:${row.id}`, row);
      if (mergeRow(row)) changed = true;
    });

    /* 2) Subir lo que falta o es más nuevo acá. */
    const toPush = localRows().filter((row) => {
      const there = remoteById.get(`${row.kind}:${row.id}`);
      if (!there) return true;
      return (row.updated_at || '') > (there.updated_at || '');
    });

    for (let i = 0; i < toPush.length; i += 100) {
      const chunk = toPush.slice(i, i + 100);
      await request(endpoint('records'), {
        method: 'POST',
        headers: headers({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify(chunk),
      });
    }

    saveConfig({ lastSyncAt: nowIso() });
    if (changed) commit({ silent: false, action: 'sync' });
    else if (!silent) commit({ silent: true });

    emit('ok', { pulled: remote.length, pushed: toPush.length });
    return { ok: true, pulled: remote.length, pushed: toPush.length, changed };
  } catch (err) {
    console.error('Sync falló', err);
    emit('error', { message: err.message });
    return { ok: false, reason: 'error', message: err.message };
  } finally {
    running = false;
  }
}

/** Prueba la conexión sin escribir nada. */
async function testConnection({ url, key, spaceId }) {
  const base = String(url).replace(/\/+$/, '');
  const res = await fetch(`${base}/rest/v1/records?space_id=eq.${encodeURIComponent(spaceId)}&select=id&limit=1`, {
    headers: { apikey: key, Authorization: `Bearer ${key}` },
  });
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(describeError(res.status, text));
  }
  return true;
}

/* -------------------------------------------------- disparadores automáticos */

let debounceTimer = null;

function scheduleSync(delay = 2500) {
  if (!isConfigured() || !config.autoSync) return;
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => sync({ silent: true }), delay);
}

function startAutoSync() {
  if (!isConfigured()) return;
  sync({ silent: true });

  // Al volver a la app y al recuperar conexión, nos ponemos al día.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') scheduleSync(300);
  });
  window.addEventListener('online', () => scheduleSync(500));

  // Red de seguridad por si la otra persona carga algo mientras mirás la pantalla.
  setInterval(() => {
    if (document.visibilityState === 'visible') sync({ silent: true });
  }, 60000);
}

};

 * - custom: porcentajes por persona (splitPct)

  function montoEnPesos() {

  }

      field('Cotización del dólar', cotizacionInput,

        cotizacion
          ? `Se guarda como ${fmt(montoEnPesos())} en pesos.`
          : 'Poné la cotización para poder convertirlo a pesos.'),

    const per = draft.installments > 1 ? Math.round(total / draft.installments) : total;
    const shares = sharesOf({ ...draft, amountCents: per, paidBy: draft.paidBy }, roster);
    preview.replaceChildren(
      el('div', { class: 'row row--between', style: 'margin-bottom:8px' }, [
        el('span', { class: 'small muted', text: draft.installments > 1 ? `Cada cuota (${draft.installments} en total)` : 'Cómo se reparte' }),

      ]),

  const cuotasInput = input({
    type: 'number', min: '1', max: '60', step: '1', inputmode: 'numeric', value: '1',

      return;
    }
    draft.description = descInput.value.trim() || store.category(draft.categoryId).name;

      const sum = Object.values(draft.splitPct || {}).reduce((s, n) => s + (Number(n) || 0), 0);

      description: draft.description,
      categoryId: draft.categoryId,

      splitMode: draft.splitMode,
      splitTo: draft.splitMode === 'single' ? (draft.splitTo || draft.paidBy) : null,
      splitPct: draft.splitMode === 'custom' ? draft.splitPct : null,
      note: draft.note,
    };

      toast('Gasto actualizado.');
      return;

      const groupId = uid();
      const per = Math.floor(total / n);
      const extra = total - per * n; // el resto va en la primera cuota
      for (let i = 0; i < n; i += 1) {
        const m = addMonths(monthKey(draft.date), i);
        const day = clampDay(m, Number(draft.date.slice(8, 10)));
        store.add('expenses', {
          ...payload,
          date: `${m}-${String(day).padStart(2, '0')}`,
          description: `${draft.description} (${i + 1}/${n})`,
          amountCents: per + (i === 0 ? extra : 0),
          installment: { groupId, n: i + 1, of: n },
          createdAt: new Date().toISOString(),

      return;

    const created = store.add('expenses', { ...payload, amountCents: total, createdAt: new Date().toISOString() });
    closeSheet();
    toast(`${fmt(total)} en ${store.category(draft.categoryId).name}.`, {
      action: 'Deshacer',
      onAction: () => { store.remove('expenses', created.id); toast('Gasto eliminado.'); },
    });

    const ok = await confirmSheet('¿Borrar este gasto?', `Se elimina "${existing.description}" de ${fmt(existing.amountCents)}.`, {
      confirmText: 'Borrar', danger: true,
    });
    if (!ok) return;
    store.remove('expenses', existing.id);
    toast('Gasto eliminado.', {
      action: 'Deshacer',
      onAction: () => store.restore('expenses', existing.id),
    });

  const body = el('div', {}, [
    field('Monto', amountInput),
    monedaSeg,
    monedaWrap,
    el('div', { style: 'height:13px' }),
    field('Descripción', descInput),
    el('div', { class: 'grid-2', style: 'margin-bottom:13px' }, [
      field('Fecha', dateInput),
      !isEdit ? field('Cuotas', cuotasInput, '1 = pago único') : null,
    ]),
    field('Categoría', catPicker),
    field('¿Quién pagó?', payerSeg),
    field('División', splitSeg),
    customWrap,
    el('div', { style: 'margin:12px 0' }, [preview]),
    field('Nota (opcional)', el('textarea', {
      class: 'textarea',
      placeholder: 'Detalle, número de factura, lo que sirva…',
      oninput: (e) => { draft.note = e.target.value; },
    }, draft.note)),
    footerButtons(isEdit ? 'Guardar' : 'Agregar gasto', save, {
      extra: isEdit ? el('button', { class: 'btn btn--danger', type: 'button', text: 'Borrar', onclick: del }) : null,
    }),
  ]);

  renderCustom();
  renderMoneda();
  renderPreview();
  openSheet(isEdit ? 'Editar gasto' : 'Nuevo gasto', body);

}
