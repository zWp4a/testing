<!doctype html><html lang="es" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><title>Nuestra Casa</title>

<style>
/* =========================================================
   Nuestra Casa — hoja de estilos
   Tokens claros/oscuros. Mobile-first. Sin dependencias.
   ========================================================= */

:root {
  color-scheme: light;

  /* superficies e ink */
  --plane:          #f9f9f7;
  --surface-1:      #fcfcfb;
  --surface-2:      #f2f1ed;
  --surface-3:      #e9e8e2;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --grid:           #e1e0d9;
  --axis:           #c3c2b7;
  --border:         rgba(11, 11, 11, 0.10);
  --border-strong:  rgba(11, 11, 11, 0.18);
  --shadow-1: 0 1px 2px rgba(11,11,11,.06), 0 2px 8px rgba(11,11,11,.05);
  --shadow-2: 0 8px 28px rgba(11,11,11,.14);

  /* serie / acento */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --accent:      #2a78d6;
  --accent-ink:  #ffffff;
  --accent-soft: #cde2fb;
  --accent-deep: #184f95;

  /* estado */
  --good:     #0ca30c;
  --warning:  #fab219;
  --serious:  #ec835a;
  --critical: #d03b3b;
  --good-text: #006300;
  --critical-text: #a52626;

  /* rampa secuencial azul */
  --seq-250: #86b6ef;
  --seq-400: #3987e5;
  --seq-450: #2a78d6;
  --seq-550: #1c5cab;

  --radius-sm: 8px;
  --radius:    14px;
  --radius-lg: 20px;
  --tap: 44px;

  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:          #0d0d0d;
    --surface-1:      #1a1a19;
    --surface-2:      #222220;
    --surface-3:      #2c2c2a;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --axis:           #383835;
    --border:         rgba(255, 255, 255, 0.10);
    --border-strong:  rgba(255, 255, 255, 0.20);
    --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
    --shadow-2: 0 10px 34px rgba(0,0,0,.55);

    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --accent:      #3987e5;
    --accent-ink:  #ffffff;
    --accent-soft: #184f95;
    --accent-deep: #86b6ef;

    --good-text: #0ca30c;
    --critical-text: #e66767;

    --seq-250: #184f95;
    --seq-400: #2a78d6;
    --seq-450: #3987e5;
    --seq-550: #86b6ef;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:          #0d0d0d;
  --surface-1:      #1a1a19;
  --surface-2:      #222220;
  --surface-3:      #2c2c2a;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --grid:           #2c2c2a;
  --axis:           #383835;
  --border:         rgba(255, 255, 255, 0.10);
  --border-strong:  rgba(255, 255, 255, 0.20);
  --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --shadow-2: 0 10px 34px rgba(0,0,0,.55);

  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --accent:      #3987e5;
  --accent-ink:  #ffffff;
  --accent-soft: #184f95;
  --accent-deep: #86b6ef;

  --good-text: #0ca30c;
  --critical-text: #e66767;

  --seq-250: #184f95;
  --seq-400: #2a78d6;
  --seq-450: #3987e5;
  --seq-550: #86b6ef;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background: var(--plane);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}

h1, h2, h3, h4 { margin: 0; font-weight: 650; line-height: 1.2; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ---------------------------------------------------------
   Layout
   --------------------------------------------------------- */

.app {
  min-height: 100dvh;
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: auto 1fr auto;
  grid-template-areas: "topbar" "main" "tabbar";
}

.topbar {
  grid-area: topbar;
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: max(8px, env(safe-area-inset-top)) 14px 8px;
  background: color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--border);
}

.topbar__brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.topbar__logo { font-size: 20px; line-height: 1; }
.topbar__title { font-weight: 680; font-size: 17px; letter-spacing: -0.015em; }
.topbar__actions { display: flex; gap: 6px; align-items: center; }

.sidenav { display: none; }

.main {
  grid-area: main;
  width: 100%;
  max-width: 880px;
  margin: 0 auto;
  padding: 14px 14px 108px;
  outline: none;
}

.tabbar {
  grid-area: tabbar;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 2px;
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--surface-1) 94%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  border-top: 1px solid var(--border);
}

.tabbar__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px;
  border-radius: 12px;
  text-decoration: none;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 560;
  min-height: var(--tap);
  justify-content: center;
}
.tabbar__ico { font-size: 19px; line-height: 1; filter: grayscale(1); opacity: .75; }
.tabbar__item[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.tabbar__item[aria-current="page"] .tabbar__ico { filter: none; opacity: 1; }

.fab {
  position: fixed;
  right: 16px;
  bottom: calc(74px + env(safe-area-inset-bottom));
  z-index: 31;
  width: 56px; height: 56px;
  border: none;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 28px;
  font-weight: 400;
  line-height: 1;
  box-shadow: var(--shadow-2);
  cursor: pointer;
  transition: transform .12s ease;
}
.fab:active { transform: scale(.94); }

@media (min-width: 860px) {
  .app {
    grid-template-columns: 232px 1fr;
    grid-template-areas: "topbar topbar" "sidenav main";
  }
  .topbar { padding: 12px 20px; }
  .sidenav {
    grid-area: sidenav;
    display: block;
    position: sticky;
    top: 57px;
    align-self: start;
    padding: 16px 12px;
    height: calc(100dvh - 57px);
    border-right: 1px solid var(--border);
  }
  .sidenav__item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 12px;
    margin-bottom: 3px;
    border-radius: 11px;
    text-decoration: none;
    color: var(--text-secondary);
    font-weight: 560;
    font-size: 15px;
  }
  .sidenav__item:hover { background: var(--surface-2); color: var(--text-primary); }
  .sidenav__ico { font-size: 17px; filter: grayscale(1); opacity: .8; }
  .sidenav__item[aria-current="page"] {
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent);
  }
  .sidenav__item[aria-current="page"] .sidenav__ico { filter: none; opacity: 1; }
  .tabbar { display: none; }
  .main { padding: 22px 24px 80px; margin: 0; max-width: 940px; }
  .fab { bottom: 28px; right: 28px; }
}

/* ---------------------------------------------------------
   Piezas base
   --------------------------------------------------------- */

.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-1);
  padding: 15px;
  margin-bottom: 12px;
}
.card--flush { padding: 0; overflow: hidden; }

.card__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.card__title { font-size: 14px; font-weight: 640; letter-spacing: .005em; }
.card__meta { font-size: 12.5px; color: var(--text-muted); }

.section-title {
  font-size: 12px;
  font-weight: 640;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--text-muted);
  margin: 20px 2px 9px;
}
.section-title:first-child { margin-top: 4px; }

.row { display: flex; align-items: center; gap: 10px; }
.row--between { justify-content: space-between; }
.row--wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 10px; }
.muted { color: var(--text-muted); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.hidden { display: none !important; }

/* Botones */
.btn {
  appearance: none;
  border: 1px solid var(--border-strong);
  background: var(--surface-1);
  color: var(--text-primary);
  font: inherit;
  font-size: 14.5px;
  font-weight: 580;
  padding: 10px 14px;
  min-height: var(--tap);
  border-radius: 11px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: background .12s ease, transform .1s ease;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.985); }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn--primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn--ghost { border-color: transparent; background: transparent; color: var(--text-secondary); }
.btn--ghost:hover { background: var(--surface-2); }
.btn--danger { color: var(--critical-text); border-color: color-mix(in srgb, var(--critical) 35%, transparent); }
.btn--danger:hover { background: color-mix(in srgb, var(--critical) 10%, transparent); }
.btn--sm { min-height: 34px; padding: 5px 11px; font-size: 13px; border-radius: 9px; }
.btn--block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.iconbtn {
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  width: 38px; height: 38px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  cursor: pointer;
  padding: 0;
}
.iconbtn:hover { background: var(--surface-2); color: var(--text-primary); }
.iconbtn__glyph { display: block; line-height: 1; }
.iconbtn.is-spinning .iconbtn__glyph { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Formularios */
.field { display: block; margin-bottom: 13px; }
.field__label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 5px;
}
.field__hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; }

.input, .select, .textarea {
  width: 100%;
  font: inherit;
  font-size: 16px; /* evita el zoom de iOS */
  color: var(--text-primary);
  background: var(--surface-1);
  border: 1px solid var(--border-strong);
  border-radius: 11px;
  padding: 11px 12px;
  min-height: var(--tap);
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
.textarea { min-height: 74px; resize: vertical; }
.select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 32px;
}
.input--amount {
  font-size: 26px;
  font-weight: 660;
  letter-spacing: -0.02em;
  padding: 12px 14px;
  font-variant-numeric: tabular-nums;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-2 > .field { margin-bottom: 0; }

/* Segmentos (chips de opción) */
.seg {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--surface-2);
  border-radius: 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.seg::-webkit-scrollbar { display: none; }
.seg__opt {
  flex: 1 0 auto;
  appearance: none;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font: inherit;
  font-size: 13.5px;
  font-weight: 580;
  padding: 8px 12px;
  min-height: 36px;
  border-radius: 9px;
  cursor: pointer;
  white-space: nowrap;
}
.seg__opt[aria-pressed="true"] {
  background: var(--surface-1);
  color: var(--text-primary);
  box-shadow: var(--shadow-1);
}

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  appearance: none;
  border: 1px solid var(--border-strong);
  background: var(--surface-1);
  color: var(--text-secondary);
  font: inherit;
  font-size: 13.5px;
  font-weight: 550;
  padding: 7px 11px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
}
.chip[aria-pressed="true"] {
  background: color-mix(in srgb, var(--accent) 13%, var(--surface-1));
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  color: var(--accent-deep);
}

/* Switch */
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--tap); }
.switch__box {
  appearance: none;
  flex: none;
  width: 46px; height: 28px;
  border-radius: 999px;
  background: var(--surface-3);
  border: 1px solid var(--border-strong);
  position: relative;
  cursor: pointer;
  transition: background .15s ease;
}
.switch__box::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--surface-1);
  box-shadow: var(--shadow-1);
  transition: transform .15s ease;
}
.switch__box:checked { background: var(--accent); border-color: var(--accent); }
.switch__box:checked::after { transform: translateX(18px); }

/* Etiquetas de estado */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 620;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text-secondary);
  white-space: nowrap;
}
.tag--good     { background: color-mix(in srgb, var(--good) 15%, var(--surface-1));     color: var(--good-text); }
.tag--warning  { background: color-mix(in srgb, var(--warning) 22%, var(--surface-1));  color: var(--text-primary); }
.tag--critical { background: color-mix(in srgb, var(--critical) 15%, var(--surface-1)); color: var(--critical-text); }
.tag--accent   { background: color-mix(in srgb, var(--accent) 14%, var(--surface-1));   color: var(--accent-deep); }

/* Avatar de persona */
.who {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 30px; height: 30px;
  border-radius: 50%;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  letter-spacing: .01em;
}
.who--lg { width: 40px; height: 40px; font-size: 15px; }

/* ---------------------------------------------------------
   Listas
   --------------------------------------------------------- */

.list { list-style: none; margin: 0; padding: 0; }
.list__item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 15px;
  border-bottom: 1px solid var(--border);
  background: none;
  border-left: none; border-right: none; border-top: none;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
  cursor: pointer;
  min-height: 58px;
}
.list__item:last-child { border-bottom: none; }
.list__item:hover { background: var(--surface-2); }

/* Zona clickeable cuando la fila además tiene su propio botón de acción. */
.list__hit {
  display: flex;
  align-items: center;
  gap: 11px;
  flex: 1;
  min-width: 0;
  padding: 0;
  margin: -11px 0;
  min-height: 58px;
  background: none;
  border: none;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
.list__ico {
  flex: none;
  width: 36px; height: 36px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 17px;
  background: var(--surface-2);
}
.list__body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1px;
}
.list__title {
  display: block;
  font-size: 14.5px;
  font-weight: 580;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.list__sub {
  display: block;
  font-size: 12.5px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.35;
}
.list__amount {
  flex: none;
  font-size: 15px;
  font-weight: 640;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.list__group {
  padding: 9px 15px 5px;
  font-size: 11.5px;
  font-weight: 640;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text-muted);
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
}

.empty {
  text-align: center;
  padding: 32px 20px;
  color: var(--text-muted);
}
.empty__ico { font-size: 34px; display: block; margin-bottom: 8px; opacity: .8; }
.empty__title { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.empty__text { font-size: 13.5px; max-width: 34ch; margin: 0 auto; }

/* ---------------------------------------------------------
   Balance / hero
   --------------------------------------------------------- */

.hero {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1);
  padding: 20px 18px;
  margin-bottom: 12px;
  text-align: center;
}
.hero__label {
  font-size: 12px;
  font-weight: 620;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--text-muted);
}
.hero__value {
  font-size: clamp(34px, 11vw, 46px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin: 7px 0 3px;
}
.hero__caption { font-size: 14px; color: var(--text-secondary); }
.hero__actions { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 12px; }
.tile {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-1);
  padding: 13px 14px;
}
.tile__label { font-size: 12px; font-weight: 580; color: var(--text-muted); margin-bottom: 3px; }
.tile__value { font-size: 21px; font-weight: 680; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tile__delta { font-size: 12px; font-weight: 580; margin-top: 3px; display: flex; align-items: center; gap: 4px; }
.tile__delta--up   { color: var(--critical-text); }
.tile__delta--down { color: var(--good-text); }
.tile__delta--flat { color: var(--text-muted); }

/* ---------------------------------------------------------
   Gráficos
   --------------------------------------------------------- */

.bars { display: grid; gap: 11px; }
.bar__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 5px;
  font-size: 13px;
}
.bar__name { color: var(--text-secondary); font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar__val  { color: var(--text-primary); font-weight: 620; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar__track {
  height: 9px;
  background: var(--surface-2);
  border-radius: 999px;
  overflow: hidden;
}
.bar__fill {
  height: 100%;
  border-radius: 999px;
  background: var(--seq-450);
  min-width: 4px;
  transition: width .35s cubic-bezier(.22,.61,.36,1);
}

  { key: 'comida',       name: 'Comida y delivery', emoji: '🍔' },
  { key: 'transporte',   name: 'Transporte',    emoji: '🚌' },
  { key: 'salud',        name: 'Salud',         emoji: '💊' },
  { key: 'hogar',        name: 'Hogar',         emoji: '🛋️' },
  { key: 'mascota',      name: 'Mascota',       emoji: '🐾' },
  { key: 'salidas',      name: 'Salidas',       emoji: '🎉' },
  { key: 'suscripciones', name: 'Suscripciones', emoji: '📺' },
  { key: 'regalos',      name: 'Regalos',       emoji: '🎁' },
  { key: 'otros',        name: 'Otros',         emoji: '📦' },
];

const PERSON_COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#4a3aa7', '#e87ba4', '#eda100'];

function freshState() {
  const ts = nowIso();
  const people = [
    { id: uid(), name: 'Yo', color: PERSON_COLORS[0], updatedAt: ts, deleted: false },
    { id: uid(), name: 'Mi pareja', color: PERSON_COLORS[1], updatedAt: ts, deleted: false },
  ];
  const categories = DEFAULT_CATEGORIES.map((c) => ({
    id: c.key,
    name: c.name,
    emoji: c.emoji,
    budgetCents: 0,
    updatedAt: ts,
    deleted: false,
  }));
  return {
    version: 1,
    settings: {
      currency: 'ARS',
      locale: 'es-AR',
      defaultPayer: people[0].id,
      defaultSplit: 'equal',
      homeName: 'Nuestra Casa',
      updatedAt: ts,
    },
    people,
    categories,
    expenses: [],
    fixed: [],
    shopping: [],
    goals: [],
    settlements: [],
  };
}

/* ----------------------------------------------------------- persistencia */

function readLocal() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return migrate(parsed);
  } catch (err) {
    console.error('No se pudo leer el estado guardado', err);
    return null;
  }
}

function migrate(s) {
  if (!s || typeof s !== 'object') return null;
  s.version = s.version || 1;
  COLLECTIONS.forEach((c) => { if (!Array.isArray(s[c])) s[c] = []; });
  s.settings = { ...freshState().settings, ...(s.settings || {}) };
  if (!s.people.length) s.people = freshState().people;
  if (!s.categories.length) s.categories = freshState().categories;
  return s;
}

const state = readLocal() || freshState();

/* Config del dispositivo: no viaja en el backup ni en la nube. */
function readConfig() {
  try {
    return JSON.parse(localStorage.getItem(CONFIG_KEY)) || {};
  } catch {
    return {};
  }
}

const config = {
  theme: 'auto',
  supabaseUrl: '',
  supabaseKey: '',
  spaceId: '',
  meId: '',
  autoSync: true,
  lastSyncAt: '',
  ...readConfig(),
};

function saveConfig(patch = {}) {
  Object.assign(config, patch);
  try {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
  } catch (err) {
    console.error('No se pudo guardar la configuración', err);
  }
  return config;
}

/* ------------------------------------------------------ eventos y guardado */

const listeners = new Set();

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function emit(detail) {
  listeners.forEach((fn) => {
    try { fn(detail); } catch (err) { console.error(err); }
  });
}

let saveTimer = null;
let storageFull = false;

function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 120);
}

function flush() {
  clearTimeout(saveTimer);
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    storageFull = false;
  } catch (err) {
    if (!storageFull) {
      storageFull = true;
      console.error('No hay espacio para guardar', err);
      emit({ type: 'storage-error' });
    }
  }
}

/** Guarda y avisa a la UI. `silent` evita el re-render (p. ej. durante sync). */
function commit(detail = {}) {
  persist();
  if (!detail.silent) emit({ type: 'change', ...detail });
}

window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flush();
});

/* Otra pestaña del mismo navegador tocó los datos: recargamos en memoria. */
window.addEventListener('storage', (e) => {
  if (e.key !== KEY || !e.newValue) return;
  try {
    const incoming = migrate(JSON.parse(e.newValue));
    if (!incoming) return;
    Object.keys(state).forEach((k) => delete state[k]);
    Object.assign(state, incoming);
    emit({ type: 'change', external: true });
  } catch { /* ignoramos payloads corruptos */ }
});

/* -------------------------------------------------------------------- CRUD */

function list(collection, { includeDeleted = false } = {}) {
  const arr = state[collection] || [];
  return includeDeleted ? arr : arr.filter((r) => !r.deleted);
}

function get(collection, id) {
  return (state[collection] || []).find((r) => r.id === id) || null;
}

function add(collection, data) {
  const record = { id: uid(), ...data, updatedAt: nowIso(), deleted: false };
  state[collection].push(record);
  commit({ collection, id: record.id, action: 'add' });
  return record;
}

function update(collection, id, patch) {
  const record = get(collection, id);
  if (!record) return null;
  Object.assign(record, patch, { updatedAt: nowIso() });
  commit({ collection, id, action: 'update' });
  return record;
}

/** Borrado lógico: el registro queda como tumba para que la sync lo propague. */
function remove(collection, id) {
  const record = get(collection, id);
  if (!record) return null;
  record.deleted = true;
  record.updatedAt = nowIso();
  commit({ collection, id, action: 'remove' });
  return record;
}

function restore(collection, id) {
  return update(collection, id, { deleted: false });
}

function setSettings(patch) {
  Object.assign(state.settings, patch, { updatedAt: nowIso() });
  commit({ collection: 'settings', action: 'update' });
  return state.settings;
}

/* ------------------------------------------------------------- accesos útiles */

function people() {
  return list('people');
}

function person(id) {
  return get('people', id) || { id, name: 'Alguien', color: '#898781' };
}

function categories() {
  return list('categories');
}

function category(id) {
  return get('categories', id) || { id, name: 'Otros', emoji: '📦', budgetCents: 0 };
}

function nextPersonColor() {
  const used = new Set(people().map((p) => p.color));
  return PERSON_COLORS.find((c) => !used.has(c)) || PERSON_COLORS[0];
}

/** Quién soy yo en este dispositivo (para los atajos "pagué yo"). */
function me() {
  const found = config.meId && get('people', config.meId);
  return found && !found.deleted ? found : people()[0];
}

/* --------------------------------------------------------- import / export */

function exportData() {
  return JSON.stringify({
    app: 'nuestra-casa',
    version: state.version,
    exportedAt: nowIso(),
    data: {
      settings: state.settings,
      people: state.people,
      categories: state.categories,
      expenses: state.expenses,
      fixed: state.fixed,
      shopping: state.shopping,
      goals: state.goals,
      settlements: state.settlements,
    },
  }, null, 2);
}

/**
 * Importa un backup. `mode: 'merge'` conserva lo local y agrega lo que falte
 * (gana el `updatedAt` más nuevo); `mode: 'replace'` pisa todo.
 */
function importData(json, { mode = 'merge' } = {}) {
  const parsed = typeof json === 'string' ? JSON.parse(json) : json;
  const data = parsed.data || parsed;
  if (!data || typeof data !== 'object') throw new Error('El archivo no tiene el formato esperado.');

  let count = 0;
  if (mode === 'replace') {
    COLLECTIONS.forEach((c) => {
      if (Array.isArray(data[c])) { state[c] = data[c]; count += data[c].length; }
    });
    if (data.settings) state.settings = { ...state.settings, ...data.settings };
  } else {
    COLLECTIONS.forEach((c) => {
      if (!Array.isArray(data[c])) return;
      const byId = new Map(state[c].map((r) => [r.id, r]));
      data[c].forEach((incoming) => {
        if (!incoming || !incoming.id) return;
        const mine = byId.get(incoming.id);
        if (!mine) {
          state[c].push({ deleted: false, updatedAt: nowIso(), ...incoming });
          count += 1;
        } else if ((incoming.updatedAt || '') > (mine.updatedAt || '')) {
          Object.assign(mine, incoming);
          count += 1;
        }
      });
    });
  }
  commit({ action: 'import' });
  return count;
}

function resetAll() {
  const fresh = freshState();
  Object.keys(state).forEach((k) => delete state[k]);
  Object.assign(state, fresh);
  commit({ action: 'reset' });
}

/** Datos de ejemplo para ver la app con contenido antes de cargar lo real. */
function seedDemo() {
  const [a, b] = people();
  const m = currentMonth();
  const day = (d) => `${m}-${String(d).padStart(2, '0')}`;
  const rows = [
    ['Alquiler', 450000, 'alquiler', a.id, 1, 'equal'],
    ['Expensas', 78000, 'expensas', b.id, 3, 'equal'],
    ['Edenor', 32400, 'luz', a.id, 8, 'equal'],
    ['Internet fibra', 29900, 'internet', b.id, 5, 'equal'],
    ['Compra grande del mes', 186500, 'super', a.id, 6, 'equal'],
    ['Verdulería', 14200, 'super', b.id, 11, 'equal'],
    ['Cena aniversario', 62000, 'salidas', a.id, 12, 'equal'],
    ['Nafta', 45000, 'transporte', b.id, 9, 'single'],
    ['Veterinaria', 38000, 'mascota', a.id, 14, 'equal'],
  ];
  rows.forEach(([desc, amount, cat, payer, d, splitMode]) => {
    add('expenses', {
      date: day(d),
      description: desc,
      amountCents: amount * 100,
      categoryId: cat,
      paidBy: payer,
      splitMode,
      splitTo: splitMode === 'single' ? payer : null,
      splitPct: null,
      note: '',
    });
  });
  [
    ['Alquiler', 450000, 'alquiler', 1, a.id],
    ['Expensas', 78000, 'expensas', 3, b.id],
    ['Internet fibra', 29900, 'internet', 5, b.id],
    ['Netflix', 9900, 'suscripciones', 20, a.id],
  ].forEach(([name, amount, cat, dayOfMonth, payer]) => {
    add('fixed', {
      name, amountCents: amount * 100, categoryId: cat, dayOfMonth,
      paidBy: payer, splitMode: 'equal', splitTo: null, splitPct: null, active: true,
    });
  });
  ['Leche', 'Pan', 'Café', 'Huevos', 'Papel higiénico', 'Detergente'].forEach((name) => {
    add('shopping', { name, qty: 1, unit: '', estPriceCents: 0, done: false, staple: true, lastPriceCents: 0 });
  });
  add('goals', { name: 'Vacaciones', targetCents: 150000000, deadline: '', contributions: [] });
}

Object.assign(__exports, { saveConfig, subscribe, persist, flush, commit, list, get, add, update, remove, restore, setSettings, people, person, categories, category, nextPersonColor, me, exportData, importData, resetAll, seedDemo, COLLECTIONS, DEFAULT_CATEGORIES, state, config });
};

__defs["js/router.js"] = (__exports, __req) => {
/* Enrutado por hash: #/gastos?month=2026-08 — funciona en GitHub Pages y offline. */

const routes = new Map();
let currentRoute = null;
let onRender = null;

function defineRoute(name, render) {
  routes.set(name, render);
}

function setRenderHook(fn) {
  onRender = fn;
}

function parseHash(hash = location.hash) {
  const raw = String(hash || '').replace(/^#\/?/, '');
  const [path, query] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  const params = {};
  new URLSearchParams(query || '').forEach((v, k) => { params[k] = v; });
  return { name: parts[0] || 'resumen', segments: parts.slice(1), params };
}

function buildHash(name, params = {}) {
  const q = new URLSearchParams(
    Object.entries(params).filter(([, v]) => v !== null && v !== undefined && v !== ''),
  ).toString();
  return `#/${name}${q ? `?${q}` : ''}`;
}

function navigate(name, params = {}) {
  const next = buildHash(name, params);
  if (location.hash === next) render();
  else location.hash = next;
}

function current() {
  return currentRoute;
}

function render() {
  const route = parseHash();
  // Un re-dibujo por un cambio de datos no debe mover la página: sólo
  // volvemos arriba cuando de verdad cambiaste de pantalla.
  const changedScreen = !currentRoute
    || currentRoute.name !== route.name
    || JSON.stringify(currentRoute.params) !== JSON.stringify(route.params);
  currentRoute = route;
  const view = routes.get(route.name) || routes.get('resumen');

  const root = document.getElementById('view');
  const keepScroll = window.scrollY;

  // Si estabas escribiendo en un campo marcado con data-focus-key, el
  // re-dibujo no te tiene que sacar el teclado ni el cursor de lugar.
  const active = document.activeElement;
  const focusKey = active && active.dataset ? active.dataset.focusKey : null;
  const typed = focusKey ? active.value : null;
  const caret = focusKey && 'selectionStart' in active
    ? { start: active.selectionStart, end: active.selectionEnd }
    : null;

  root.replaceChildren();
  try {
    view(root, route.params, route.segments);
  } catch (err) {
    console.error('Error al dibujar la vista', err);
    root.append(Object.assign(document.createElement('div'), {
      className: 'card',
      textContent: 'Algo salió mal al mostrar esta pantalla. Probá recargar la página.',
    }));
  }

  // En la barra inferior, "Más" (ajustes) queda activo también en Metas.
  const fallback = { metas: 'ajustes' };
  document.querySelectorAll('[data-nav]').forEach((a) => {
    const inBottomBar = a.classList.contains('tabbar__item');
    const matches = a.dataset.nav === route.name
      || (inBottomBar && fallback[route.name] === a.dataset.nav);
    if (matches) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });

  if (focusKey) {
    const again = root.querySelector(`[data-focus-key="${focusKey}"]`);
    if (again) {
      // Lo que estabas tecleando no se pierde aunque entre una sincronización.
      if (typed && !again.value) again.value = typed;
      again.focus({ preventScroll: true });
      if (caret && 'setSelectionRange' in again) {
        try { again.setSelectionRange(caret.start, caret.end); } catch { /* type sin selección */ }
      }
    }
  }

  if (onRender) onRender(route);
  if (changedScreen) window.scrollTo({ top: 0 });
  else window.scrollTo({ top: keepScroll });
}

window.addEventListener('hashchange', render);

Object.assign(__exports, { defineRoute, setRenderHook, parseHash, buildHash, navigate, current, render });
};

__defs["js/theme.js"] = (__exports, __req) => {
/* Tema claro / oscuro / automático. */

const { config } = __req("js/store.js");

const meta = () => document.querySelectorAll('meta[name="theme-color"]');

// Si la página venía con un tema puesto desde afuera, "automático" lo respeta
// en vez de borrarlo: sólo limpiamos la marca que puso la propia app.
let stampedByApp = false;

function applyTheme(mode = config.theme || 'auto') {
  const root = document.documentElement;
  if (mode === 'auto') {
    if (stampedByApp) root.removeAttribute('data-theme');
    stampedByApp = false;
  } else {
    root.setAttribute('data-theme', mode);
    stampedByApp = true;
  }

  // La barra del navegador en el celular tiene que acompañar al tema elegido.
  const effective = mode === 'auto' ? (root.getAttribute('data-theme') || 'auto') : mode;
  const dark = effective === 'dark'
    || (effective === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  meta().forEach((m) => m.setAttribute('content', dark ? '#0d0d0d' : '#fcfcfb'));
}

function cycleTheme() {
  const order = ['auto', 'light', 'dark'];
  const next = order[(order.indexOf(config.theme || 'auto') + 1) % order.length];
  return next;
}

function themeLabel(mode) {
  return { auto: 'Automático', light: 'Claro', dark: 'Oscuro' }[mode] || 'Automático';
}

Object.assign(__exports, { applyTheme, cycleTheme, themeLabel });
};

__defs["js/ui.js"] = (__exports, __req) => {
/* Piezas de interfaz reutilizables: hoja modal, avisos, gráficos y formularios. */

const { el, clear, money, initials, monthLabel, addMonths, currentMonth } = __req("js/util.js");
const { state } = __req("js/store.js");

/* ------------------------------------------------------------------ dinero */

function fmt(cents, opts = {}) {
  return money(cents, {
    locale: state.settings.locale || 'es-AR',
    currency: state.settings.currency || 'ARS',
    ...opts,
  });
}

function fmtShort(cents) {
  return fmt(cents, { compact: true, cents: false });
}

/* ------------------------------------------------------------- hoja modal */

const sheetEl = document.getElementById('sheet');
const sheetTitle = document.getElementById('sheet-title');
const sheetBody = document.getElementById('sheet-body');
let lastFocus = null;
let onSheetClose = null;

function openSheet(title, content, { onClose = null } = {}) {
  lastFocus = document.activeElement;
  onSheetClose = onClose;
  // Los avisos de la acción anterior no deben quedar flotando sobre la hoja.
  dismissToasts();
  sheetTitle.textContent = title;
  clear(sheetBody);
  sheetBody.append(content);
  sheetEl.hidden = false;
  document.body.style.overflow = 'hidden';
  const focusable = sheetBody.querySelector('input:not([type=hidden]), select, textarea, button');
  // En móvil, enfocar de una abre el teclado y tapa el formulario.
  if (focusable && window.matchMedia('(min-width: 700px)').matches) focusable.focus();
}

function closeSheet() {
  if (sheetEl.hidden) return;
  sheetEl.hidden = true;
  clear(sheetBody);
  document.body.style.overflow = '';
  const cb = onSheetClose;
  onSheetClose = null;
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  if (cb) cb();
}

sheetEl.addEventListener('click', (e) => {
  if (e.target.closest('[data-close-sheet]')) closeSheet();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !sheetEl.hidden) closeSheet();
});

/* ---------------------------------------------------------------- avisos */

const toastsEl = document.getElementById('toasts');

function dismissToasts() {
  toastsEl.replaceChildren();
}

function toast(message, { action = null, onAction = null, ms = 3800 } = {}) {
  const node = el('div', { class: 'toast', role: 'status' }, [el('span', { class: 'grow', text: message })]);
  if (action && onAction) {
    node.append(el('button', {
      class: 'toast__action',
      type: 'button',
      text: action,
      onclick: () => { node.remove(); onAction(); },
    }));
  }
  toastsEl.append(node);
  setTimeout(() => {
    node.style.transition = 'opacity .2s ease';
    node.style.opacity = '0';
    setTimeout(() => node.remove(), 220);
  }, ms);
  return node;
}

function confirmSheet(title, message, { confirmText = 'Confirmar', danger = false } = {}) {
  return new Promise((resolve) => {
    let decided = false;
    const body = el('div', {}, [
      el('p', { class: 'muted', text: message, style: 'margin-bottom:6px' }),
      el('div', { class: 'sheet__footer' }, [
        el('button', {
          class: 'btn', type: 'button', text: 'Cancelar',
          onclick: () => { decided = true; closeSheet(); resolve(false); },
        }),
        el('button', {
          class: `btn ${danger ? 'btn--danger' : 'btn--primary'}`, type: 'button', text: confirmText,
          onclick: () => { decided = true; closeSheet(); resolve(true); },
        }),
      ]),
    ]);
    openSheet(title, body, { onClose: () => { if (!decided) resolve(false); } });
  });
}

/* -------------------------------------------------------------- personas */

function avatar(personObj, { large = false } = {}) {
  return el('span', {
    class: `who${large ? ' who--lg' : ''}`,
    style: `background:${personObj.color || '#898781'}`,
    title: personObj.name,
    'aria-hidden': 'true',
  }, initials(personObj.name));
}

/* ------------------------------------------------------------ formularios */

function field(label, control, hint) {
  return el('label', { class: 'field' }, [
    el('span', { class: 'field__label', text: label }),
    control,
    hint ? el('span', { class: 'field__hint', text: hint }) : null,
  ]);
}

function input(attrs = {}) {
  return el('input', { class: 'input', ...attrs });
}

function select(options, value, attrs = {}) {
  const node = el('select', { class: 'select', ...attrs });
  options.forEach((o) => {
    node.append(el('option', { value: o.value, selected: String(o.value) === String(value) }, o.label));
  });
  return node;
}

/**
 * Grupo de opciones tipo segmento. onChange recibe el valor elegido.
 * Devuelve el nodo; leer el valor con `node.value`.
 */
function segmented(options, value, onChange) {
  const node = el('div', { class: 'seg', role: 'group' });
  node.value = value;
  options.forEach((o) => {
    const btn = el('button', {
      class: 'seg__opt',
      type: 'button',
      'aria-pressed': String(o.value) === String(value),
      text: o.label,
      onclick: () => {
        node.value = o.value;
        [...node.children].forEach((c) => c.setAttribute('aria-pressed', String(c === btn)));
        if (onChange) onChange(o.value);

    });
    node.append(btn);
  });

function switchRow(label, checked, onChange, hint) {
  const box = el('input', { class: 'switch__box', type: 'checkbox', checked, onchange: (e) => onChange(e.target.checked) });
  return el('label', { class: 'field' }, [
    el('span', { class: 'switch' }, [
      el('span', {}, [
        el('span', { class: 'field__label', text: label, style: 'margin:0' }),
        hint ? el('span', { class: 'field__hint', text: hint, style: 'margin-top:2px' }) : null,
      ]),
      box,
    ]),
  ]);
}

function footerButtons(primaryLabel, onPrimary, { secondaryLabel = 'Cancelar', onSecondary = closeSheet, extra = null } = {}) {
  return el('div', { class: 'sheet__footer' }, [
    extra,
    el('button', { class: 'btn', type: 'button', text: secondaryLabel, onclick: onSecondary }),
    el('button', { class: 'btn btn--primary', type: 'button', text: primaryLabel, onclick: onPrimary }),
  ]);
}

/* --------------------------------------------------------------- vacíos */

function emptyState(icon, title, text, actionLabel, onAction) {
  return el('div', { class: 'empty' }, [
    el('span', { class: 'empty__ico', 'aria-hidden': 'true', text: icon }),
    el('p', { class: 'empty__title', text: title }),
    el('p', { class: 'empty__text', text }),
    actionLabel ? el('button', {
      class: 'btn btn--primary', type: 'button', text: actionLabel,
      style: 'margin-top:14px', onclick: onAction,
    }) : null,
  ]);
}

/* ------------------------------------------------------------ selector mes */

function monthNav(mKey, onChange) {
  const isFuture = mKey >= addMonths(currentMonth(), 1);
  return el('div', { class: 'monthnav' }, [
    el('button', {
      class: 'monthnav__btn', type: 'button', 'aria-label': 'Mes anterior', text: '‹',
      onclick: () => onChange(addMonths(mKey, -1)),
    }),
    el('button', {
      class: 'monthnav__label',
      type: 'button',
      style: 'border:none;background:none;font:inherit;font-weight:620;cursor:pointer',
      text: monthLabel(mKey, state.settings.locale),
      title: 'Volver al mes actual',
      onclick: () => onChange(currentMonth()),
    }),
    el('button', {
      class: 'monthnav__btn', type: 'button', 'aria-label': 'Mes siguiente', text: '›',
      disabled: isFuture,
      onclick: () => onChange(addMonths(mKey, 1)),
    }),
  ]);

/* Sincronización opcional vía Supabase (REST, sin SDK).
 *
 * Modelo: una sola tabla `records` con (space_id, kind, id, data, updated_at,
 * deleted). Cada dispositivo sube lo que cambió y baja lo que no tiene.
 * Los conflictos se resuelven por `updated_at`: gana la edición más reciente.
 *
 * Sin configurar nada, la app funciona 100% local. Esto sólo se activa cuando
 * cargan URL + clave + código de espacio en Ajustes.
 */

const { state, config, saveConfig, COLLECTIONS, commit, flush } = __req("js/store.js");
const { nowIso } = __req("js/util.js");

const listeners = new Set();
let running = false;

function onSyncChange(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function emit(status, detail = {}) {
  listeners.forEach((fn) => {
    try { fn({ status, ...detail }); } catch (err) { console.error(err); }
  });
}

function isConfigured() {
  return Boolean(config.supabaseUrl && config.supabaseKey && config.spaceId);
}

function syncState() {
  if (!isConfigured()) return 'off';
  if (running) return 'syncing';
  if (!navigator.onLine) return 'offline';
  return config.lastSyncAt ? 'ok' : 'pending';
}

function endpoint(path) {
  const base = String(config.supabaseUrl).replace(/\/+$/, '');
  return `${base}/rest/v1/${path}`;
}

function headers(extra = {}) {
  return {
    apikey: config.supabaseKey,
    Authorization: `Bearer ${config.supabaseKey}`,
    'Content-Type': 'application/json',
    ...extra,
  };
}

/** Aplana el estado a filas sincronizables. */
function localRows() {
  const rows = [];
  COLLECTIONS.forEach((kind) => {
    (state[kind] || []).forEach((r) => {
      rows.push({
        space_id: config.spaceId,
        kind,
        id: r.id,
        data: r,
        updated_at: r.updatedAt || nowIso(),
        deleted: Boolean(r.deleted),
      });
    });
  });
  rows.push({
    space_id: config.spaceId,
    kind: 'settings',
    id: 'settings',
    data: state.settings,
    updated_at: state.settings.updatedAt || nowIso(),
    deleted: false,
  });
  return rows;
}

/** Mezcla una fila remota en el estado local si es más nueva. */
function mergeRow(row) {
  if (row.kind === 'settings') {
    const remote = row.data || {};
    if ((remote.updatedAt || row.updated_at || '') > (state.settings.updatedAt || '')) {
      Object.assign(state.settings, remote, { updatedAt: remote.updatedAt || row.updated_at });
      return true;
    }
    return false;
  }
  if (!COLLECTIONS.includes(row.kind)) return false;
  const coll = state[row.kind];
  const incoming = { ...(row.data || {}), id: row.id, updatedAt: row.data?.updatedAt || row.updated_at, deleted: Boolean(row.deleted) };
  const idx = coll.findIndex((r) => r.id === row.id);
  if (idx === -1) {
    coll.push(incoming);
    return true;
  }
  const mine = coll[idx];
  if ((incoming.updatedAt || '') > (mine.updatedAt || '')) {
    coll[idx] = incoming;
    return true;
  }
  return false;
}

async function request(url, options) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    const res = await fetch(url, { ...options, signal: ctrl.signal });
    if (!res.ok) {
      const text = await res.text().catch(() => '');
      throw new Error(describeError(res.status, text));
    }
    return res;
  } finally {
    clearTimeout(timer);
  }
}

function describeError(status, text) {
  if (status === 401 || status === 403) return 'La clave no es válida o le faltan permisos (revisá la anon key y las policies).';
  if (status === 404) return 'No se encontró la tabla "records". ¿Corriste el script SQL en Supabase?';
  if (status === 400 && /column|schema/i.test(text)) return 'La tabla existe pero no tiene las columnas esperadas. Volvé a correr el script SQL.';
  return `Error ${status}: ${String(text).slice(0, 160) || 'sin detalle'}`;
}

/**
 * Ciclo completo: baja lo nuevo del servidor y sube lo que cambió acá.
 * @param {object} opts silent = no dispara re-render si no hubo cambios
 */
async function sync({ silent = false } = {}) {
  if (!isConfigured()) return { ok: false, reason: 'not-configured' };
  if (running) return { ok: false, reason: 'busy' };
  if (!navigator.onLine) {
    emit('offline');
    return { ok: false, reason: 'offline' };
  }

  running = true;
  emit('syncing');
  flush();

  try {
    /* 1) Bajar todo lo del espacio (los volúmenes acá son chicos: un hogar). */
    const pullUrl = `${endpoint('records')}?space_id=eq.${encodeURIComponent(config.spaceId)}&select=kind,id,data,updated_at,deleted`;
    const res = await request(pullUrl, { method: 'GET', headers: headers() });
    const remote = await res.json();

    let changed = false;
    const remoteById = new Map();
    remote.forEach((row) => {
      remoteById.set(`${row.kind}:${row.id}`, row);
      if (mergeRow(row)) changed = true;
    });

    /* 2) Subir lo que falta o es más nuevo acá. */
    const toPush = localRows().filter((row) => {
      const there = remoteById.get(`${row.kind}:${row.id}`);
      if (!there) return true;
      return (row.updated_at || '') > (there.updated_at || '');
    });

    for (let i = 0; i < toPush.length; i += 100) {
      const chunk = toPush.slice(i, i + 100);
      await request(endpoint('records'), {
        method: 'POST',
        headers: headers({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify(chunk),
      });
    }

    saveConfig({ lastSyncAt: nowIso() });
    if (changed) commit({ silent: false, action: 'sync' });
    else if (!silent) commit({ silent: true });

    emit('ok', { pulled: remote.length, pushed: toPush.length });
    return { ok: true, pulled: remote.length, pushed: toPush.length, changed };
  } catch (err) {
    console.error('Sync falló', err);
    emit('error', { message: err.message });
    return { ok: false, reason: 'error', message: err.message };
  } finally {
    running = false;
  }
}

/** Prueba la conexión sin escribir nada. */
async function testConnection({ url, key, spaceId }) {
  const base = String(url).replace(/\/+$/, '');
  const res = await fetch(`${base}/rest/v1/records?space_id=eq.${encodeURIComponent(spaceId)}&select=id&limit=1`, {
    headers: { apikey: key, Authorization: `Bearer ${key}` },
  });
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(describeError(res.status, text));
  }
  return true;
}

/* -------------------------------------------------- disparadores automáticos */

let debounceTimer = null;

function scheduleSync(delay = 2500) {
  if (!isConfigured() || !config.autoSync) return;
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => sync({ silent: true }), delay);
}

function startAutoSync() {
  if (!isConfigured()) return;
  sync({ silent: true });

  // Al volver a la app y al recuperar conexión, nos ponemos al día.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') scheduleSync(300);
  });
  window.addEventListener('online', () => scheduleSync(500));

  // Red de seguridad por si la otra persona carga algo mientras mirás la pantalla.
  setInterval(() => {
    if (document.visibilityState === 'visible') sync({ silent: true });
  }, 60000);
}

Object.assign(__exports, { onSyncChange, isConfigured, syncState, sync, testConnection, scheduleSync, startAutoSync });
};

__defs["js/calc.js"] = (__exports, __req) => {
/* Cálculos: reparto de gastos, balances, resúmenes mensuales y vencimientos. */

const { list, people, get } = __req("js/store.js");
const { allocate, monthKey, currentMonth, addMonths, clampDay, today, daysBetween } = __req("js/util.js");

/**
 * Cuánto le corresponde pagar a cada persona de un gasto.
 * - equal:  en partes iguales entre quienes participan
 * - single: lo banca una sola persona (splitTo)
 * - custom: porcentajes por persona (splitPct)
 * Devuelve { personId: centavos }, siempre sumando el total exacto.
 */
function sharesOf(expense, roster = people()) {
  const ids = roster.map((p) => p.id);
  const total = expense.amountCents || 0;

  if (expense.splitMode === 'single') {
    const target = expense.splitTo && ids.includes(expense.splitTo) ? expense.splitTo : expense.paidBy;
    const out = {};
    ids.forEach((id) => { out[id] = 0; });
    if (out[target] !== undefined) out[target] = total;
    else if (ids.length) out[ids[0]] = total;
    return out;
  }

  if (expense.splitMode === 'custom' && expense.splitPct) {
    const weights = {};
    ids.forEach((id) => { weights[id] = Number(expense.splitPct[id]) || 0; });
    const sum = Object.values(weights).reduce((s, n) => s + n, 0);
    if (sum > 0) return allocate(total, weights);
  }

  const weights = {};
  ids.forEach((id) => { weights[id] = 1; });
  return allocate(total, weights);
}

/** Gastos de un mes (YYYY-MM), más nuevos primero. */
function expensesOfMonth(mKey) {
  return list('expenses')
    .filter((e) => monthKey(e.date) === mKey)
    .sort((a, b) => (b.date === a.date ? (b.createdAt || b.updatedAt || '').localeCompare(a.createdAt || a.updatedAt || '') : b.date.localeCompare(a.date)));
}

function settlementsOfMonth(mKey) {
  return list('settlements').filter((s) => monthKey(s.date) === mKey);
}

/**
 * Balance acumulado (histórico completo, no sólo el mes): lo que cada uno puso
 * menos lo que le tocaba, ajustado por los pagos entre personas ya hechos.
 * Positivo = le deben. Negativo = debe.
 */
function balances({ upToMonth = null } = {}) {
  const roster = people();
  const net = {};
  roster.forEach((p) => { net[p.id] = 0; });

  const inRange = (dateKey) => !upToMonth || monthKey(dateKey) <= upToMonth;

  list('expenses').forEach((e) => {
    if (!inRange(e.date)) return;
    if (net[e.paidBy] !== undefined) net[e.paidBy] += e.amountCents || 0;
    const shares = sharesOf(e, roster);
    Object.entries(shares).forEach(([id, cents]) => {
      if (net[id] !== undefined) net[id] -= cents;
    });
  });

  list('settlements').forEach((s) => {
    if (!inRange(s.date)) return;
    // "from" le pagó a "to": el que pagó reduce su deuda.
    if (net[s.fromId] !== undefined) net[s.fromId] += s.amountCents || 0;
    if (net[s.toId] !== undefined) net[s.toId] -= s.amountCents || 0;
  });

  return net;
}

/**
 * Transferencias mínimas para dejar todo en cero.
 * Con dos personas es una sola línea; con más, va saldando el mayor deudor
 * contra el mayor acreedor.
 */
function settleUp(net = balances()) {
  const debtors = [];
  const creditors = [];
  Object.entries(net).forEach(([id, cents]) => {
    if (cents < -1) debtors.push({ id, amount: -cents });
    else if (cents > 1) creditors.push({ id, amount: cents });
  });
  debtors.sort((a, b) => b.amount - a.amount);
  creditors.sort((a, b) => b.amount - a.amount);

  const moves = [];
  let i = 0;
  let j = 0;
  while (i < debtors.length && j < creditors.length) {
    const amount = Math.min(debtors[i].amount, creditors[j].amount);
    if (amount > 0) moves.push({ fromId: debtors[i].id, toId: creditors[j].id, amountCents: amount });
    debtors[i].amount -= amount;
    creditors[j].amount -= amount;
    if (debtors[i].amount <= 1) i += 1;
    if (creditors[j].amount <= 1) j += 1;
  }
  return moves;
}

/** Totales del mes: general, por persona (pagado y consumido) y por categoría. */
function monthSummary(mKey) {
  const roster = people();
  const rows = expensesOfMonth(mKey);
  const paid = {};
  const owed = {};
  roster.forEach((p) => { paid[p.id] = 0; owed[p.id] = 0; });

  const byCategory = new Map();
  let total = 0;

  rows.forEach((e) => {
    total += e.amountCents || 0;
    if (paid[e.paidBy] !== undefined) paid[e.paidBy] += e.amountCents || 0;
    const shares = sharesOf(e, roster);
    Object.entries(shares).forEach(([id, cents]) => {
      if (owed[id] !== undefined) owed[id] += cents;
    });
    const key = e.categoryId || 'otros';
    byCategory.set(key, (byCategory.get(key) || 0) + (e.amountCents || 0));
  });

  const categories = [...byCategory.entries()]
    .map(([id, cents]) => ({ id, cents }))
    .sort((a, b) => b.cents - a.cents);

  return { month: mKey, total, count: rows.length, paid, owed, categories, expenses: rows };
}

/** Serie de totales para el gráfico de tendencia. */
function monthlyTrend(months = 6, endMonth = currentMonth()) {
  const out = [];
  for (let i = months - 1; i >= 0; i -= 1) {
    const m = addMonths(endMonth, -i);
    const total = list('expenses')
      .filter((e) => monthKey(e.date) === m)
      .reduce((s, e) => s + (e.amountCents || 0), 0);
    out.push({ month: m, total });
  }
  return out;
}

function averageMonthly(months = 3, endMonth = currentMonth()) {
  const series = monthlyTrend(months + 1, endMonth).slice(0, months); // sin el mes en curso
  const withData = series.filter((s) => s.total > 0);
  if (!withData.length) return 0;
  return Math.round(withData.reduce((s, x) => s + x.total, 0) / withData.length);
}

/* ------------------------------------------------------------ gastos fijos */

/** ¿Ya se cargó este fijo en este mes? Devuelve el gasto o null. */
function fixedExpenseFor(fixedId, mKey) {
  return list('expenses').find((e) => e.fixedId === fixedId && monthKey(e.date) === mKey) || null;
}

/**
 * Estado de los gastos fijos de un mes: pagados, pendientes y vencidos.
 * `dueDate` respeta meses cortos (un fijo el 31 cae el 28 en febrero).
 */
function fixedStatus(mKey) {
  const t = today();
  const rows = list('fixed').filter((f) => f.active !== false).map((f) => {
    const day = clampDay(mKey, f.dayOfMonth);
    const dueDate = `${mKey}-${String(day).padStart(2, '0')}`;
    const expense = fixedExpenseFor(f.id, mKey);
    const daysLeft = daysBetween(t, dueDate);
    let status = 'pending';
    if (expense) status = 'paid';
    else if (daysLeft < 0) status = 'overdue';
    else if (daysLeft <= 5) status = 'due-soon';
    return { fixed: f, dueDate, daysLeft, expense, status };
  });
  rows.sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const pendingCents = rows.filter((r) => !r.expense).reduce((s, r) => s + (r.fixed.amountCents || 0), 0);
  return {
    rows,
    pendingCents,
    pendingCount: rows.filter((r) => !r.expense).length,
    overdueCount: rows.filter((r) => r.status === 'overdue').length,
  };
}

/** Lo que falta pagar este mes = fijos pendientes (para el "te queda por pagar"). */
function projectedMonthTotal(mKey) {
  const summary = monthSummary(mKey);
  const { pendingCents } = fixedStatus(mKey);
  return summary.total + pendingCents;
}

/* ---------------------------------------------------------------- compras */

function shoppingSummary() {
  const items = list('shopping');
  const pending = items.filter((i) => !i.done);
  const done = items.filter((i) => i.done);
  const priceOf = (i) => (i.estPriceCents || i.lastPriceCents || 0) * (i.qty || 1);
  return {
    items,
    pending,
    done,
    estimatedCents: items.reduce((s, i) => s + priceOf(i), 0),
    cartCents: done.reduce((s, i) => s + priceOf(i), 0),
  };
}

/* ------------------------------------------------------------ presupuestos */

function budgetStatus(mKey) {
  const summary = monthSummary(mKey);
  const spent = new Map(summary.categories.map((c) => [c.id, c.cents]));
  return list('categories')
    .filter((c) => (c.budgetCents || 0) > 0)
    .map((c) => {
      const used = spent.get(c.id) || 0;
      const pct = c.budgetCents ? used / c.budgetCents : 0;
      let level = 'good';
      if (pct >= 1) level = 'critical';
      else if (pct >= 0.8) level = 'warning';
      return { category: c, used, budget: c.budgetCents, pct, level };
    })
    .sort((a, b) => b.pct - a.pct);
}

/* --------------------------------------------------------------- metas */

function goalProgress(goal) {
  const saved = (goal.contributions || []).reduce((s, c) => s + (c.amountCents || 0), 0);
  const target = goal.targetCents || 0;
  return {
    saved,
    target,
    pct: target > 0 ? Math.min(1, saved / target) : 0,
    remaining: Math.max(0, target - saved),
  };
}

/* ------------------------------------------------------------ exportar CSV */

function toCsv(mKey = null) {
  const rows = mKey ? expensesOfMonth(mKey) : list('expenses').slice().sort((a, b) => a.date.localeCompare(b.date));
  const roster = people();
  const header = ['Fecha', 'Descripción', 'Categoría', 'Monto', 'Pagó', ...roster.map((p) => `Le toca a ${p.name}`), 'Nota'];
  const esc = (v) => {
    const s = String(v ?? '');
    return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const lines = [header.map(esc).join(';')];
  rows.forEach((e) => {
    const shares = sharesOf(e, roster);
    const cat = get('categories', e.categoryId);
    lines.push([
      e.date,
      e.description,
      cat ? cat.name : e.categoryId,
      ((e.amountCents || 0) / 100).toFixed(2).replace('.', ','),
      (get('people', e.paidBy) || {}).name || '',
      ...roster.map((p) => ((shares[p.id] || 0) / 100).toFixed(2).replace('.', ',')),
      e.note || '',
    ].map(esc).join(';'));
  });
  return `﻿${lines.join('\n')}`;
}

const { el, toCents, fromCents, today, uid, addMonths, clampDay, monthKey } = __req("js/util.js");
const store = __req("js/store.js");
const { sharesOf } = __req("js/calc.js");
const {

function defaultDateFor(mKey) {

__defs["js/views/expenses.js"] = (__exports, __req) => {
/* Listado de gastos del mes, con búsqueda y filtros. */

const { el, currentMonth, dateLabel, today } = __req("js/util.js");
const store = __req("js/store.js");
const { expensesOfMonth, sharesOf, toCsv } = __req("js/calc.js");
const {
  fmt, monthNav, listCard, listItem, emptyState, input, select, toast,
} = __req("js/ui.js");
const { openExpenseForm } = __req("js/views/expense-form.js");
const { navigate } = __req("js/router.js");
const { download } = __req("js/util.js");

const filters = { q: '', categoryId: '', paidBy: '' };

function renderExpenses(root, params) {
  const mKey = params.month || currentMonth();
  const locale = store.state.settings.locale;
  const roster = store.people();
  const all = expensesOfMonth(mKey);

  root.append(monthNav(mKey, (m) => navigate('gastos', { month: m })));

  /* --- filtros --- */
  const searchInput = input({
    type: 'search', placeholder: 'Buscar gasto…', value: filters.q,
    dataset: { focusKey: 'buscador' },
    oninput: (e) => { filters.q = e.target.value; paint(); },
  });
  const catSel = select(
    [{ value: '', label: 'Todas las categorías' }, ...store.categories().map((c) => ({ value: c.id, label: `${c.emoji} ${c.name}` }))],
    filters.categoryId,
    { onchange: (e) => { filters.categoryId = e.target.value; paint(); } },
  );
  const paidSel = select(
    [{ value: '', label: 'Pagó cualquiera' }, ...roster.map((p) => ({ value: p.id, label: `Pagó ${p.name}` }))],
    filters.paidBy,
    { onchange: (e) => { filters.paidBy = e.target.value; paint(); } },
  );

  root.append(el('section', { class: 'card' }, [
    el('div', { style: 'margin-bottom:10px' }, [searchInput]),
    el('div', { class: 'grid-2' }, [catSel, paidSel]),
  ]));

  const container = el('div');
  root.append(container);

  function paint() {
    container.replaceChildren();
    const q = filters.q.trim().toLowerCase();
    const rows = all.filter((e) => {
      if (filters.categoryId && e.categoryId !== filters.categoryId) return false;
      if (filters.paidBy && e.paidBy !== filters.paidBy) return false;
      if (q) {
        const hay = `${e.description} ${store.category(e.categoryId).name} ${e.note || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (!rows.length) {
      container.append(el('section', { class: 'card' }, [
        all.length
          ? emptyState('🔍', 'Nada con ese filtro', 'Probá con otra búsqueda o limpiá los filtros.', 'Limpiar filtros', () => {
            filters.q = ''; filters.categoryId = ''; filters.paidBy = '';
            navigate('gastos', { month: mKey });
          })
          : emptyState('🧾', 'Mes sin gastos', 'Cargá el primero con el botón ＋.', 'Cargar gasto', () => openExpenseForm(null, { date: defaultDateFor(mKey) })),
      ]));
      return;
    }

    const total = rows.reduce((s, e) => s + (e.amountCents || 0), 0);

    /* Agrupado por día, como un extracto bancario. */
    const groups = new Map();
    rows.forEach((e) => {
      if (!groups.has(e.date)) groups.set(e.date, []);
      groups.get(e.date).push(e);
    });

    const children = [];
    [...groups.entries()].forEach(([date, items]) => {
      const dayTotal = items.reduce((s, e) => s + (e.amountCents || 0), 0);
      children.push(el('div', { class: 'list__group row row--between' }, [
        el('span', { text: dateLabel(date, locale) }),
        el('span', { class: 'num', text: fmt(dayTotal) }),
      ]));
      items.forEach((e) => {
        const cat = store.category(e.categoryId);
        const payer = store.person(e.paidBy);
        const shares = sharesOf(e, roster);
        const mine = store.me();
        const myShare = shares[mine.id] || 0;
        children.push(listItem({
          icon: cat.emoji,
          title: e.description,
          subtitle: `Pagó ${payer.name} · te toca ${fmt(myShare)}${e.installment ? ` · cuota ${e.installment.n}/${e.installment.of}` : ''}`,
          amount: e.amountCents,
          onClick: () => openExpenseForm(e),
        }));
      });
    });

    container.append(listCard(children, {
      title: `${rows.length} gasto${rows.length === 1 ? '' : 's'}`,
      meta: fmt(total),
    }));

    container.append(el('div', { class: 'row', style: 'gap:8px;margin-top:4px' }, [
      el('button', {
        class: 'btn btn--sm grow', type: 'button', text: '⬇ Exportar CSV del mes',
        onclick: () => {
          download(`gastos-${mKey}.csv`, toCsv(mKey), 'text/csv');
          toast('CSV descargado. Se abre en Excel o Sheets.');
        },
      }),
    ]));
  }

  paint();
}

function defaultDateFor(mKey) {
  const t = today();
  return t.slice(0, 7) === mKey ? t : `${mKey}-01`;
}

Object.assign(__exports, { renderExpenses });
};

__defs["js/views/fixed.js"] = (__exports, __req) => {
/* Gastos fijos: alquiler, expensas, servicios y suscripciones del mes. */

const { el, currentMonth, clampDay, toCents, fromCents, monthLabel } = __req("js/util.js");
const store = __req("js/store.js");
const { fixedStatus } = __req("js/calc.js");
const {
  fmt, monthNav, listCard, listItem, emptyState, field, input, select, segmented,
  footerButtons, openSheet, closeSheet, toast, confirmSheet,
} = __req("js/ui.js");
const { navigate } = __req("js/router.js");

const STATUS_TAG = {
  paid: { level: 'good', text: 'Pagado' },
  overdue: { level: 'critical', text: 'Vencido' },
  'due-soon': { level: 'warning', text: 'Pronto' },
  pending: null,
};

function openFixedForm(existing = null) {
  const roster = store.people();
  const isEdit = Boolean(existing);
  const draft = existing ? { ...existing } : {
    name: '',
    amountCents: 0,
    categoryId: 'alquiler',
    dayOfMonth: 1,
    paidBy: store.me().id,
    splitMode: 'equal',
    splitTo: null,
    splitPct: null,
    active: true,
    variable: false,
  };

  const nameInput = input({ type: 'text', placeholder: 'Alquiler, Edenor, Netflix…', value: draft.name });
  const amountInput = input({
    class: 'input input--amount', type: 'text', inputmode: 'decimal',
    value: draft.amountCents ? String(fromCents(draft.amountCents)).replace('.', ',') : '',
    'aria-label': 'Monto',
  });
  const daySel = select(
    Array.from({ length: 31 }, (_, i) => ({ value: i + 1, label: `Día ${i + 1}` })),
    draft.dayOfMonth,
    { onchange: (e) => { draft.dayOfMonth = Number(e.target.value); } },
  );
  const catSel = select(
    store.categories().map((c) => ({ value: c.id, label: `${c.emoji} ${c.name}` })),
    draft.categoryId,
    { onchange: (e) => { draft.categoryId = e.target.value; } },
  );
  const payerSeg = segmented(
    roster.map((p) => ({ value: p.id, label: p.name })),
    roster.some((p) => p.id === draft.paidBy) ? draft.paidBy : roster[0].id,
    (v) => { draft.paidBy = v; },
  );
  const splitSeg = segmented(
    roster.length === 2
      ? [
        { value: 'equal', label: 'Mitad y mitad' },
        { value: `single:${roster[0].id}`, label: `Solo ${roster[0].name}` },
        { value: `single:${roster[1].id}`, label: `Solo ${roster[1].name}` },
      ]
      : [{ value: 'equal', label: 'Partes iguales' }, { value: 'single', label: 'Una sola persona' }],
    draft.splitMode === 'single' && roster.length === 2 ? `single:${draft.splitTo}` : draft.splitMode,
    (v) => {
      if (v.startsWith('single')) {
        draft.splitMode = 'single';
        draft.splitTo = v.includes(':') ? v.slice(7) : draft.paidBy;
      } else {
        draft.splitMode = 'equal';
        draft.splitTo = null;
      }
    },
  );
  const variableBox = input({ type: 'checkbox', class: 'switch__box', checked: draft.variable });

  function save() {
    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); toast('Ponele un nombre.'); return; }
    const payload = {
      name,
      amountCents: toCents(amountInput.value),
      categoryId: draft.categoryId,
      dayOfMonth: draft.dayOfMonth,
      paidBy: draft.paidBy,
      splitMode: draft.splitMode,
      splitTo: draft.splitTo,
      splitPct: null,
      active: true,
      variable: variableBox.checked,
    };
    if (isEdit) store.update('fixed', existing.id, payload);
    else store.add('fixed', payload);
    closeSheet();
    toast(isEdit ? 'Gasto fijo actualizado.' : 'Gasto fijo agregado.');
  }

  async function del() {
    const ok = await confirmSheet('¿Borrar el fijo?', `Se deja de recordar "${existing.name}". Los gastos ya cargados quedan.`, {
      confirmText: 'Borrar', danger: true,
    });

    el('div', { class: 'grid-2', style: 'margin-bottom:13px' }, [

      el('span', { class: 'switch' }, [

          el('span', { class: 'field__label', style: 'margin:0', text: 'Monto variable' }),
