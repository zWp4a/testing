/** Marca un fijo como pagado creando el gasto real del mes. */
function markPaid(row, mKey) {
  const f = row.fixed;
  const create = (cents, paidBy) => {
    store.add('expenses', {
      date: row.dueDate,
      description: f.name,
      amountCents: cents,
      categoryId: f.categoryId,
      paidBy,
      splitMode: f.splitMode || 'equal',
      splitTo: f.splitTo || null,
      splitPct: f.splitPct || null,
      note: '',
      fixedId: f.id,
      createdAt: new Date().toISOString(),
    });
    toast(`${f.name} marcado como pagado.`);
  };

  if (!f.variable && f.amountCents > 0) {
    create(f.amountCents, f.paidBy);
    return;
  }

  const roster = store.people();
  const amountInput = input({
    class: 'input input--amount', type: 'text', inputmode: 'decimal',
    value: f.amountCents ? String(fromCents(f.amountCents)).replace('.', ',') : '',
    'aria-label': 'Monto',
  });
  let payer = roster.some((p) => p.id === f.paidBy) ? f.paidBy : roster[0].id;
  openSheet(`Pagar ${f.name}`, el('div', {}, [
    el('p', { class: 'muted small', style: 'margin-bottom:12px', text: `Vencimiento: ${row.dueDate.slice(8)} de ${monthLabel(mKey, store.state.settings.locale)}.` }),
    field('¿Cuánto vino?', amountInput),
    field('¿Quién pagó?', segmented(roster.map((p) => ({ value: p.id, label: p.name })), payer, (v) => { payer = v; })),
    footerButtons('Marcar pagado', () => {
      const cents = toCents(amountInput.value);
      if (cents <= 0) { toast('Poné el importe.'); return; }
      create(cents, payer);
      // Guardamos el último importe para que la próxima vez arranque cerca.
      store.update('fixed', f.id, { amountCents: cents });
      closeSheet();
    }),
  ]));
  setTimeout(() => amountInput.focus(), 60);
}

function renderFixed(root, params) {
  const mKey = params.month || currentMonth();
  const { rows, pendingCents, pendingCount } = fixedStatus(mKey);
  const locale = store.state.settings.locale;

  root.append(monthNav(mKey, (m) => navigate('fijos', { month: m })));

  if (!rows.length) {
    root.append(el('section', { class: 'card' }, [
      emptyState('📅', 'Sin gastos fijos cargados',
        'Cargá el alquiler, las expensas y los servicios una vez y la app te los recuerda todos los meses.',
        'Agregar el primero', () => openFixedForm()),
    ]));
    return;
  }

  const paidCents = rows.filter((r) => r.expense).reduce((s, r) => s + (r.expense.amountCents || 0), 0);
  root.append(el('div', { class: 'tiles' }, [
    el('div', { class: 'tile' }, [
      el('p', { class: 'tile__label', text: 'Ya pagado' }),
      el('p', { class: 'tile__value', text: fmt(paidCents) }),
    ]),
    el('div', { class: 'tile' }, [
      el('p', { class: 'tile__label', text: 'Falta pagar' }),
      el('p', { class: 'tile__value', text: fmt(pendingCents) }),
      el('p', { class: 'tile__delta tile__delta--flat', text: `${pendingCount} pendiente${pendingCount === 1 ? '' : 's'}` }),
    ]),
  ]));

  const items = rows.map((r) => {
    const cat = store.category(r.fixed.categoryId);
    const paid = Boolean(r.expense);
    const action = paid
      ? el('button', {
        class: 'btn btn--sm btn--ghost', type: 'button', text: 'Deshacer',
        onclick: async (ev) => {
          ev.stopPropagation();
          const ok = await confirmSheet('¿Desmarcar el pago?', `Se borra el gasto de ${fmt(r.expense.amountCents)} de "${r.fixed.name}".`, { confirmText: 'Desmarcar', danger: true });
          if (ok) { store.remove('expenses', r.expense.id); toast('Marcado como pendiente otra vez.'); }
        },
      })
      : el('button', {
        class: 'btn btn--sm btn--primary', type: 'button', text: 'Pagar',
        onclick: (ev) => { ev.stopPropagation(); markPaid(r, mKey); },
      });

    return listItem({
      icon: cat.emoji,
      title: r.fixed.name,
      subtitle: paid
        ? `Pagó ${store.person(r.expense.paidBy).name} · ${fmt(r.expense.amountCents)}`
        : `Vence el ${clampDay(mKey, r.fixed.dayOfMonth)} · ${r.fixed.variable ? 'monto variable' : fmt(r.fixed.amountCents)}`,
      tag: STATUS_TAG[r.status],
      trailing: action,
      onClick: () => openFixedForm(r.fixed),
    });
  });

  root.append(listCard(items, {
    title: `Fijos de ${monthLabel(mKey, locale)}`,
    meta: `${rows.length} en total`,
  }));

  const pendientes = rows.filter((r) => !r.expense && !r.fixed.variable && r.fixed.amountCents > 0);
  root.append(el('div', { class: 'stack', style: 'margin-top:4px' }, [
    pendientes.length > 1 ? el('button', {
      class: 'btn btn--block', type: 'button',
      text: `Marcar todos los pendientes como pagados (${fmt(pendientes.reduce((s, r) => s + r.fixed.amountCents, 0))})`,
      onclick: async () => {
        const ok = await confirmSheet('¿Marcar todo como pagado?', `Se crean ${pendientes.length} gastos con los montos habituales.`, { confirmText: 'Sí, marcar' });
        if (!ok) return;
        pendientes.forEach((r) => markPaid(r, mKey));
        toast(`${pendientes.length} fijos cargados.`);
      },
    }) : null,
    el('button', { class: 'btn btn--block', type: 'button', text: '＋ Nuevo gasto fijo', onclick: () => openFixedForm() }),
  ]));
}

Object.assign(__exports, { openFixedForm, renderFixed });
};

__defs["js/views/shopping.js"] = (__exports, __req) => {
/* Lista de compras compartida: se marca en el súper y se cierra como gasto. */

const { el, toCents, fromCents, today } = __req("js/util.js");
const store = __req("js/store.js");
const { shoppingSummary } = __req("js/calc.js");
const {
  fmt, emptyState, field, input, select, segmented, footerButtons,
  openSheet, closeSheet, toast, confirmSheet,
} = __req("js/ui.js");

function itemPrice(item) {
  return (item.estPriceCents || item.lastPriceCents || 0) * (item.qty || 1);
}

function openItemForm(existing) {
  const draft = { ...existing };
  const nameInput = input({ type: 'text', value: draft.name });
  const qtyInput = input({ type: 'number', min: '0', step: '0.5', inputmode: 'decimal', value: draft.qty || 1 });
  const unitInput = input({ type: 'text', placeholder: 'kg, l, paq…', value: draft.unit || '' });
  const priceInput = input({
    type: 'text', inputmode: 'decimal', placeholder: '0,00',
    value: draft.estPriceCents ? String(fromCents(draft.estPriceCents)).replace('.', ',') : '',
  });
  const stapleBox = input({ type: 'checkbox', class: 'switch__box', checked: draft.staple });

  function save() {
    const name = nameInput.value.trim();
    if (!name) { toast('Falta el nombre.'); return; }
    store.update('shopping', existing.id, {
      name,
      qty: Number(qtyInput.value) || 1,
      unit: unitInput.value.trim(),
      estPriceCents: toCents(priceInput.value),
      staple: stapleBox.checked,
    });
    closeSheet();
  }

  async function del() {
    const ok = await confirmSheet('¿Sacarlo de la lista?', `Se elimina "${existing.name}".`, { confirmText: 'Sacar', danger: true });
    if (!ok) return;
    store.remove('shopping', existing.id);
    toast('Producto eliminado.', { action: 'Deshacer', onAction: () => store.restore('shopping', existing.id) });
  }

  openSheet('Editar producto', el('div', {}, [
    field('Producto', nameInput),
    el('div', { class: 'grid-2', style: 'margin-bottom:13px' }, [
      field('Cantidad', qtyInput),
      field('Unidad', unitInput),
    ]),
    field('Precio estimado (por unidad)', priceInput,
      existing.lastPriceCents ? `La última vez salió ${fmt(existing.lastPriceCents)}.` : 'Opcional: sirve para estimar el total.'),
    el('label', { class: 'field' }, [
      el('span', { class: 'switch' }, [
        el('span', {}, [
          el('span', { class: 'field__label', style: 'margin:0', text: 'Producto habitual' }),
          el('span', { class: 'field__hint', style: 'margin-top:2px', text: 'Vuelve solo a la lista cuando empezás una compra nueva.' }),
        ]),
        stapleBox,
      ]),
    ]),
    footerButtons('Guardar', save, {
      extra: el('button', { class: 'btn btn--danger', type: 'button', text: 'Borrar', onclick: del }),
    }),
  ]));
}

/** Cierra la compra: crea el gasto con lo marcado y limpia la lista. */
function openCheckout(summary) {
  const roster = store.people();
  const marked = summary.done;
  if (!marked.length) { toast('Marcá primero lo que compraste.'); return; }

  const amountInput = input({
    class: 'input input--amount', type: 'text', inputmode: 'decimal',
    value: summary.cartCents ? String(fromCents(summary.cartCents)).replace('.', ',') : '',
    'aria-label': 'Total',
  });
  let payer = store.me().id;
  let splitMode = 'equal';
  const catSel = select(
    store.categories().map((c) => ({ value: c.id, label: `${c.emoji} ${c.name}` })),
    'super',
  );
  const clearBox = input({ type: 'checkbox', class: 'switch__box', checked: true });

  function save() {
    const cents = toCents(amountInput.value);
    if (cents <= 0) { toast('Poné cuánto pagaste.'); return; }
    store.add('expenses', {
      date: today(),
      description: `Compra (${marked.length} producto${marked.length === 1 ? '' : 's'})`,
      amountCents: cents,
      categoryId: catSel.value,
      paidBy: payer,
      splitMode,
      splitTo: splitMode === 'single' ? payer : null,
      splitPct: null,
      note: marked.map((i) => i.name).join(', ').slice(0, 500),
      createdAt: new Date().toISOString(),
    });

    // Guardamos el precio estimado como "último precio" para la próxima vuelta.
    marked.forEach((i) => {
      if (i.estPriceCents) store.update('shopping', i.id, { lastPriceCents: i.estPriceCents });
    });

    if (clearBox.checked) {
      marked.forEach((i) => {
        if (i.staple) store.update('shopping', i.id, { done: false });
        else store.remove('shopping', i.id);
      });
    }
    closeSheet();
    toast(`Compra de ${fmt(cents)} cargada como gasto.`);
  }

  openSheet('Cerrar la compra', el('div', {}, [
    el('p', { class: 'muted small', style: 'margin-bottom:12px', text: `${marked.length} producto${marked.length === 1 ? '' : 's'} marcado${marked.length === 1 ? '' : 's'}. El estimado era ${fmt(summary.cartCents)}.` }),
    field('Total que pagaste', amountInput),
    field('Categoría', catSel),
    field('¿Quién pagó?', segmented(roster.map((p) => ({ value: p.id, label: p.name })), payer, (v) => { payer = v; })),
    field('División', segmented([
      { value: 'equal', label: 'Mitad y mitad' },
      { value: 'single', label: 'Lo banca quien pagó' },
    ], 'equal', (v) => { splitMode = v; })),
    el('label', { class: 'field' }, [
      el('span', { class: 'switch' }, [
        el('span', {}, [
          el('span', { class: 'field__label', style: 'margin:0', text: 'Vaciar la lista' }),
          el('span', { class: 'field__hint', style: 'margin-top:2px', text: 'Los productos habituales vuelven destildados.' }),
        ]),
        clearBox,
      ]),
    ]),
    footerButtons('Cargar como gasto', save),
  ]));
}

function renderShopping(root) {
  const summary = shoppingSummary();
  const { items, pending, done } = summary;

  /* --- alta rápida --- */
  const quick = input({
    type: 'text', placeholder: 'Agregar producto…', enterkeyhint: 'done', autocomplete: 'off',
    dataset: { focusKey: 'quickadd' },
    onkeydown: (e) => { if (e.key === 'Enter') addQuick(); },
  });
  function addQuick() {
    const name = quick.value.trim();
    if (!name) return;
    // "2 leche" o "leche x2" se entienden como cantidad + producto.
    let qty = 1;
    let label = name;
    const m1 = name.match(/^(\d+(?:[.,]\d+)?)\s+(.+)$/);
    const m2 = name.match(/^(.+?)\s*[xX]\s*(\d+(?:[.,]\d+)?)$/);
    if (m1) { qty = Number(m1[1].replace(',', '.')); label = m1[2]; }
    else if (m2) { label = m2[1]; qty = Number(m2[2].replace(',', '.')); }

    store.add('shopping', {
      name: label.charAt(0).toUpperCase() + label.slice(1),
      qty, unit: '', estPriceCents: 0, done: false, staple: false, lastPriceCents: 0,
    });
    quick.value = '';

__defs["js/views/goals.js"] = (__exports, __req) => {
/* Metas de ahorro compartidas: vacaciones, mudanza, el fondo de emergencia. */

const { el, toCents, fromCents, today, uid, daysBetween } = __req("js/util.js");
const store = __req("js/store.js");
const { goalProgress } = __req("js/calc.js");
const {
  fmt, emptyState, barList, field, input, segmented,
  footerButtons, openSheet, closeSheet, toast, confirmSheet, avatar,
} = __req("js/ui.js");

function openGoalForm(existing = null) {
  const isEdit = Boolean(existing);
  const nameInput = input({ type: 'text', placeholder: 'Vacaciones, mudanza, auto…', value: existing?.name || '' });
  const targetInput = input({
    class: 'input input--amount', type: 'text', inputmode: 'decimal',
    value: existing?.targetCents ? String(fromCents(existing.targetCents)).replace('.', ',') : '',
    'aria-label': 'Objetivo',
  });
  const deadlineInput = input({ type: 'date', value: existing?.deadline || '' });

  function save() {
    const name = nameInput.value.trim();
    if (!name) { toast('Ponele un nombre a la meta.'); return; }
    const payload = {
      name,
      targetCents: toCents(targetInput.value),
      deadline: deadlineInput.value || '',
    };
    if (isEdit) store.update('goals', existing.id, payload);
    else store.add('goals', { ...payload, contributions: [] });
    closeSheet();
    toast(isEdit ? 'Meta actualizada.' : 'Meta creada.');
  }

  async function del() {
    const ok = await confirmSheet('¿Borrar la meta?', `Se elimina "${existing.name}" y lo que anotaron ahí.`, { confirmText: 'Borrar', danger: true });
    if (!ok) return;
    store.remove('goals', existing.id);
    toast('Meta eliminada.', { action: 'Deshacer', onAction: () => store.restore('goals', existing.id) });
  }

  openSheet(isEdit ? 'Editar meta' : 'Nueva meta', el('div', {}, [
    field('Nombre', nameInput),
    field('Objetivo', targetInput),
    field('Fecha límite (opcional)', deadlineInput, 'Con esto te calculamos cuánto guardar por mes.'),
    footerButtons(isEdit ? 'Guardar' : 'Crear meta', save, {
      extra: isEdit ? el('button', { class: 'btn btn--danger', type: 'button', text: 'Borrar', onclick: del }) : null,
    }),
  ]));
}

function openContribution(goal) {
  const roster = store.people();
  const amountInput = input({ class: 'input input--amount', type: 'text', inputmode: 'decimal', 'aria-label': 'Monto' });
  let personId = store.me().id;
  const dateInput = input({ type: 'date', value: today() });

  function save() {
    const cents = toCents(amountInput.value);
    if (!cents) { toast('Poné cuánto guardaron.'); return; }
    const contributions = [...(goal.contributions || []), {
      id: uid(), date: dateInput.value || today(), personId, amountCents: cents,
    }];
    store.update('goals', goal.id, { contributions });
    closeSheet();
    toast(`${fmt(cents)} sumados a ${goal.name}.`);
  }

  openSheet(`Guardar para ${goal.name}`, el('div', {}, [
    field('Monto', amountInput),
    field('¿Quién puso?', segmented(roster.map((p) => ({ value: p.id, label: p.name })), personId, (v) => { personId = v; })),
    field('Fecha', dateInput),
    footerButtons('Sumar', save),
  ]));
  setTimeout(() => amountInput.focus(), 60);
}

function monthlyNeeded(goal, progress) {
  if (!goal.deadline || progress.remaining <= 0) return null;
  const days = daysBetween(today(), goal.deadline);
  if (days <= 0) return null;
  const months = Math.max(1, Math.round(days / 30));
  return { months, perMonth: Math.ceil(progress.remaining / months) };
}

function renderGoals(root) {
  const goals = store.list('goals');

  if (!goals.length) {
    root.append(el('section', { class: 'card' }, [
      emptyState('🎯', 'Sin metas todavía',
        'Un viaje, la mudanza, el fondo para imprevistos. Anotá cuánto quieren juntar y cuánto van poniendo.',
        'Crear una meta', () => openGoalForm()),
    ]));
    return;
  }

  goals.forEach((goal) => {
    const p = goalProgress(goal);
    const need = monthlyNeeded(goal, p);
    const byPerson = new Map();
    (goal.contributions || []).forEach((c) => {
      byPerson.set(c.personId, (byPerson.get(c.personId) || 0) + c.amountCents);
    });

    const card = el('section', { class: 'card' }, [
      el('div', { class: 'card__head' }, [
        el('h2', { class: 'card__title grow', style: 'font-size:16px', text: goal.name }),
        el('button', { class: 'linkbtn', type: 'button', text: 'Editar', onclick: () => openGoalForm(goal) }),
      ]),
      el('div', { class: 'row row--between', style: 'align-items:baseline;margin-bottom:8px' }, [
        el('span', { style: 'font-size:24px;font-weight:700;letter-spacing:-.02em', class: 'num', text: fmt(p.saved) }),
        el('span', { class: 'muted small', text: `de ${fmt(p.target)}` }),
      ]),
      barList([{
        label: `${Math.round(p.pct * 100)}% juntado`,
        value: p.saved,
        level: p.pct >= 1 ? 'good' : undefined,
      }], { max: Math.max(p.target, p.saved, 1) }),
      el('p', { class: 'field__hint', style: 'margin-top:9px' }, [
        p.remaining > 0
          ? `Faltan ${fmt(p.remaining)}${need ? ` · ${fmt(need.perMonth)} por mes durante ${need.months} ${need.months === 1 ? 'mes' : 'meses'}` : ''}`
          : '¡Meta cumplida! 🎉',
      ]),
    ]);

    if (byPerson.size) {
      card.append(el('div', { class: 'divider' }));
      card.append(el('div', { class: 'stack' }, [...byPerson.entries()].map(([pid, cents]) => {
        const per = store.person(pid);
        return el('div', { class: 'row' }, [
          avatar(per),
          el('span', { class: 'grow small', text: per.name }),
          el('span', { class: 'small num', style: 'font-weight:620', text: fmt(cents) }),
        ]);
      })));
    }

    card.append(el('button', {
      class: 'btn btn--primary btn--block', type: 'button', style: 'margin-top:14px',
      text: '＋ Sumar ahorro', onclick: () => openContribution(goal),
    }));

    const contribs = (goal.contributions || []).slice().sort((a, b) => b.date.localeCompare(a.date));
    if (contribs.length) {
      card.append(el('details', { style: 'margin-top:12px' }, [
        el('summary', { class: 'small muted', style: 'cursor:pointer', text: `Ver los ${contribs.length} aportes` }),
        el('div', { class: 'stack', style: 'margin-top:10px' }, contribs.map((c) => el('div', { class: 'row' }, [
          el('span', { class: 'grow small', text: `${store.person(c.personId).name} · ${c.date}` }),
          el('span', { class: 'small num', text: fmt(c.amountCents) }),
          el('button', {
            class: 'iconbtn', type: 'button', 'aria-label': 'Borrar aporte', text: '✕',
            style: 'width:30px;height:30px;font-size:13px',
            onclick: () => {
              store.update('goals', goal.id, {
                contributions: (goal.contributions || []).filter((x) => x.id !== c.id),
              });
              toast('Aporte borrado.');
            },
          }),
        ]))),
      ]));
    }

    root.append(card);
  });

  root.append(el('button', {
    class: 'btn btn--block', type: 'button', text: '＋ Nueva meta', onclick: () => openGoalForm(),
  }));
}

Object.assign(__exports, { renderGoals });
};

    ]),

      configured
        ? `Los datos se comparten con quien tenga el mismo código.${last ? ` Última vez: ${last}.` : ''}`

  const fileInput = el('input', {

      el('button', {

        onclick: () => { download(`nuestra-casa-${today()}.json`, store.exportData()); toast('Backup descargado.'); },
      }),
      el('button', {
        class: 'btn btn--block', type: 'button', text: '⬆ Importar backup',
        onclick: () => fileInput.click(),
      }),
      el('button', {
        class: 'btn btn--block', type: 'button', text: '⬇ Exportar todo a CSV',
        onclick: () => { download(`gastos-completo-${today()}.csv`, toCsv(), 'text/csv'); toast('CSV descargado.'); },
      }),
      fileInput,
    ]),
  ]));

  /* --- zona peligrosa --- */
  root.append(el('section', { class: 'card' }, [
    el('div', { class: 'card__head' }, [el('h2', { class: 'card__title grow', text: 'Otras cosas' })]),
    el('div', { class: 'stack' }, [
      el('button', {
        class: 'btn btn--block', type: 'button', text: '🎯 Metas de ahorro', onclick: () => navigate('metas'),
      }),
      store.list('expenses').length === 0 ? el('button', {
        class: 'btn btn--block', type: 'button', text: '✨ Cargar datos de ejemplo',
        onclick: () => { store.seedDemo(); toast('Listo, mirá el resumen.'); navigate('resumen'); },
      }) : null,
      el('button', {
        class: 'btn btn--block btn--danger', type: 'button', text: 'Borrar todo y empezar de cero',
        onclick: async () => {
          const ok = await confirmSheet('¿Borrar todo?',
            'Se borran gastos, fijos, listas y metas de este dispositivo. Descargá un backup antes si no estás seguro.',
            { confirmText: 'Borrar todo', danger: true });

          navigate('resumen');
        },

  root.append(el('p', {
    class: 'muted small center',

  }));
}

Object.assign(__exports, { renderSettings });
};

  { value: 'PEN', label: 'Sol peruano' },
  { value: 'BRL', label: 'Real brasileño' },

    const myName = meInput.value.trim() || 'Yo';
    const otherName = otherInput.value.trim() || 'Mi pareja';
    store.update('people', roster[0].id, { name: myName });
    store.update('people', roster[1].id, { name: otherName });
    store.setSettings({ currency: currencySel.value, defaultPayer: roster[0].id });
    store.saveConfig({ meId: roster[0].id, onboarded: true });

const { renderDashboard } = __req("js/views/dashboard.js");

const { renderFixed } = __req("js/views/fixed.js");
const { renderShopping } = __req("js/views/shopping.js");
const { renderGoals } = __req("js/views/goals.js");
const { renderSettings } = __req("js/views/settings.js");
const { openExpenseForm } = __req("js/views/expense-form.js");

/* ------------------------------------------------------------------ rutas */

defineRoute('resumen', renderDashboard);
defineRoute('gastos', renderExpenses);
defineRoute('fijos', renderFixed);
defineRoute('compras', renderShopping);
defineRoute('metas', renderGoals);
defineRoute('ajustes', renderSettings);

/* Enlace de invitación: #/unir/<base64 con url, clave y código> */
defineRoute('unir', (root, params, segments) => {
  const payload = segments[0];
  let cfg = null;
  try {
    cfg = JSON.parse(atob(decodeURIComponent(payload || '')));
  } catch {
    cfg = null;
  }
  if (!cfg || !cfg.u || !cfg.k || !cfg.s) {
    toast('El enlace de invitación no es válido.');
    navigate('resumen');
    return;
  }
  store.saveConfig({ supabaseUrl: cfg.u, supabaseKey: cfg.k, spaceId: cfg.s });
  sync.sync().then((r) => {
    toast(r.ok ? '¡Listo! Ya están conectados.' : `No se pudo conectar: ${r.message || ''}`);
    navigate('resumen');
  });
  root.append(Object.assign(document.createElement('div'), {
    className: 'card center muted',
    textContent: 'Conectando con el hogar compartido…',

applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if ((store.config.theme || 'auto') === 'auto') applyTheme('auto');
});

document.getElementById('btn-theme').addEventListener('click', () => {
  const next = cycleTheme();
  store.saveConfig({ theme: next });
  applyTheme(next);
  toast(`Tema: ${{ auto: 'automático', light: 'claro', dark: 'oscuro' }[next]}`);
});

/* ------------------------------------------------------------- botón + */

document.getElementById('btn-fab').addEventListener('click', () => {
  const route = current();
  if (route && route.name === 'compras') {
    document.querySelector('.quickadd .input')?.focus();
    return;
  }
  const month = route?.params?.month;
  const isPast = month && month !== currentMonth();
  openExpenseForm(null, isPast ? { date: `${month}-01` } : {});
});

const syncBtn = document.getElementById('btn-sync');

function paintSyncButton(status) {
  syncBtn.classList.toggle('is-spinning', status === 'syncing');
  const labels = {
    off: 'Sincronización desactivada',
    ok: 'Al día · tocá para sincronizar',
    syncing: 'Sincronizando…',
    offline: 'Sin conexión: se guarda igual',
    error: 'Hubo un problema al sincronizar',
    pending: 'Tocá para sincronizar',
  };
  syncBtn.title = labels[status] || labels.off;
  syncBtn.setAttribute('aria-label', syncBtn.title);
